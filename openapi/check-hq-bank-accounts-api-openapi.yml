openapi: 3.2.0
info:
  title: check-api Bank Accounts API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Bank Accounts
paths:
  /bank_accounts:
    post:
      summary: Create a bank account
      description: 'Defines a bank account, and associates it with an existing company, contractor, or employee.


        One of `employee`, `company`, or `contractor` is required.'
      operationId: create-a-bank-account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: string
                  description: ID of the [employee](https://docs.checkhq.com/reference/the-employee-object) on the account
                company:
                  type: string
                  description: ID of the [company](https://docs.checkhq.com/reference/company) on the account
                contractor:
                  type: string
                  description: ID of the [contractor](https://docs.checkhq.com/reference/the-contractor-object) on the account
                raw_bank_account:
                  type: object
                  required:
                  - account_number
                  - routing_number
                  - subtype
                  properties:
                    account_number:
                      type: string
                      description: The account’s account number
                    routing_number:
                      type: string
                      description: The account’s routing number
                    institution_name:
                      type: string
                      description: The name of the bank holding the account
                    subtype:
                      type: string
                      description: The account’s subtype. Values may be `checking` or `savings`
                plaid_bank_account:
                  type: object
                  required:
                  - plaid_processor_token
                  properties:
                    plaid_processor_token:
                      type: string
                      description: A Check processor token retrieved from the Plaid API
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with this bank account
                  format: json
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Bank Accounts
    get:
      summary: List bank accounts
      description: Lists all bank accounts.
      operationId: list-bank-accounts
      parameters:
      - name: company
        in: query
        description: Return bank accounts for this [company](https://docs.checkhq.com/reference/company) ID.
        schema:
          type: string
      - name: employee
        in: query
        description: 'Return bank accounts for these [employee](https://docs.checkhq.com/reference/the-employee-object) IDs. You can specify multiple employee IDs by repeating this parameter:

          `?employee=emp_abc123&employee=emp_xyz789`. '
        schema:
          type: string
      - name: contractor
        in: query
        description: Return bank accounts for this [contractor](https://docs.checkhq.com/reference/the-contractor-object) ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of bank accounts returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/MetadataListFilter'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n\t{\n    \"id\": \"bnk_abc\",\n    \"employee\": \"emp_xyz\",\n    \"raw_bank_account\": {\n      \"institution_name\": \"Chase\",\n      \"account_number\": \"112233445\",\n      \"routing_number\": \"011401533\",\n      \"subtype\": \"checking\"\n    },\n    \"metadata\": {}\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: bnk_abc
                    employee:
                      type: string
                      example: emp_xyz
                    raw_bank_account:
                      type: object
                      properties:
                        institution_name:
                          type: string
                          example: Chase
                        account_number:
                          type: string
                          example: '112233445'
                        routing_number:
                          type: string
                          example: '011401533'
                        subtype:
                          type: string
                          example: checking
                    metadata:
                      type: object
                      properties: {}
      deprecated: false
      tags:
      - Bank Accounts
  /bank_accounts/{bank_account}:
    patch:
      summary: Update a bank account
      description: 'Updates a bank account.


        **Note: **Only “raw” bank accounts may be updated with this call. Plaid processor token-based bank accounts may not be updated.'
      operationId: update-a-bank-account
      parameters:
      - name: bank_account
        in: path
        description: ID of the bank account
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - raw_bank_account
              properties:
                raw_bank_account:
                  type: object
                  required:
                  - account_number
                  - routing_number
                  - subtype
                  properties:
                    account_number:
                      type: string
                      description: The account’s account number
                    routing_number:
                      type: string
                      description: The account’s routing number
                    institution_name:
                      type: string
                      description: The name of the bank holding the account
                    subtype:
                      type: string
                      description: The account’s subtype. Values may be `checking` or `savings`
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with this bank account
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Bank Accounts
    delete:
      summary: Delete a bank account
      description: Deletes the specified bank account.
      operationId: delete-a-bank-account
      parameters:
      - name: bank_account
        in: path
        description: ID of the bank account to delete
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Bank Accounts
  /bank_accounts/{bank_account}/reveal:
    get:
      summary: Reveal account number
      description: Reveal the unmasked account number of both raw and plaid bank accounts. Reach out to Check to get support for this feature
      operationId: reveal-account-number
      parameters:
      - name: bank_account
        in: path
        description: The ID of the bank account that you want the account number for
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"bnk_Wr8oItjaUJgvLNbN2MJa\",\n    \"company\": \"com_iI59t4yqiBbpkMuabvU6\",\n    \"status\": \"ownership_verified\",\n    \"raw_bank_account\": {\n        \"institution_name\": \"sksrsgitagelm\",\n        \"account_number\": \"770608869\", // New account number in this response only\n        \"account_number_last_four\": \"8869\",\n        \"routing_number\": \"559435723\",\n        \"type\": \"depository\",\n        \"subtype\": \"checking\"\n    },\n    \"metadata\": {},\n    \"supported_payment_types\": []\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: bnk_Wr8oItjaUJgvLNbN2MJa
                  company:
                    type: string
                    example: com_iI59t4yqiBbpkMuabvU6
                  status:
                    type: string
                    example: ownership_verified
                  raw_bank_account:
                    type: object
                    properties:
                      institution_name:
                        type: string
                        example: sksrsgitagelm
                      account_number:
                        type: string
                        example: '770608869'
                      account_number_last_four:
                        type: string
                        example: '8869'
                      routing_number:
                        type: string
                        example: '559435723'
                      type:
                        type: string
                        example: depository
                      subtype:
                        type: string
                        example: checking
                  metadata:
                    type: object
                    properties: {}
                  supported_payment_types:
                    type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Bank Accounts
components:
  parameters:
    MetadataListFilter:
      name: metadata
      in: query
      description: Return only results whose metadata contains every given key and value, for example `metadata[external_id]=123`. Pass keys using bracket notation. Multiple keys are combined with AND. Brackets must be URL-encoded in request URLs (`metadata%5Bkey%5D=value`).
      schema:
        type: object
        additionalProperties:
          type: string
      style: deepObject
      explode: true
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
