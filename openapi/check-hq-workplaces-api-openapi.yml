  /workplaces/{workplace}:
    patch:
      summary: Update a workplace
      description: Updates the specified workplace.
      operationId: update-a-workplace
      parameters:
      - name: workplace
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  description: Company ID to associate with the workplace.
                name:
                  type: string
                  description: Name for the workplace.
                address:
                  type: object
                  required:
                  - line1
                  - city
                  - state
                  - postal_code
                  properties:
                    line1:
                      type: string
                      description: Street address or PO Box
                    line2:
                      type: string
                      description: Apartment, suite, unit, or building
                    city:
                      type: string
                      description: City, district, suburb, town, or village
                    state:
                      type: string
                      description: 2-digit state code
                    postal_code:
                      type: string
                      description: 5-digit postal code or zip code
                    country:
                      type: string
                      description: Read only.
                      default: US
                active:
                  type: boolean
                  description: Indicates whether the workplace can be associated with an employee for payroll
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the workplace
                  format: json
