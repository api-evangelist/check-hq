security:
- sec0: []
tags:
- name: Workplaces
paths:
  /workplaces:
    post:
      summary: Create a workplace
      description: Creates a new workplace.
      operationId: create-a-workplace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - address
              properties:
                company:
                  type: string
                  description: The company ID to associate with the workplace
                name:
                  type: string
                  description: The name for the workplace
                address:
                  type: object
                  required:
                  - line1
                  - city
                  - state
                  - postal_code
                  properties:
                    line1:
                      type: string
                      description: Street address or PO Box
                    line2:
                      type: string
                      description: Apartment, suite, unit, or building
                    city:
                      type: string
                      description: City, district, suburb, town, or village
                    state:
                      type: string
                      description: 2-digit state code
                    postal_code:
                      type: string
                      description: 5-digit postal code or zip code
                    country:
                      type: string
                      description: Read only.
                      default: US
                active:
                  type: boolean
                  description: Indicates whether the workplace can be associated with an employee for payroll
                  default: true
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the workplace
                  format: json
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"wrk_oRgjEaRycoCPuS5TqVkm\",\n  \"name\": \"New York Office\",\n  \"address\": {\n    \"line1\": \"200 Park Ave\",\n    \"line2\": null,\n    \"city\": \"New York\",\n    \"state\": \"NY\",\n    \"postal_code\": \"10166\",\n    \"country\": \"US\"\n  },\n  \"company\": \"com_P7JPeBhb8hH23iiReDQ5\",\n  \"active\": true,\n  \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: wrk_oRgjEaRycoCPuS5TqVkm
                  name:
                    type: string
                    example: New York Office
                  address:
                    type: object
                    properties:
                      line1:
                        type: string
                        example: 200 Park Ave
                      line2: {}
                      city:
                        type: string
                        example: New York
                      state:
                        type: string
                        example: NY
                      postal_code:
                        type: string
                        example: '10166'
                      country:
                        type: string
                        example: US
                  company:
                    type: string
                    example: com_P7JPeBhb8hH23iiReDQ5
                  active:
                    type: boolean
                    example: true
                    default: true
                  metadata:
                    type: object
                    properties: {}
      deprecated: false
      tags:
      - Workplaces
    get:
      summary: List workplaces
      description: Returns a list of workplaces.
      operationId: list-workplaces
      parameters:
      - name: company
        in: query
        description: Return workplaces for this company ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of workplaces returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/MetadataListFilter'
