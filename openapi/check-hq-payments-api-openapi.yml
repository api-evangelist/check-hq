openapi: 3.2.0
info:
  title: check-api Payments API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Payments
paths:
  /payments:
    get:
      summary: List payments
      description: ''
      operationId: list-payments
      parameters:
      - name: payroll
        in: query
        description: Return all payments, including debits and credits, related to a particular payroll ID
        schema:
          type: string
      - name: payroll_item
        in: query
        description: Return payments related to a particular parent payroll_item ID
        schema:
          type: string
      - name: contractor_payment
        in: query
        description: Return payments related to a particular parent contractor payment ID
        schema:
          type: string
      - name: parent_id
        in: query
        description: Return payments whose `parent_id` matches the given value. Repeat the parameter to match any of multiple parent IDs (OR), for example `?parent_id=pay_abc&parent_id=cor_def`. Values are matched against the `parent_id` returned on payment responses, including correction IDs (`cor_...`) when a correction is the parent. At most 100 values are allowed per request.
        schema:
          type: string
      - name: company
        in: query
        description: Return payments related to a particular company ID
        schema:
          type: string
      - name: direction
        in: query
        description: Return payments with direction
        schema:
          type: string
          enum:
          - credit
          - debit
      - name: amount_min
        in: query
        description: Return payments where amount ≥ an amount
        schema:
          type: string
      - name: amount_max
        in: query
        description: Return payments where amount ≤ an amount
        schema:
          type: string
      - name: type
        in: query
        description: Return payments with type
        schema:
          type: string
          enum:
          - company_cash_requirement
          - employee_net_pay
          - net_pay_refund
          - collection
          - refund
      - name: completion_date_after
        in: query
        description: Return payments whose expected completion date is on or after the specified date
        schema:
          type: string
          format: date
      - name: completion_date_before
        in: query
        description: Return payments whose expected completion date is on or before the specified date
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: Number of payments returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"pyt_uzasLBvddSm6aJkHGwQw\",\n      \"status\": \"paid\",\n      \"amount\": \"4522.0400\",\n      \"type\": \"company_cash_requirement\",\n      \"parent_type\": \"payroll\",\n      \"parent_id\": \"pay_aPKCtxqbi1jDNEWRrz9w\",\n      \"payment_attempts\": [\n        {\n          \"id\": \"pya_LUHvXtQBhkNM22xIk8K1\",\n          \"created_at\": \"2022-02-18T20:17:13.033205Z\",\n          \"expected_completion_date\": \"2022-02-23\",\n          \"status\": \"paid\",\n          \"failure_code\": null,\n          \"payment_method\": \"ach\",\n          \"payment_instrument\": \"bnk_W7hjDGn6sU1d3U8dr9bq\",\n          \"wire_details\": null,\n          \"ach_details\": {\n\t          \"ach_trace_id\": \"ABC12300080\",\n            \"description\": \"PAYMENT\",\n            \"transaction_type_code\": \"PCR\"\n          }\n        }\n      ],\n      \"can_retry\": false,\n      \"can_refund\": false,\n      \"can_cancel\": false,\n  \t\t\"cancel_deadline\": \"2022-02-19T17:00:00.000Z\",\n      \"direction\": \"debit\",\n      \"company\": \"com_ENA4k8LMHbgpV07GLGSv\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pyt_uzasLBvddSm6aJkHGwQw
                        status:
                          type: string
                          example: paid
                        amount:
                          type: string
                          example: '4522.0400'
                        type:
                          type: string
                          example: company_cash_requirement
                        parent_type:
                          type: string
                          description: The parent type of the payment. One of `payroll`, `payroll_item`, `contractor_payment`, `collection`, `refund`, or `correction`. Payments that fund a correction report `correction` as the parent type.
                          example: payroll
                        parent_id:
                          type: string
                          description: The id of the parent of the payment (see `parent_type`). An id can be a `pay_...`, `itm_...`, `cpa_...`, `pyt_...`, or `cor_...` id. When `parent_type` is `correction`, this is the correction's id.
                          example: pay_aPKCtxqbi1jDNEWRrz9w
                        payment_attempts:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: pya_LUHvXtQBhkNM22xIk8K1
                              created_at:
                                type: string
                                example: '2022-02-18T20:17:13.033205Z'
                              expected_completion_date:
                                type: string
                                example: '2022-02-23'
                              status:
                                type: string
                                example: paid
                              failure_code: {}
                              payment_method:
                                type: string
                                example: ach
                              payment_instrument:
                                type: string
                                example: bnk_W7hjDGn6sU1d3U8dr9bq
                              wire_details: {}
                              ach_details:
                                type: object
                                properties:
                                  ach_trace_id:
                                    type: string
                                    example: ABC12300080
                                  description:
                                    type: string
                                    example: PAYMENT
                                  transaction_type_code:
                                    type: string
                                    example: PCR
                        can_retry:
                          type: boolean
                          example: false
                          default: true
                        can_refund:
                          type: boolean
                          example: false
                          default: true
                        can_cancel:
                          type: boolean
                          example: false
                          default: true
                        cancel_deadline:
                          type: string
                          example: '2022-02-19T17:00:00.000Z'
                        direction:
                          type: string
                          example: debit
                        company:
                          type: string
                          example: com_ENA4k8LMHbgpV07GLGSv
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payments
  /payments/{payment}/cancel:
    post:
      summary: Cancel a payment
      description: ''
      operationId: cancel-a-payment
      parameters:
      - name: payment
        in: path
        schema:
          type: string
          default: ID of payment desired for cancellation
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"pyt_vIFHhvyGN47ej1upyIT8\",\n    \"status\": \"failed\",\n    \"amount\": \"4522.0400\",\n    \"type\": \"employee_net_pay\",\n    \"parent_type\": \"payroll_item\",\n    \"parent_id\": \"itm_ENA4k8LMHbgpV07GLGSv\",\n    \"payment_attempts\": [\n        {\n            \"id\": \"pya_Kgl6ERboridVSfv4XKdT\",\n            \"created_at\": \"2022-02-18T20:14:40.713837Z\",\n            \"expected_completion_date\": \"2022-02-23\",\n            \"status\": \"canceled\",\n            \"failure_code\": null,\n            \"payment_method\": \"ach\",\n            \"payment_instrument\": \"bnk_W7hjDGn6sU1d3U8dr9bq\",\n            \"wire_details\": null\n        }\n    ],\n    \"can_retry\": false,\n    \"can_refund\": false,\n    \"can_cancel\": false,\n    \"cancel_deadline\": \"2022-02-19T17:00:00.000Z\",\n    \"direction\": \"credit\",\n    \"company\": \"com_ENA4k8LMHbgpV07GLGSv\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: pyt_vIFHhvyGN47ej1upyIT8
                  status:
                    type: string
                    example: failed
                  amount:
                    type: string
                    example: '4522.0400'
                  type:
                    type: string
                    example: employee_net_pay
                  parent_type:
                    type: string
                    description: The parent type of the payment. One of `payroll`, `payroll_item`, `contractor_payment`, `collection`, `refund`, or `correction`. Payments that fund a correction report `correction` as the parent type.
                    example: payroll_item
                  parent_id:
                    type: string
                    description: The id of the parent of the payment (see `parent_type`). An id can be a `pay_...`, `itm_...`, `cpa_...`, `pyt_...`, or `cor_...` id. When `parent_type` is `correction`, this is the correction's id.
                    example: itm_ENA4k8LMHbgpV07GLGSv
                  payment_attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pya_Kgl6ERboridVSfv4XKdT
                        created_at:
                          type: string
                          example: '2022-02-18T20:14:40.713837Z'
                        expected_completion_date:
                          type: string
                          example: '2022-02-23'
                        status:
                          type: string
                          example: canceled
                        failure_code: {}
                        payment_method:
                          type: string
                          example: ach
                        payment_instrument:
                          type: string
                          example: bnk_W7hjDGn6sU1d3U8dr9bq
                        wire_details: {}
                  can_retry:
                    type: boolean
                    example: false
                    default: true
                  can_refund:
                    type: boolean
                    example: false
                    default: true
                  can_cancel:
                    type: boolean
                    example: false
                    default: true
                  cancel_deadline:
                    type: string
                    example: '2022-02-19T17:00:00.000Z'
                  direction:
                    type: string
                    example: credit
                  company:
                    type: string
                    example: com_ENA4k8LMHbgpV07GLGSv
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payments
  /payments/{payment}/refund:
    post:
      summary: Refund a payment
      description: ''
      operationId: refund-a-payment
      parameters:
      - name: payment
        in: path
        description: ID of payment desired for refund
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"pyt_vIFHhvyGN47ej1upyIT8\",\n    \"status\": \"refunded\",\n    \"amount\": \"4522.0400\",\n    \"type\": \"employee_net_pay\",\n    \"parent_type\": \"payroll_item\",\n    \"parent_id\": \"itm_ENA4k8LMHbgpV07GLGSv\",\n    \"payment_attempts\": [\n        {\n            \"id\": \"pya_GaeJoEAzbqqc2D9GMfOF\",\n            \"created_at\": \"2022-02-18T21:32:44.957364Z\",\n            \"expected_completion_date\": \"2022-02-25\",\n            \"status\": \"refunded\",\n            \"failure_code\": null,\n            \"payment_method\": \"manual\",\n            \"payment_instrument\": null,\n            \"wire_details\": null\n        },\n        {\n            \"id\": \"pya_Kgl6ERboridVSfv4XKdT\",\n            \"created_at\": \"2022-02-18T20:14:40.713837Z\",\n            \"expected_completion_date\": \"2022-02-23\",\n            \"status\": \"failed\",\n            \"failure_code\": \"account_closed\",\n            \"payment_method\": \"ach\",\n            \"payment_instrument\": \"bnk_W7hjDGn6sU1d3U8dr9bq\",\n            \"wire_details\": null\n        }\n    ],\n    \"can_retry\": false,\n    \"can_refund\": false,\n    \"can_cancel\": false,\n    \"cancel_deadline\": \"2022-02-19T17:00:00.000Z\",\n    \"direction\": \"credit\",\n    \"company\": \"com_ENA4k8LMHbgpV07GLGSv\"\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payments
  /payments/{payment}/retry:
    post:
      summary: Retry a payment
      description: ''
      operationId: retry-a-payment
      parameters:
      - name: payment
        in: path
        description: ID of the payment desired for retry.
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                use_wire:
                  type: boolean
                  description: Boolean parameter indicating whether a wire retry is desired
                  default: false
                bank_account:
                  type: string
                  description: Parameter to accept a new bank account to use to retry this payment.
                payment_type:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"pyt_vIFHhvyGN47ej1upyIT8\",\n    \"status\": \"failed\",\n    \"amount\": \"4522.0400\",\n    \"type\": \"company_cash_requirement\",\n    \"parent_type\": \"payroll\",\n    \"parent_id\": \"pay_ENA4k8LMHbgpV07GLGSv\",\n    \"payment_attempts\": [\n        {\n            \"id\": \"pya_GaeJoEAzbqqc2D9GMfOF\",\n            \"created_at\": \"2022-02-18T21:32:44.957364Z\",\n            \"expected_completion_date\": \"2022-02-25\",\n            \"status\": \"failed\",\n            \"failure_code\": null,\n            \"payment_method\": \"wire\",\n            \"payment_instrument\": null,\n            \"wire_details\": {\n                \"account_number\": \"3302826020\",\n                \"routing_number\": \"121140399\",\n                \"bank_name\": \"Silicon Valley Bank\",\n                \"account_name\": \"SVB for benefit of CHECK TECHNOLOGIES\",\n                \"account_address\": \"3003 Tasman Drive, Santa Clara, CA 95054\",\n                \"amount\": 4522.04\n            }\n        },\n        {\n            \"id\": \"pya_Kgl6ERboridVSfv4XKdT\",\n            \"created_at\": \"2022-02-18T20:14:40.713837Z\",\n            \"expected_completion_date\": \"2022-02-23\",\n            \"status\": \"failed\",\n            \"failure_code\": null,\n            \"payment_method\": \"ach\",\n            \"payment_instrument\": \"bnk_W7hjDGn6sU1d3U8dr9bq\",\n            \"wire_details\": null\n        }\n    ],\n    \"can_retry\": false,\n    \"can_refund\": false,\n    \"direction\": \"debit\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: pyt_vIFHhvyGN47ej1upyIT8
                  status:
                    type: string
                    example: failed
                  amount:
                    type: string
                    example: '4522.0400'
                  type:
                    type: string
                    example: company_cash_requirement
                  parent_type:
                    type: string
                    description: The parent type of the payment. One of `payroll`, `payroll_item`, `contractor_payment`, `collection`, `refund`, or `correction`. Payments that fund a correction report `correction` as the parent type.
                    example: payroll
                  parent_id:
                    type: string
                    description: The id of the parent of the payment (see `parent_type`). An id can be a `pay_...`, `itm_...`, `cpa_...`, `pyt_...`, or `cor_...` id. When `parent_type` is `correction`, this is the correction's id.
                    example: pay_ENA4k8LMHbgpV07GLGSv
                  payment_attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pya_GaeJoEAzbqqc2D9GMfOF
                        created_at:
                          type: string
                          example: '2022-02-18T21:32:44.957364Z'
                        expected_completion_date:
                          type: string
                          example: '2022-02-25'
                        status:
                          type: string
                          example: failed
                        failure_code: {}
                        payment_method:
                          type: string
                          example: wire
                        payment_instrument: {}
                        wire_details:
                          type: object
                          properties:
                            account_number:
                              type: string
                              example: '3302826020'
                            routing_number:
                              type: string
                              example: '121140399'
                            bank_name:
                              type: string
                              example: Silicon Valley Bank
                            account_name:
                              type: string
                              example: SVB for benefit of CHECK TECHNOLOGIES
                            account_address:
                              type: string
                              example: 3003 Tasman Drive, Santa Clara, CA 95054
                            amount:
                              type: number
                              example: 4522.04
                              default: 0
                  can_retry:
                    type: boolean
                    example: false
                    default: true
                  can_refund:
                    type: boolean
                    example: false
                    default: true
                  direction:
                    type: string
                    example: debit
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payments
