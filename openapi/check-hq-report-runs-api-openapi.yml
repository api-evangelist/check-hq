openapi: 3.2.0
info:
  title: check-api Report Runs API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Report Runs
paths:
  /report_runs:
    post:
      summary: Create a report run
      description: Creates a report run. Poll `GET /report_runs/{id}` or listen for `report_run` webhooks until `status` is `completed` or `failed`. When completed, download the file from `result.url`. Report generation may take up to 20 minutes. Data that report runs rely on may be up to 10 minutes out of date. Create requests are rate limited to 1 per second per partner, with a maximum of 20 report runs generating at once.
      operationId: create-a-report-run
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - report
              - parameters
              properties:
                report:
                  type: string
                  description: Report to generate. One of `payroll_journal` or `payroll_summary`.
                  enum:
                  - payroll_journal
                  - payroll_summary
                company:
                  type: string
                  description: Company ID to scope the report.
                parameters:
                  type: object
                  description: Parameters for the selected report. Required fields depend on the report type.
                  properties:
                    payday_from:
                      type: string
                      format: date
                      description: Inclusive start of the payday range (YYYY-MM-DD).
                    payday_to:
                      type: string
                      format: date
                      description: Inclusive end of the payday range (YYYY-MM-DD).
                    additional_columns:
                      type: array
                      description: Optional extra columns. Allowed values are `employee.id`, `contractor.id`, `payroll.id` (payroll journal only), or `employee.metadata.<key>`.
                      items:
                        type: string
                    payroll:
                      type: string
                      description: Optional payroll ID to scope the report to a single payroll.
                    group_by:
                      type: string
                      description: Payroll journal only. When set to `workplace`, groups rows by workplace.
                      enum:
                      - workplace
                    contractors:
                      type: boolean
                      description: Include contractor payments.
                      default: false
                    taxable_wages:
                      type: boolean
                      description: Include taxable wage columns.
                      default: false
                    gross_taxable_wages:
                      type: boolean
                      description: Include gross taxable wage columns.
                      default: false
                metadata:
                  type: object
                  description: Additional loosely structured information to associate with the report run.
                  additionalProperties: true
            examples:
              Payroll journal:
                value:
                  report: payroll_journal
                  company: com_MkBYRtUviD6kYO0b85H8
                  parameters:
                    payday_from: '2025-01-01'
                    payday_to: '2025-03-31'
                    additional_columns:
                    - employee.id
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"run_w4wDuqfuSqpMrSXbERrL\",\n  \"report\": \"payroll_journal\",\n  \"status\": \"generating\",\n  \"company\": \"com_MkBYRtUviD6kYO0b85H8\",\n  \"created_at\": \"2024-11-03T19:52:15Z\",\n  \"completed_at\": null,\n  \"parameters\": {\n    \"payday_from\": \"2025-01-01\",\n    \"payday_to\": \"2025-03-31\",\n    \"additional_columns\": [\n      \"employee.id\"\n    ],\n    \"contractors\": false,\n    \"taxable_wages\": false,\n    \"gross_taxable_wages\": false\n  },\n  \"result\": null,\n  \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Report run ID.
                    example: run_w4wDuqfuSqpMrSXbERrL
                  report:
                    type: string
                    description: Report to generate. One of `payroll_journal` or `payroll_summary`.
                    enum:
                    - payroll_journal
                    - payroll_summary
                    example: payroll_journal
                  status:
                    type: string
                    description: One of `generating`, `completed`, or `failed`. New report runs start as `generating`.
                    enum:
                    - generating
                    - completed
                    - failed
                    example: generating
                  company:
                    type: string
                    nullable: true
                    description: Company ID to scope the report. Required for some report types.
                    example: com_MkBYRtUviD6kYO0b85H8
                  created_at:
                    type: string
                    format: date-time
                    description: When the report run was created.
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the report run finished successfully or failed.
                  parameters:
                    type: object
                    description: Parameters for the selected report. Required fields depend on the report type.
                    properties:
                      payday_from:
                        type: string
                        format: date
                        description: Inclusive start of the payday range (YYYY-MM-DD).
                      payday_to:
                        type: string
                        format: date
                        description: Inclusive end of the payday range (YYYY-MM-DD).
                      additional_columns:
                        type: array
                        description: Optional extra columns. Allowed values are `employee.id`, `contractor.id`, `payroll.id` (payroll journal only), or `employee.metadata.<key>`.
                        items:
                          type: string
                      payroll:
                        type: string
                        description: Optional payroll ID to scope the report to a single payroll.
                      group_by:
                        type: string
                        description: Payroll journal only. When set to `workplace`, groups rows by workplace.
                        enum:
                        - workplace
                      contractors:
                        type: boolean
                        description: Include contractor payments.
                        default: false
                      taxable_wages:
                        type: boolean
                        description: Include taxable wage columns.
                        default: false
                      gross_taxable_wages:
                        type: boolean
                        description: Include gross taxable wage columns.
                        default: false
                  result:
                    type: object
                    nullable: true
                    description: Present when the report run has completed successfully. Use `url` to download the generated file. Download URLs are short-lived.
                    properties:
                      url:
                        type: string
                        description: URL that returns a short-lived download for the generated report file.
                  metadata:
                    type: object
                    description: Additional loosely structured information associated with the report run.
                    additionalProperties: true
      deprecated: false
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Optional idempotency key. Replays the first response when the same key is reused.
        schema:
          type: string
      tags:
      - Report Runs
    get:
      summary: List report runs
      description: Returns a list of report runs for the authenticated partner, newest first. Expired report runs are omitted.
      operationId: list-report-runs
      parameters:
      - name: company
        in: query
        description: Return report runs for this company ID.
        schema:
          type: string
      - name: report_type
        in: query
        description: Return report runs of this report type. One of `payroll_journal` or `payroll_summary`.
        schema:
          type: string
          enum:
          - payroll_journal
          - payroll_summary
      - name: status
        in: query
        description: Return report runs in this status. One of `generating`, `completed`, or `failed`.
        schema:
          type: string
          enum:
          - generating
          - completed
          - failed
      - name: limit
        in: query
        description: Number of report runs returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"run_w4wDuqfuSqpMrSXbERrL\",\n      \"report\": \"payroll_journal\",\n      \"status\": \"completed\",\n      \"company\": \"com_MkBYRtUviD6kYO0b85H8\",\n      \"created_at\": \"2024-11-03T19:52:15Z\",\n      \"completed_at\": \"2024-11-03T19:55:11Z\",\n      \"parameters\": {\n        \"payday_from\": \"2025-01-01\",\n        \"payday_to\": \"2025-03-31\",\n        \"additional_columns\": [\n          \"employee.id\"\n        ],\n        \"contractors\": false,\n        \"taxable_wages\": false,\n        \"gross_taxable_wages\": false\n      },\n      \"result\": {\n        \"url\": \"https://sandbox.checkhq.com/report_runs/run_w4wDuqfuSqpMrSXbERrL/download\"\n      },\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"run_w4wDuqfuSqpMrSXbERrL\",\n      \"report\": \"payroll_journal\",\n      \"status\": \"generating\",\n      \"company\": \"com_MkBYRtUviD6kYO0b85H8\",\n      \"created_at\": \"2024-11-03T19:52:15Z\",\n      \"completed_at\": null,\n      \"parameters\": {\n        \"payday_from\": \"2025-01-01\",\n        \"payday_to\": \"2025-03-31\",\n        \"additional_columns\": [\n          \"employee.id\"\n        ],\n        \"contractors\": false,\n        \"taxable_wages\": false,\n        \"gross_taxable_wages\": false\n      },\n      \"result\": null,\n      \"metadata\": {}\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Report run ID.
                          example: run_w4wDuqfuSqpMrSXbERrL
                        report:
                          type: string
                          description: Report to generate. One of `payroll_journal` or `payroll_summary`.
                          enum:
                          - payroll_journal
                          - payroll_summary
                          example: payroll_journal
                        status:
                          type: string
                          description: One of `generating`, `completed`, or `failed`. New report runs start as `generating`.
                          enum:
                          - generating
                          - completed
                          - failed
                          example: generating
                        company:
                          type: string
                          nullable: true
                          description: Company ID to scope the report. Required for some report types.
                          example: com_MkBYRtUviD6kYO0b85H8
                        created_at:
                          type: string
                          format: date-time
                          description: When the report run was created.
                        completed_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: When the report run finished successfully or failed.
                        parameters:
                          type: object
                          description: Parameters for the selected report. Required fields depend on the report type.
                          properties:
                            payday_from:
                              type: string
                              format: date
                              description: Inclusive start of the payday range (YYYY-MM-DD).
                            payday_to:
                              type: string
                              format: date
                              description: Inclusive end of the payday range (YYYY-MM-DD).
                            additional_columns:
                              type: array
                              description: Optional extra columns. Allowed values are `employee.id`, `contractor.id`, `payroll.id` (payroll journal only), or `employee.metadata.<key>`.
                              items:
                                type: string
                            payroll:
                              type: string
                              description: Optional payroll ID to scope the report to a single payroll.
                            group_by:
                              type: string
                              description: Payroll journal only. When set to `workplace`, groups rows by workplace.
                              enum:
                              - workplace
                            contractors:
                              type: boolean
                              description: Include contractor payments.
                              default: false
                            taxable_wages:
                              type: boolean
                              description: Include taxable wage columns.
                              default: false
                            gross_taxable_wages:
                              type: boolean
                              description: Include gross taxable wage columns.
                              default: false
                        result:
                          type: object
                          nullable: true
                          description: Present when the report run has completed successfully. Use `url` to download the generated file. Download URLs are short-lived.
                          properties:
                            url:
                              type: string
                              description: URL that returns a short-lived download for the generated report file.
                        metadata:
                          type: object
                          description: Additional loosely structured information associated with the report run.
                          additionalProperties: true
      deprecated: false
      tags:
      - Report Runs
  /report_runs/{report_run}:
    get:
      summary: Get a report run
      description: Returns the specified report run.
      operationId: get-a-report-run
      parameters:
      - name: report_run
        in: path
        description: ID of the report run to return.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"run_w4wDuqfuSqpMrSXbERrL\",\n  \"report\": \"payroll_journal\",\n  \"status\": \"completed\",\n  \"company\": \"com_MkBYRtUviD6kYO0b85H8\",\n  \"created_at\": \"2024-11-03T19:52:15Z\",\n  \"completed_at\": \"2024-11-03T19:55:11Z\",\n  \"parameters\": {\n    \"payday_from\": \"2025-01-01\",\n    \"payday_to\": \"2025-03-31\",\n    \"additional_columns\": [\n      \"employee.id\"\n    ],\n    \"contractors\": false,\n    \"taxable_wages\": false,\n    \"gross_taxable_wages\": false\n  },\n  \"result\": {\n    \"url\": \"https://sandbox.checkhq.com/report_runs/run_w4wDuqfuSqpMrSXbERrL/download\"\n  },\n  \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Report run ID.
                    example: run_w4wDuqfuSqpMrSXbERrL
                  report:
                    type: string
                    description: Report to generate. One of `payroll_journal` or `payroll_summary`.
                    enum:
                    - payroll_journal
                    - payroll_summary
                    example: payroll_journal
                  status:
                    type: string
                    description: One of `generating`, `completed`, or `failed`. New report runs start as `generating`.
                    enum:
                    - generating
                    - completed
                    - failed
                    example: generating
                  company:
                    type: string
                    nullable: true
                    description: Company ID to scope the report. Required for some report types.
                    example: com_MkBYRtUviD6kYO0b85H8
                  created_at:
                    type: string
                    format: date-time
                    description: When the report run was created.
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the report run finished successfully or failed.
                  parameters:
                    type: object
                    description: Parameters for the selected report. Required fields depend on the report type.
                    properties:
                      payday_from:
                        type: string
                        format: date
                        description: Inclusive start of the payday range (YYYY-MM-DD).
                      payday_to:
                        type: string
                        format: date
                        description: Inclusive end of the payday range (YYYY-MM-DD).
                      additional_columns:
                        type: array
                        description: Optional extra columns. Allowed values are `employee.id`, `contractor.id`, `payroll.id` (payroll journal only), or `employee.metadata.<key>`.
                        items:
                          type: string
                      payroll:
                        type: string
                        description: Optional payroll ID to scope the report to a single payroll.
                      group_by:
                        type: string
                        description: Payroll journal only. When set to `workplace`, groups rows by workplace.
                        enum:
                        - workplace
                      contractors:
                        type: boolean
                        description: Include contractor payments.
                        default: false
                      taxable_wages:
                        type: boolean
                        description: Include taxable wage columns.
                        default: false
                      gross_taxable_wages:
                        type: boolean
                        description: Include gross taxable wage columns.
                        default: false
                  result:
                    type: object
                    nullable: true
                    description: Present when the report run has completed successfully. Use `url` to download the generated file. Download URLs are short-lived.
                    properties:
                      url:
                        type: string
                        description: URL that returns a short-lived download for the generated report file.
                  metadata:
                    type: object
                    description: Additional loosely structured information associated with the report run.
                    additionalProperties: true
      deprecated: false
      tags:
      - Report Runs
  /report_runs/{report_run}/download:
    get:
      summary: Download a report run
      description: Returns a short-lived download URL for the generated report artifact. The report run must be in the `completed` status and its artifact must not have expired.
      operationId: download-a-report-run
      parameters:
      - name: report_run
        in: path
        description: ID of the report run to download
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"download_url\": \"https://check-reportruns.s3.amazonaws.com/ssn_report_output/2026/06/24/run_Bw6EkMDmxCPeVQ2eYzLu.zip?...\",\n  \"extension\": \"zip\",\n  \"content_type\": \"application/zip\"\n}"
      deprecated: false
      tags:
      - Report Runs
