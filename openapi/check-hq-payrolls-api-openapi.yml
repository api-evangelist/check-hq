                Result:
                  value: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - preview_superseded
                  message:
                    type: string
                required:
                - error
                - message
              examples:
                Conflict:
                  summary: Conflict
                  value:
                    error:
                      type: preview_superseded
                      message: The payroll was re-previewed after the timestamp provided in preview_started_at. Please re-fetch the payroll to get the latest preview before approving.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preview_started_at:
                  type: string
