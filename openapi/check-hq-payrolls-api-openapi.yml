    patch:
      summary: Update a payroll
      description: Updates the specified payroll. For payrolls attached to a correction as replacements, `payday` may change only within the same bounds enforced at creation, and nested `items` and `contractor_payments` must keep `payment_method` `manual`. `correction` may be included only to restate the payroll's current correction ID; a different value is rejected.
      operationId: update-payroll
      parameters:
      - name: payroll
        in: path
        description: ID of the payroll to update.
        schema:
          type: string
        required: true
      - name: include_items
        in: query
        description: Update related payroll items directly on this payroll.
        schema:
          type: boolean
          default: false
      - name: include_contractor_payment
        in: query
        description: Update related contractor payments directly on this payroll.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period_start:
                  type: string
                  description: The start of the date range that the payroll covers.
                  format: date
                period_end:
                  type: string
                  description: The end of the date range that the payroll covers.
                  format: date
                payday:
                  type: string
                  description: The date on which employees will be paid for the payroll.
                  format: date
                processing_period:
                  type: string
                  description: 'The processing period of the payroll. <br><br>One of `three_day`, `two_day`, or `one_day`.<br><br>The processing period determines the approval deadline of the payroll. For a payroll with a Friday payday, `three_day` will mean the approval deadline is on Tuesday, whereas `two_day` will mean the approval deadline is on Wednesday.<br><br>The possible values for this field are constrained by the processing periods the company is approved for.<br><br>Default: `processing_period` of the company'
                type:
                  type: string
                  description: Indicates whether the payroll is a regular or [off-cycle](https://docs.checkhq.com/docs/off-cycle-payroll) payroll.<br><br>One of `regular` or `off_cycle`. Other payroll types, such as `amendment` and `balancing`, are created by Check and can't be set through the API.
                pay_frequency:
                  type: string
                  description: Frequency by which [employees](https://docs.checkhq.com/reference/the-employee-object) get paid.<br><br>One of `weekly`, `biweekly`, `semimonthly`, `monthly`, `quarterly`, or `annually`.
                funding_payment_method:
                  type: string
                  description: Payment method for funding the payroll. <br><br>One of `ach`, `wire`, or `parafin`. <br><br>`ach` and `wire` can be set when creating or updating a payroll. `parafin` is set by Check when a payroll advance is accepted and cannot be set or changed via the API.
                pay_schedule:
                  type: string
                  description: ID of the [pay schedule](https://docs.checkhq.com/reference/the-pay-schedule-object) that the payroll relates to.
                off_cycle_options:
                  type: object
                  description: Additional configuration options controlling `off_cycle` payroll behavior.
                  properties:
                    force_supplemental_withholding:
                      type: boolean
                      description: Whether to tax all earnings as supplemental earnings.
                    apply_benefits:
                      type: boolean
                      description: Whether to apply [benefit deductions and contributions](https://docs.checkhq.com/reference/the-employee-benefit-object) to the payroll.
                    apply_post_tax_deductions:
                      type: boolean
                      description: Whether to apply [post-tax deductions](https://docs.checkhq.com/reference/the-post-tax-deduction-object) to the payroll.
                correction:
                  type: string
                  description: May be included only to restate this payroll's current correction ID; matching the current value is accepted as a no-op. A different value is rejected. Omitted leaves the correction unchanged.
                items:
                  type: array
                  description: The set of [payroll items](https://docs.checkhq.com/reference/the-payroll-item-object) associated with the payroll. Must set `include_items=true`.
                  items:
                    properties:
                      employee:
                        type: string
                      payment_method:
                        type: string
                      earnings:
                        type: array
                        items:
                          properties:
                            type:
                              type: string
                              description: Type of earning. Can be one of the following earning types in <a href="https://docs.checkhq.com/reference/types-of-earnings">Types of earnings</a>
                            workplace:
                              type: string
                              description: ID of the workplace where work for this earning was performed
                            earning_code:
                              type: string
                              description: The earning code id which will be used to aggregate earnings on the paystub
                            description:
                              type: string
                              description: Readable description of the earning code that will show up on the paystub
                            earning_rate:
                              type: string
                              description: The earning rate id which will be used to calculate the gross wage. Required if type is “piece”
                            amount:
                              type: string
                              description: Amount earned for this earning<br><br>May be negative, for example to reverse or correct a previously reported earning
                            hours:
                              type: number
                              description: Number of hours worked for this earning
                              format: float
                            piece_units:
                              type: number
                              description: Number of units of work produced. Required if type is “piece”
                              format: float
                            metadata:
                              type: string
                              description: Additional loosely structured information to associate with the earning
                              format: json
                          required:
                          - workplace
                          type: object
                      reimbursements:
                        type: array
                        items:
                          properties:
                            amount:
                              type: string
                              description: Amount of reimbursement<br><br>Must be greater than or equal to 0 on regular payrolls. Negative values are accepted on external payrolls
                            description:
                              type: string
                              description: Description for the reimbursement that will show up on the paystub
                            code:
                              type: string
                              description: Unique code to identify the reimbursement that will be used to aggregate reimbursements on the paystub. Recommended to always be included to have explicit groupings on the paystub.
                            metadata:
                              type: string
                              description: Additional loosely structured information to associate with the reimbursement
                              format: json
                          required:
                          - amount
                          type: object
                      benefit_overrides:
                        type: array
                        description: The set of benefit override objects associated with this payroll item.
                        items:
                          properties:
                            benefit:
                              type: string
                              description: ID of the employee benefit that is being overridden for the payroll item
                            employee_contribution_amount:
                              type: string
                              description: Updated employee contribution amount to use for this payroll only
                            company_contribution_amount:
                              type: string
                              description: Updated company contribution amount to use for this payroll only
                          required:
                          - benefit
                          type: object
                      post_tax_deduction_overrides:
                        type: array
                        description: The set of post-tax deduction override objects associated with this payroll item.
                        items:
                          properties:
                            post_tax_deduction:
