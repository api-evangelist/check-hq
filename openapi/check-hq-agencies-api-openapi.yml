openapi: 3.2.0
info:
  title: check-api Agencies API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Agencies
paths:
  /agencies:
    get:
      summary: List agencies
      operationId: list-agencies
      description: Returns the list of agencies.
      parameters:
      - name: id
        in: query
        description: Agency IDs to look up, for batch lookups. Repeat the parameter to provide multiple values (max 500 per request).
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: jurisdiction
        in: query
        description: Jurisdictions to filter to, as lowercase region codes (e.g. `fed`, `ny`, `pa`). A state's code includes its state and local agencies. Repeat the parameter to provide multiple values.
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: label_contains
        in: query
        description: Case-insensitive substring match on the agency `label`. Useful for looking up local agencies by name.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results per page (default 25, max 500).
        schema:
          type: integer
          default: 25
          maximum: 500
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    next: https://sandbox.checkhq.com/agencies?cursor=cD0lNUIlMjJmZWQlMjIlMkMlMjJJbnRlcm5hbCtSZXZlbnVlK1NlcnZpY2UlMjIlNUQ
                    previous: null
                    results:
                    - id: agc_ukjABgbD0hQ3dfBRyMPD
                      label: Internal Revenue Service
                      jurisdiction: fed
                    - id: agc_aocLMQ2cPTPcvUZegRxT
                      label: Berkheimer Tax Administrator
                      jurisdiction: pa
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                    description: URL of the next page of results, or null if there are no more.
                  previous:
                    type: string
                    nullable: true
                    description: URL of the previous page of results, or null on the first page.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier (`agc_` prefix) for the agency.
                          example: agc_ukjABgbD0hQ3dfBRyMPD
                        label:
                          type: string
                          description: Human-readable name for display.
                          example: Internal Revenue Service
                        jurisdiction:
                          type: string
                          description: Lowercase region code (`fed` or a lowercased ISO 3166-2:US region code). Local agencies use their state's value.
                          example: fed
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      type: validation_error
                      message: Please correct the required fields and try again.
                      input_errors:
                      - field: detail
                        field_path:
                        - detail
                        message: Unknown jurisdiction.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Please correct the required fields and try again.
                      input_errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: detail
                            field_path:
                              type: array
                              items:
                                type: string
                            message:
                              type: string
                              example: Unknown jurisdiction.
      deprecated: false
      tags:
      - Agencies
  /agencies/{id}:
    get:
      summary: Get an agency
      operationId: get-an-agency
      description: Returns a single agency by ID.
      parameters:
      - name: id
        in: path
        description: ID of the agency.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: agc_ukjABgbD0hQ3dfBRyMPD
                    label: Internal Revenue Service
                    jurisdiction: fed
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier (`agc_` prefix) for the agency.
                    example: agc_ukjABgbD0hQ3dfBRyMPD
                  label:
                    type: string
                    description: Human-readable name for display.
                    example: Internal Revenue Service
                  jurisdiction:
                    type: string
                    description: Lowercase region code (`fed` or a lowercased ISO 3166-2:US region code). Local agencies use their state's value.
                    example: fed
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      type: not_found
                      message: Not found.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: not_found
                      message:
                        type: string
                        example: Not found.
      deprecated: false
      tags:
      - Agencies
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
