openapi: 3.2.0
info:
  title: check-api Payroll Items API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Payroll Items
paths:
  /payroll_items:
    post:
      summary: Create a payroll item
      description: Creates a payroll item.
      operationId: create-a-payroll-item
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - payroll
              - employee
              properties:
                payroll:
                  type: string
                  description: The payroll ID associated with the payroll item.
                employee:
                  type: string
                  description: The employee ID associated with the payroll item.
                payment_method:
                  type: string
                  description: May be `manual` or `direct_deposit` if the employee has a linked bank account
                earnings:
                  type: array
                  description: The set of earnings objects associated with the payroll item.
                  items:
                    properties:
                      type:
                        type: string
                        description: Type of earning. Can be one of the following earning types in <a href="https://docs.checkhq.com/reference/types-of-earnings">Types of earnings</a>
                      workplace:
                        type: string
                        description: ID of the workplace where work for this earning was performed
                      earning_code:
                        type: string
                        description: The earning code id which will be used to aggregate earnings on the paystub
                      description:
                        type: string
                        description: Readable description of the earning code that will show up on the paystub
                      earning_rate:
                        type: string
                        description: The earning rate id which will be used to calculate the gross wage. Required if type is “piece”
                      amount:
                        type: string
                        description: Amount earned for this earning<br><br>May be negative, for example to reverse or correct a previously reported earning
                      hours:
                        type: number
                        description: Number of hours worked for this earning
                        format: float
                      piece_units:
                        type: number
                        description: Number of units of work produced. Required if type is “piece”
                        format: float
                      metadata:
                        type: string
                        description: Additional loosely structured information to associate with the earning
                        format: json
                    required:
                    - workplace
                    type: object
                reimbursements:
                  type: array
                  description: The set of non-taxable reimbursements objects associated with the payroll item.
                  items:
                    properties:
                      amount:
                        type: string
                        description: Amount of reimbursement<br><br>Must be greater than or equal to 0 on regular payrolls. Negative values are accepted on external payrolls
                      description:
                        type: string
                        description: Description for the reimbursement that will show up on the paystub
                      code:
                        type: string
                        description: Unique code to identify the reimbursement that will be used to aggregate reimbursements on the paystub. Recommended to always be included to have explicit groupings on the paystub.
                      metadata:
                        type: string
                        description: Additional loosely structured information to associate with the reimbursement
                        format: json
                    required:
                    - amount
                    type: object
                benefit_overrides:
                  type: array
                  description: The set of benefit override objects associated with this payroll item.
                  items:
                    properties:
                      benefit:
                        type: string
                        description: ID of the employee benefit that is being overridden for the payroll item
                      employee_contribution_amount:
                        type: string
                        description: Updated employee contribution amount to use for this payroll only
                      company_contribution_amount:
                        type: string
                        description: Updated company contribution amount to use for this payroll only
                    required:
                    - benefit
                    type: object
                post_tax_deduction_overrides:
                  type: array
                  description: The set of post-tax deduction override objects associated with this payroll item.
                  items:
                    properties:
                      post_tax_deduction:
                        type: string
                        description: ID of the miscellaneous post-tax deduction that is being overridden.
                      amount:
                        type: string
                        description: Updated deduction amount to use for this payroll only
                    required:
                    - post_tax_deduction
                    - amount
                    type: object
                tax_overrides:
                  type: array
                  description: The set of tax override objects associated with this payroll item.
                  items:
                    properties:
                      tax:
                        type: string
                        description: ID of the tax being overridden. Only Federal Income Tax and State Income Taxes are eligible.
                      amount:
                        type: string
                        description: Updated withholding amount to use for this payroll only.
                    required:
                    - tax
                    - amount
                    type: object
                pto_balance_hours:
                  type: number
                  description: The employee's remaining PTO hour balance, for display on the paystub
                  format: float
                sick_balance_hours:
                  type: number
                  description: The employee's remaining sick hour balance, for display on the paystub
                  format: float
                state_covid_sick_balance_hours:
                  type: number
                  description: The employee's remaining sick hour balance from state COVID relief bills, for display on the paystub. This field is currently only applicable to California employers as per [SB-95](https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202120220SB95). When the requirement expires, this field will be removed in a future API version
                  format: float
                supplemental_tax_calc_method:
                  type: string
                  description: Controls the method used by Check to calculate tax on supplemental earnings. May be `flat` or `aggregate`
                paper_check_number:
                  type: string
                  description: For accounting. The check number associated with any printed checks. Can be updated even after the associated payroll has been approved. See [Get a paper check](https://docs.checkhq.com/reference/get-a-paper-check) for more details.
                paystub_info:
                  type: string
                  description: Loosely structured information that will be returned on paystubs generated for this payroll item. Limited to 15 keys, and 500 total characters (combined length of keys and values).
                  format: json
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the payroll item.
                  format: json
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Payroll Items
    get:
      summary: List payroll items
      description: Return a list of payroll items.
      operationId: list-payroll-items
      parameters:
      - name: payroll
        in: query
        description: Return payroll_items for this [payroll](https://docs.checkhq.com/reference/payroll) ID.
        schema:
          type: string
      - name: employee
        in: query
        description: Return payroll_items for this employee ID
        schema:
          type: string
      - name: limit
        in: query
        description: Number of payroll items returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"next\": \"https://sandbox.checkhq.com/payroll_items?cursor=cD0yMDIyLTAzLTIyKzE3JTNBMjklM0EyMC43NTI2MzIlMkIwMCUzQTAw\",\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"itm_jMEjz0zwO0yGOusFaCnD\",\n            \"payroll\": \"pay_NTqYT28zV4YEIJVbA0wC\",\n            \"employee\": \"emp_veMl6MJVFFvTR4JRX5wa\",\n            \"status\": \"paid\",\n            \"void_of\": null,\n            \"voided_by\": null,\n            \"payment_method\": \"manual\",\n            \"supplemental_tax_calc_method\": \"aggregate\",\n            \"pto_balance_hours\": null,\n            \"sick_balance_hours\": null,\n            \"state_covid_sick_balance_hours\": null,\n            \"net_pay\": \"419.75\",\n            \"net_pay_split\": null,\n            \"earnings\": [\n                {\n                    \"amount\": \"400.00\",\n                    \"hours\": 20.0,\n                    \"type\": null,\n                    \"code\": null,\n                    \"description\": null,\n                    \"earning_code\": \"erc_tE4Sg1WMV59t7zaWNIj1\",\n                    \"earning_rate\": null,\n                    \"workplace\": \"wrk_5JNLdlXjcDJbRlwDDTOA\",\n                    \"metadata\": {}\n                },\n                {\n                    \"amount\": \"60.00\",\n                    \"hours\": 20.0,\n                    \"type\": null,\n                    \"code\": null,\n                    \"description\": null,\n                    \"earning_code\": \"erc_tJB4tLCYydrdPAH5PDQK\",\n                    \"earning_rate\": null,\n                    \"workplace\": \"wrk_5JNLdlXjcDJbRlwDDTOA\",\n                    \"metadata\": {}\n                }\n            ],\n            \"reimbursements\": [],\n            \"taxes\": [\n                {\n                    \"tax\": \"tax_ImvSF9CTuMdokf0uwx5x\",\n                    \"description\": \"Employer FICA Tax\",\n                    \"amount\": \"28.52\",\n                    \"payer\": \"company\",\n                    \"remittable\": true\n                },\n                {\n                    \"tax\": \"tax_u4DzMCYXAUL6OfcgPeyg\",\n                    \"description\": \"Federal Unemployment Tax\",\n                    \"amount\": \"2.76\",\n                    \"payer\": \"company\",\n                    \"remittable\": true\n                },\n            ],\n            \"benefits\": [],\n            \"benefit_overrides\": [],\n            \"post_tax_deductions\": [],\n          \t\"post_tax_deduction_overrides\": [],\n            \"tax_overrides\": [],\n            \"warnings\": [],\n            \"paper_check_number\": null,\n            \"metadata\": {}\n        },\n        {\n            \"id\": \"itm_HbroZTha5C5uLM3kNZcX\",\n            \"payroll\": \"pay_jWQfb9BgKa5ZudfgCC7R\",\n            \"employee\": \"emp_veMl6MJVFFvTR4JRX5wa\",\n            \"status\": \"paid\",\n            \"void_of\": null,\n            \"voided_by\": null,\n            \"payment_method\": \"manual\",\n            \"supplemental_tax_calc_method\": \"aggregate\",\n            \"pto_balance_hours\": null,\n            \"sick_balance_hours\": null,\n            \"state_covid_sick_balance_hours\": null,\n            \"net_pay\": \"1367.09\",\n            \"net_pay_split\": null,\n            \"earnings\": [\n                {\n                    \"amount\": \"1200.00\",\n                    \"hours\": 20.0,\n                    \"type\": null,\n                    \"code\": null,\n                    \"description\": null,\n                    \"earning_code\": \"erc_tJB4tLCYydrdPAH5PDQK\",\n                    \"earning_rate\": null,\n                    \"workplace\": \"wrk_5JNLdlXjcDJbRlwDDTOA\",\n                    \"metadata\": {}\n                },\n                {\n                    \"amount\": \"500.00\",\n                    \"hours\": 20.0,\n                    \"type\": null,\n                    \"code\": null,\n                    \"description\": null,\n                    \"earning_code\": \"erc_tE4Sg1WMV59t7zaWNIj1\",\n                    \"earning_rate\": null,\n                    \"workplace\": \"wrk_5JNLdlXjcDJbRlwDDTOA\",\n                    \"metadata\": {}\n                }\n            ],\n            \"reimbursements\": [],\n            \"taxes\": [\n                {\n                    \"tax\": \"tax_ImvSF9CTuMdokf0uwx5x\",\n                    \"description\": \"Employer FICA Tax\",\n                    \"amount\": \"105.40\",\n                    \"payer\": \"company\",\n                    \"remittable\": true\n                },\n                {\n                    \"tax\": \"tax_u4DzMCYXAUL6OfcgPeyg\",\n                    \"description\": \"Federal Unemployment Tax\",\n                    \"amount\": \"10.20\",\n                    \"payer\": \"company\",\n                    \"remittable\": true\n                },\n            ],\n            \"benefits\": [],\n            \"benefit_overrides\": [],\n            \"post_tax_deductions\": [],\n            \"post_tax_deduction_overrides\": [],\n            \"tax_overrides\": [],\n            \"warnings\": [],\n            \"paper_check_number\": null,\n            \"metadata\": {}\n        },\n      ]\n}"
      deprecated: false
      tags:
      - Payroll Items
    delete:
      summary: Copy of Delete a payroll item
      description: ''
      operationId: delete_payroll_items{payroll_item}-1
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: 'Delete this payroll item. '
      responses:
        '204':
          description: '204'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Payroll Items
  /payroll_items/{payroll_item}:
    delete:
      summary: Delete a payroll item
      description: ''
      operationId: delete-a-payroll-item
      parameters:
      - name: payroll_item
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Payroll Items
  /payroll_items/{payroll_item}/paper_check:
    get:
      summary: Get a paper check
      description: 'Returns a paper check for the specified payroll item.


        Use an `Accept: application/pdf` request header to download the paper check as a PDF document.'
      operationId: get-a-paper-check
      parameters:
      - name: payroll_item
        in: path
        description: ID of the payroll item to return
        schema:
          type: string
        required: true
      - name: Accept
        in: header
        description: application/pdf
        schema:
          type: string
      - name: payment_id
        in: query
        description: Optional ID of a single net-pay-split payment (`pyt_…`). When provided, the check amount is scoped to just that split's payment (e.g. to reissue one failed direct deposit) instead of the full net pay. Rejected unless that payment can be reissued (e.g. it already paid, is still in flight, or was reversed).
        schema:
          type: string
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url": "string"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: string
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Payroll Items
