- sec0: []
tags:
- name: Employee Tax Statements
paths:
  /employee_tax_statements:
    get:
      summary: List employee tax statements
      description: ''
      operationId: list-employee-tax-statements
      parameters:
      - name: employee
        in: query
        description: ID of the employee to get tax statements for
        schema:
          type: string
      - in: query
        name: company
        schema:
          type: string
        description: ID of the company to get tax statements for
      - in: query
        name: year
        schema:
          type: number
        description: Year to get tax statements for
      - in: query
        name: publication_status
        schema:
          type: string
          enum:
          - draft
          - published
          - pending_correction
        description: Filter by publication status
      - in: query
        name: type
        schema:
          type: string
          enum:
          - original
          - amendment
        description: Filter by statement type
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"ets_789\",\n    \"employee\": \"emp_123\",\n\t\t\"company\": \"com_123\",\n    \"year\": 2025,\n    \"amends\": null,\n    \"amended_by\": null,\n    \"document\": null,\n    \"filings\": [\"com_fil_999\"],\n    \"filed_at\": null\n  },\n  {\n    \"id\": \"ets_456\",\n    \"employee\": \"emp_123\",\n\t\t\"company\": \"com_123\",\n    \"year\": 2024,\n    \"amends\": \"ets_123\",\n    \"amended_by\": null,\n    \"document\": \"doc_456\",\n    \"filings\": [\"com_fil_789\", \"com_fil_888\"],\n    \"filed_at\": \"2025-02-10T15:30:00Z\"\n  },\n  {\n    \"id\": \"ets_123\",\n    \"employee\": \"emp_123\",\n\t\t\"company\": \"com_123\",\n    \"year\": 2024,\n    \"amends\": null,\n    \"amended_by\": \"ets_456\",\n    \"document\": \"doc_123\",\n    \"filings\": [\"com_fil_123\", \"com_fil_234\"],\n    \"filed_at\": \"2025-02-10T15:30:00Z\"\n  }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: ets_789
                    employee:
                      type: string
                      example: emp_123
                    company:
                      type: string
                      example: com_123
                    year:
                      type: integer
                      example: 2025
                      default: 0
                    amends: {}
                    amended_by: {}
                    document: {}
                    filings:
                      type: array
                      items:
                        type: string
                        example: com_fil_999
                    filed_at: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Employee Tax Statements
  /employee_tax_statements/{id}:
    get:
      summary: Get an employee tax statement
      description: ''
      operationId: employee-tax-statements-1
      parameters:
      - name: id
        in: path
        description: ID of the requested employee tax statement
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"ets_789\",\n  \"employee\": \"emp_123\",\n  \"company\": \"com_123\",\n  \"year\": 2025,\n  \"amends\": null, \n  \"amended_by\": null,\n  \"document\": null,\n  \"filings\": [\"com_fil_999\"],\n  \"filed_at\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: ets_789
                  employee:
                    type: string
                    example: emp_123
                  company:
                    type: string
                    example: com_123
                  year:
                    type: integer
                    example: 2025
                    default: 0
                  amends: {}
                  amended_by: {}
                  document: {}
                  filings:
                    type: array
                    items:
                      type: string
                      example: com_fil_999
                  filed_at: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Statements
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
