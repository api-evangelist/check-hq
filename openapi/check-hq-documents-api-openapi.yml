tags:
- name: Documents
paths:
  /documents/company_authorization_documents:
    get:
      summary: List company authorization documents
      description: Returns a list of company authorization documents. Each document includes `created_at`, an ISO 8601 UTC timestamp of when the document was recorded. When multiple documents share the same `filed_on` date, compare `created_at` to tell which was recorded later.
      operationId: list-company-authorization-documents
      parameters:
      - name: company
        in: query
        description: Return authorization documents for this company ID
        schema:
          type: string
      - name: year
        in: query
        description: Return documents for this year (must be greater than or equal to `2019`)
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Number of authorization documents returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
  /documents/company_tax_documents:
    get:
      summary: List company tax documents
      description: Returns a list of company tax documents. Each document includes `created_at`, an ISO 8601 UTC timestamp of when the document was recorded. When multiple documents share the same `filed_on` date, compare `created_at` to tell which was recorded later.
      operationId: list-company-tax-documents
      parameters:
      - name: company
        in: query
        description: Return tax documents for this company ID
        schema:
          type: string
      - name: year
        in: query
        description: Return tax documents for this year (must be greater than or equal to `2019`)
        schema:
          type: integer
          format: int32
      - name: quarter
        in: query
        description: Return tax documents for this quarter (accepted values are `q1`, `q2`, `q3`, or `q4`)
        schema:
          type: string
      - name: limit
        in: query
        description: Number of tax documents returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"next\": \"https://api.checkhq.com/documents/company_tax_documents?cursor=cD0lNUIlMjIyMDI0LTA3LTI2KzE2JTNBMTAlM0EwMy44OTY5ODclMkIwMCUzQTAwJTIyJTJDKyUyMjQwNTk4MSUyMiU1RA%3D%3D\",\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"doc_XL5gEd90wjwh2b3U6ICU\",\n            \"company\": \"com_EkKTRETE3zl8CffWF2iW\",\n            \"category\": \"company_tax_document\",\n            \"label\": \"Form UCT-101\",\n            \"description\": \"Form UCT-101 is the quarterly Unemployment contribution return for Wisconsin.\",\n            \"jurisdiction\": \"WI\",\n            \"year\": 2024,\n            \"quarter\": \"q2\",\n            \"filed_on\": \"2024-07-26\",\n            \"created_at\": \"2024-07-26T16:10:03.896987Z\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  next:
                    type: string
                    example: https://api.checkhq.com/documents/company_tax_documents?cursor=cD0lNUIlMjIyMDI0LTA3LTI2KzE2JTNBMTAlM0EwMy44OTY5ODclMkIwMCUzQTAwJTIyJTJDKyUyMjQwNTk4MSUyMiU1RA%3D%3D
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: doc_XL5gEd90wjwh2b3U6ICU
                        company:
                          type: string
                          example: com_EkKTRETE3zl8CffWF2iW
                        category:
                          type: string
                          example: company_tax_document
                        label:
                          type: string
                          example: Form UCT-101
                        description:
                          type: string
                          example: Form UCT-101 is the quarterly Unemployment contribution return for Wisconsin.
                        jurisdiction:
                          type: string
                          example: WI
                        year:
                          type: integer
                          example: 2024
                          default: 0
                        quarter:
                          type: string
                          example: q2
                        filed_on:
                          type: string
                          example: '2024-07-26'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
  /documents/contractor_tax_documents:
    get:
      summary: List contractor tax documents
      description: Returns contractor tax documents. Each document includes `created_at`, an ISO 8601 UTC timestamp of when the document was recorded. When multiple documents share the same `filed_on` date, compare `created_at` to tell which was recorded later.
      operationId: list-contractor-tax-documents
      parameters:
      - name: contractor
        in: query
        description: Return documents for this contractor ID.
        schema:
          type: string
      - name: company
        in: query
        description: Return documents for this company ID. Results will include tax documents for all contractors who perform work for this company.
        schema:
          type: string
      - name: year
        in: query
        description: Return documents for this year (must be greater than or equal to `2019`)
        schema:
          type: integer
          format: int32
      - name: document_type
        in: query
        description: Return documents with this document type. Repeat the parameter to match any of multiple values (for example, `?document_type=fed_1099_nec&document_type=fed_w9`). Filtering on `fed_1099_nec` also matches legacy rows stored as `1099_nec`.
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of tax documents returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
  /documents/employee_tax_documents:
    get:
      summary: List employee tax documents
      description: Returns a list of employee tax documents. Each document includes `created_at`, an ISO 8601 UTC timestamp of when the document was recorded. When multiple documents share the same `filed_on` date, compare `created_at` to tell which was recorded later.
      operationId: list-employee-tax-documents
      parameters:
      - name: employee
        in: query
        description: Return tax documents for this employee ID
        schema:
          type: string
      - name: company
        in: query
        description: Return tax documents for this company ID
        schema:
          type: string
      - name: year
        in: query
        description: List documents for this year (must be greater than or equal to `2019`)
        schema:
          type: integer
          format: int32
      - name: document_type
        in: query
        description: Return documents with this document type. Repeat the parameter to match any of multiple values (for example, `?document_type=fed_w4&document_type=fed_w2`).
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of tax documents returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"next\": \"https://api.checkhq.com/documents/employee_tax_documents?cursor=cD0lNUIlMjIyMDI0LTA1LTA5KzIzJTNBNTIlM0ExOC42NzY3NzUlMkIwMCUzQTAwJTIyJTJDKyUyMjQwMzA5OCUyMiU1RA%3D%3D\",\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"doc_hQhfyxTf2aMXDfQ82Dly\",\n            \"employee\": \"emp_blSYc67D0Q4qk6lx15qR\",\n            \"category\": \"employee_tax_document\",\n            \"document_type\": \"ca_de4\",\n            \"label\": \"California DE-4\",\n            \"jurisdiction\": \"CA\",\n            \"year\": 2024,\n            \"filed_on\": \"2024-07-18\",\n            \"created_at\": \"2024-07-18T23:52:18.676775Z\"\n        },\n        ...\n    ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
  /documents/setup_documents:
    get:
      summary: List setup documents
      description: List all setup documents. Each document includes `created_at`, an ISO 8601 UTC timestamp of when Check generated this document.
      operationId: list-setup-documents
      parameters:
      - name: company
        in: query
        description: Company ID
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
