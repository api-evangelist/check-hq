  /documents/setup_documents/{document}:
    get:
      summary: Get a Setup Document
      description: Returns a setup document, including `created_at` (ISO 8601 UTC timestamp of when Check generated this document).
      operationId: get-a-setup-document
      parameters:
      - name: document
        in: path
        description: Document ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
  /documents/setup_documents/{document}/download:
    get:
      summary: Download a setup document
      description: Downloads the binary document
      operationId: download-a-setup-document
      parameters:
      - name: document
        in: path
        description: Document ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Documents
