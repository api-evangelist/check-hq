openapi: 3.2.0
info:
  title: check-api Benefits API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Benefits
paths:
  /benefits:
    get:
      summary: List benefits
      description: Returns a list of benefits.
      operationId: list-benefits
      parameters:
      - name: employee
        in: query
        description: Return benefits for this employee ID.
        schema:
          type: string
      - name: company
        in: query
        description: Return benefits for all employees of this company ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of benefits returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: include_external
        in: query
        description: Flag to indicate if to additionally expose external benefits in the list response. Defaults to false if not included.
        schema:
          type: boolean
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"ben_lrcYUhTk1FVZl2vSCOBP\",\n    \"employee\": \"emp_kKTK4VafMNc5pIbI0G9x\",\n    \"benefit\": \"401k\",\n    \"company_benefit\": null,\n    \"source\": null,\n   \t\"period\": null,\n    \"description\": \"Guideline 401(k)\",\n    \"effective_start\": \"2020-01-01\",\n    \"effective_end\": null,\n    \"company_contribution_amount\": null,\n    \"company_contribution_percent\": 1.0,\n    \"company_period_amount\": null,\n    \"employee_contribution_amount\": null,\n    \"employee_contribution_percent\": 1.0,\n    \"employee_period_amount\": null,\n    \"hsa_contribution_limit\": null,\n    \"metadata\": {}\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: ben_lrcYUhTk1FVZl2vSCOBP
                    employee:
                      type: string
                      example: emp_kKTK4VafMNc5pIbI0G9x
                    benefit:
                      type: string
                      example: 401k
                    company_benefit: {}
                    source: {}
                    period: {}
                    description:
                      type: string
                      example: Guideline 401(k)
                    effective_start:
                      type: string
                      example: '2020-01-01'
                    effective_end: {}
                    company_contribution_amount: {}
                    company_contribution_percent:
                      type: integer
                      example: 1
                      default: 0
                    company_period_amount: {}
                    employee_contribution_amount: {}
                    employee_contribution_percent:
                      type: integer
                      example: 1
                      default: 0
                    employee_period_amount: {}
                    hsa_contribution_limit: {}
                    metadata:
                      type: object
                      properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Benefits
  /benefits/{benefit}:
    delete:
      summary: Delete a benefit
      description: Deletes the specified benefit.
      operationId: delete-an-employee-benefit
      parameters:
      - name: benefit
        in: path
        description: ID of the benefit to delete
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Benefits
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
