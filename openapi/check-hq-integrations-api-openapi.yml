info:
  title: check-api Integrations API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Integrations
paths:
  /integrations/accesses:
    get:
      summary: List Integration Accesses
      description: Returns a list of Integration Access objects, optionally filtered by company.
      operationId: list-integration-accesses
      parameters:
      - name: company
        in: query
        description: ID of the company
        schema:
          type: string
      - name: limit
        in: query
        description: Number of records to return. Max is 25
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    next: https://sandbox.checkhq.com/integrations/accesses?cursor=cD0lNUIlMjIyMDIyLTA4LTI5KzE5JTNBMTQlM0E1Ni45OTU2NDMlMkIwMCUzQTAwJTIyJTJDKyUyMjI0OSUyMiU1RA%3D%3D
                    previous: null
                    results:
                    - id: iac_7tbSM8GtZftxyB6I8Fz8
                      company: com_mzzhkhIvuWnk0uUj1vmK
                      status: pending
                      metadata: {}
                      integration_permission: ipe_LEqUV3zmAwqq1W4X8Bs1
                      access_type: POLICY_PURCHASED
                      integration_partner: int_Fffk6nOGSHtuCTirWqlp
                      scope:
                      - company:read
                      - company:retrieve
                      - company:federal_ein_verifications:list
                      - company:federal_ein_verifications:retrieve
                      - workplace:list
                      - workplace:retrieve
                      - employee:list
                      - employee:retrieve
                      - payroll:list
                      - payroll:retrieve
                      - payroll_item:retrieve
                      - integration_access:retrieve
                      - integration_partners:list
                      - integration_partners:retrieve
                      - integration_partners:authorize
              schema:
                type: object
                properties:
                  next:
                    type: string
                    example: https://sandbox.checkhq.com/integrations/accesses?cursor=cD0lNUIlMjIyMDIyLTA4LTI5KzE5JTNBMTQlM0E1Ni45OTU2NDMlMkIwMCUzQTAwJTIyJTJDKyUyMjI0OSUyMiU1RA%3D%3D
                  previous:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: iac_7tbSM8GtZftxyB6I8Fz8
                        company:
                          type: string
                          example: com_mzzhkhIvuWnk0uUj1vmK
                        status:
                          type: string
                          example: pending
                        metadata:
                          type: object
                          properties: {}
                        integration_permission:
                          type: string
                          example: ipe_LEqUV3zmAwqq1W4X8Bs1
                        access_type:
                          type: string
                          example: POLICY_PURCHASED
                        integration_partner:
                          type: string
                          example: int_Fffk6nOGSHtuCTirWqlp
                        scope:
                          type: array
                          items:
                            type: string
                            example: company:read
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Integrations
  /integrations/partners:
    get:
      summary: List Integration Partners
      description: ''
      operationId: integration-partners
      parameters:
      - name: id
        in: query
        description: The ID of the Integration Partner
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"next\": null,\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"int_tEENJcAPamBRBmffR0hm\",\n            \"name\": \"Hurdlr\",\n            \"description\": \"Embedded accounting\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: int_tEENJcAPamBRBmffR0hm
                        name:
                          type: string
                          example: Hurdlr
                        description:
                          type: string
                          example: Embedded accounting
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Integrations
  /integrations/partners/{integration_partner}:
    get:
      summary: Get an Integration Partner
      description: ''
      operationId: get-an-integration-partner-copy
      parameters:
      - name: integration_partner
        in: path
        description: ID of the Integration Partner
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"int_tEENJcAPamBRBmffR0hm\",\n    \"name\": \"Hurdlr\",\n    \"description\": \"Embedded accounting\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: int_tEENJcAPamBRBmffR0hm
                  name:
                    type: string
                    example: Hurdlr
                  description:
                    type: string
                    example: Embedded accounting
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Integrations
  /integrations/partners/{integration_partner}/authorize:
    put:
      summary: Authorize an Integration Partner
      description: ''
      operationId: integration-partners-copy
      parameters:
      - name: integration_partner
        in: path
        description: ID of the Integration Partner
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - integration_permission
              - tos_timestamp
              - product_purchase_timestamp
              properties:
                company:
                  type: string
                  description: ID of the company whose data you want to grant the Integration Partner access to
                integration_permission:
                  type: string
                  description: ID of the Integration Permission you want to grant to the Integration Partner
                tos_timestamp:
                  type: string
                  description: The timestamp when the customer consented to a terms of service document consenting to sharing their data with the Integration Partner. Must be an ISO 8601 date-time string, e.g. `2026-07-16T14:30:00Z`. Always include a timezone designator (`Z` or a UTC offset like `-05:00`); a value without one is interpreted in the server's default timezone.
                product_purchase_timestamp:
                  type: string
                  description: The timestamp when the customer purchased the product offered by the Integration Partner. Must be an ISO 8601 date-time string, e.g. `2026-07-16T14:30:00Z`. Always include a timezone designator (`Z` or a UTC offset like `-05:00`); a value without one is interpreted in the server's default timezone.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"<integration access id>\",\n  \"company\": \"com_vQHrDCeILCSuI6hkAPpV\",\n  \"status\": \"pending\",\n  \"integration_permission\": \"ipe_08auhI2IUXcdtFTtOm7c\",\n  \"access_type\": \"test\",\n  \"integration_partner\": \"int_Xf90bJAKE9Lf2jVjbgne\",\n  \"scope\": [\n    \"company:read\"\n  ]\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: <integration access id>
                  company:
                    type: string
                    example: com_vQHrDCeILCSuI6hkAPpV
                  status:
                    type: string
                    example: pending
                  integration_permission:
                    type: string
                    example: ipe_08auhI2IUXcdtFTtOm7c
                  access_type:
                    type: string
                    example: test
                  integration_partner:
                    type: string
                    example: int_Xf90bJAKE9Lf2jVjbgne
                  scope:
                    type: array
                    items:
                      type: string
                      example: company:read
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Integrations
  /integrations/permissions:
    get:
      summary: List Integration Permissions
      description: ''
      operationId: list-integration-permissions
      parameters:
      - name: integration_partner
