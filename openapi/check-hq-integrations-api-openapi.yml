            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"next\": null,\n    \"previous\": null,\n    \"results\": [\n        {\n            \"id\": \"ipe_tIUPIBtjl7QwmWilgzYN\",\n            \"access_type\": \"Active\",\n            \"integration_partner\": \"int_tEENJcAPamBRBmffR0hm\",\n            \"scope\": [\n                \"integration_access:retrieve\",\n                \"integration_partners:list\",\n                \"integration_partners:retrieve\",\n                \"integration_partners:authorize\",\n                \"company:retrieve\",\n                \"employee:list\",\n                \"employee:retrieve\",\n                \"benefits:list\",\n                \"benefits:retrieve\",\n                \"benefits:partial_update\",\n                \"benefits:create\",\n                \"benefits:destroy\",\n                \"company_benefit:list\",\n                \"company_benefit:retrieve\",\n                \"company_benefit:partial_update\",\n                \"company_benefit:create\",\n                \"company_benefit:destroy\",\n                \"post_tax_deduction:list\",\n                \"post_tax_deduction:retrieve\",\n                \"post_tax_deduction:partial_update\",\n                \"post_tax_deduction:create\",\n                \"post_tax_deduction:destroy\",\n                \"payroll:list\",\n                \"payroll:retrieve\",\n                \"payroll_item:retrieve\",\n                \"earning_rate:list\",\n                \"earning_rate:retrieve\",\n                \"company_tax_setup:setting:retrieve\"\n            ]\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: ipe_tIUPIBtjl7QwmWilgzYN
                        access_type:
                          type: string
                          example: Active
                        integration_partner:
                          type: string
                          example: int_tEENJcAPamBRBmffR0hm
                        scope:
                          type: array
                          items:
                            type: string
                            example: integration_access:retrieve
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Integrations
