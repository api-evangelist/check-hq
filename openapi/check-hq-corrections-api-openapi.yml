openapi: 3.2.0
info:
  title: check-api Corrections API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Corrections
paths:
  /corrections:
    post:
      summary: Create a correction
      description: Creates a new correction in the `draft` status.
      operationId: create-a-correction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - year
              properties:
                company:
                  type: string
                  description: ID of the [company](https://docs.checkhq.com/reference/company) whose pay history is being corrected.
                year:
                  type: integer
                  description: The tax year the correction applies to. All payrolls attached to the correction must belong to this tax year.
                description:
                  type: string
                  description: A human-readable description of the correction.
                metadata:
                  type: object
                  description: Arbitrary key-value data to attach to the correction.
                settlement_date:
                  type: string
                  format: date
                  description: The CFT settlement date for the correction's money movement. Must be a valid banking day on or after the earliest date ACH can still reach for settlement. Any later banking day is allowed. Optional at creation; if omitted, a date is chosen when the correction is approved.
                bank_account:
                  type: string
                  description: ID of the [bank account](https://docs.checkhq.com/reference/bank-accounts-1) to debit or credit at fulfillment. Must belong to the correction's company. Optional; if omitted or `null`, Check stamps the company's current default bank account.
                simulation_mode:
                  type: string
                  enum:
                  - automatic
                  - manual
                  description: Sandbox-only. How the correction moves through money movement after approval. One of `automatic` or `manual`. Omitted or `null` defaults to `automatic`. Returns a validation error in production.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": null,\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {\n    \"external_id\": \"abc-123\"\n  },\n  \"operations\": [],\n  \"totals\": null,\n  \"preview\": null,\n  \"approval\": null,\n  \"reopen_deadline\": null,\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
    get:
      summary: List corrections
      description: Returns a paginated list of corrections.
      operationId: list-corrections
      parameters:
      - name: company
        in: query
        description: Filter to corrections belonging to a single company.
        schema:
          type: string
      - name: year
        in: query
        description: Filter to corrections for a single tax year.
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Filter to corrections with this status.
        schema:
          type: string
          enum:
          - draft
          - pending
          - processing
          - settled
          - failed
      - name: payroll
        in: query
        description: Filter to corrections that include the given payroll as a member.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of corrections returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n      \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n      \"year\": 2026,\n      \"status\": \"draft\",\n      \"settlement_date\": \"2026-07-15\",\n      \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n      \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n      \"metadata\": {\n        \"external_id\": \"abc-123\"\n      },\n      \"created_at\": \"2026-06-24T18:26:56.848920Z\",\n      \"updated_at\": \"2026-06-24T18:26:56.848920Z\",\n      \"created_by\": \"partner@example.com\"\n    }\n  ]\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}:
    get:
      summary: Get a correction
      description: Retrieves an existing correction.
      operationId: get-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": \"2026-07-15\",\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {\n    \"external_id\": \"abc-123\"\n  },\n  \"operations\": [\n    {\n      \"operation\": \"void_payroll\",\n      \"creates\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"corrects\": \"pay_OriginalVoidedPayroll\"\n    },\n    {\n      \"operation\": \"add_payroll\",\n      \"creates\": \"pay_Vg3RvNwqLpTz8oYaGdQE\",\n      \"corrects\": null\n    },\n    {\n      \"operation\": \"balance_quarter\",\n      \"creates\": \"pay_Jd9nWuBqOxSz5eKmCvhT\",\n      \"corrects\": \"pay_OriginalBalancingPayroll\"\n    }\n  ],\n  \"totals\": null,\n  \"preview\": null,\n  \"approval\": null,\n  \"reopen_deadline\": null,\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
    patch:
      summary: Update a correction
      description: Updates an existing draft correction. Only `description`, `settlement_date`, `bank_account`, `metadata`, and `simulation_mode` may be updated.
      operationId: update-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction to update
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: A human-readable description of the correction.
                metadata:
                  type: object
                  description: Arbitrary key-value data to attach to the correction.
                settlement_date:
                  type: string
                  format: date
                  description: The CFT settlement date for the correction's money movement. Must be a valid banking day on or after the earliest date ACH can still reach for settlement. Any later banking day is allowed.
                bank_account:
                  type: string
                  description: Settable while the correction is in `draft`. ID of the [bank account](https://docs.checkhq.com/reference/bank-accounts-1) to debit or credit at fulfillment. Must belong to the correction's company. An explicit `null` re-stamps the company's current default bank account.
                simulation_mode:
                  type: string
                  enum:
                  - automatic
                  - manual
                  description: Sandbox-only. Settable while the correction is in `draft`. One of `automatic` or `manual`. Omitted leaves the mode unchanged; `null` resets to the default (`automatic`). Returns a validation error in production.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": \"2026-07-20\",\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {},\n  \"operations\": [\n    {\n      \"operation\": \"void_payroll\",\n      \"creates\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"corrects\": \"pay_OriginalVoidedPayroll\"\n    },\n    {\n      \"operation\": \"add_payroll\",\n      \"creates\": \"pay_Vg3RvNwqLpTz8oYaGdQE\",\n      \"corrects\": null\n    }\n  ],\n  \"totals\": null,\n  \"preview\": null,\n  \"approval\": null,\n  \"reopen_deadline\": null,\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
    delete:
      summary: Delete a correction
      description: Deletes a draft correction and all draft payrolls attached to it.
      operationId: delete-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction to delete
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/approve:
    post:
      summary: Approve a correction
      description: 'Approves a correction, scheduling its money movement to be processed on the correction''s `settlement_date`. Fully asynchronous: the endpoint returns `202 Accepted` with `approval` set to `calculating` while a drift check and promotion run. When the approval succeeds, `status` moves to `pending`; if the plan drifted, `approval.error_code` is `fulfillment_changed` and the correction remains in `draft` with refreshed `totals`.'
      operationId: approve-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction to approve
        schema:
          type: string
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": \"2026-07-15\",\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {},\n  \"operations\": [\n    {\n      \"operation\": \"void_payroll\",\n      \"creates\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"corrects\": \"pay_OriginalVoidedPayroll\"\n    },\n    {\n      \"operation\": \"add_payroll\",\n      \"creates\": \"pay_Vg3RvNwqLpTz8oYaGdQE\",\n      \"corrects\": null\n    }\n  ],\n  \"totals\": {\n    \"cash_requirement\": \"150.00\",\n    \"cash_requirement_waived\": \"0.00\",\n    \"agency_refundable\": \"25.00\"\n  },\n  \"preview\": {\n    \"status\": \"succeeded\",\n    \"started_at\": \"2026-06-24T19:02:11.512303Z\",\n    \"messages\": null\n  },\n  \"approval\": {\n    \"status\": \"calculating\",\n    \"started_at\": \"2026-06-24T19:15:42.881204Z\",\n    \"error_code\": null\n  },\n  \"reopen_deadline\": \"2026-07-14T15:00:00Z\",\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/preview:
    post:
      summary: Preview a correction
      description: Starts an asynchronous preview of a correction, which rebalances impacted closed quarters and prices the correction without moving money.
      operationId: preview-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction to preview
        schema:
          type: string
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": \"2026-07-15\",\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {},\n  \"operations\": [\n    {\n      \"operation\": \"void_payroll\",\n      \"creates\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"corrects\": \"pay_OriginalVoidedPayroll\"\n    },\n    {\n      \"operation\": \"add_payroll\",\n      \"creates\": \"pay_Vg3RvNwqLpTz8oYaGdQE\",\n      \"corrects\": null\n    }\n  ],\n  \"totals\": null,\n  \"preview\": {\n    \"status\": \"calculating\",\n    \"started_at\": \"2026-06-24T19:02:11.512303Z\",\n    \"messages\": null\n  },\n  \"approval\": null,\n  \"reopen_deadline\": null,\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/receipt:
    get:
      summary: Get a correction receipt
      description: 'Returns a tax rollup for a correction after a successful preview. The response includes money-movement totals and one entry per tax the correction moved, with each operation split into amounts Check remits and amounts the company remits outside Check.


        Does not return a file URL; use `GET /corrections/{correction}/receipt_download` to download the receipt PDF.


        If the correction has not been previewed, returns `400` with error type `correction_not_previewed`. Taxes with no net movement are omitted from `taxes`.'
      operationId: get-a-correction-receipt
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"totals\": {\n    \"cash_requirement\": \"23.50\",\n    \"cash_requirement_waived\": \"0.00\",\n    \"agency_refundable\": \"0.00\",\n    \"company_responsibility\": \"0.00\"\n  },\n  \"taxes\": [\n    {\n      \"tax\": \"tax_8kQm2pLxNvRwYhJdFsAe\",\n      \"tax_label\": \"Federal Income Tax\",\n      \"jurisdiction\": \"US\",\n      \"agency\": null,\n      \"agency_label\": null,\n      \"voided\": {\n        \"check\": \"-235.00\",\n        \"company\": \"0.00\"\n      },\n      \"added\": {\n        \"check\": \"258.50\",\n        \"company\": \"0.00\"\n      },\n      \"balanced\": {\n        \"check\": \"0.00\",\n        \"company\": \"0.00\"\n      },\n      \"reassigned\": {\n        \"check\": \"0.00\",\n        \"company\": \"0.00\"\n      },\n      \"cash_requirement\": \"23.50\",\n      \"cash_requirement_waived\": \"0.00\",\n      \"agency_refundable\": \"0.00\",\n      \"company_responsibility\": \"0.00\"\n    }\n  ]\n}"
        '400':
          description: The correction has not been successfully previewed.
          content:
            application/json:
              examples:
                Not previewed:
                  value: "{\n  \"error\": {\n    \"type\": \"correction_not_previewed\",\n    \"message\": \"Preview this correction to generate its receipt.\"\n  }\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/receipt_download:
    get:
      summary: Download a correction receipt
      description: 'Returns a short-lived URL to download the correction receipt PDF. Requires a successful preview. Each call mints a fresh URL.


        If the correction has not been previewed, returns `400` with error type `correction_not_previewed`. If preview succeeded but the PDF artifact is not available, returns `404`.'
      operationId: get-a-correction-receipt-download
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"download_url\": \"https://check-receipts.s3.amazonaws.com/correction-receipt.pdf?X-Amz-Expires=1800\",\n  \"content_type\": \"application/pdf\",\n  \"expires_at\": \"2026-06-24T19:30:00Z\"\n}"
        '400':
          description: The correction has not been successfully previewed.
          content:
            application/json:
              examples:
                Not previewed:
                  value: "{\n  \"error\": {\n    \"type\": \"correction_not_previewed\",\n    \"message\": \"Preview this correction to generate its receipt.\"\n  }\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/reopen:
    post:
      summary: Reopen a correction
      description: Reopens a pending correction, returning it to `draft` so additional adjustments can be made.
      operationId: reopen-a-correction
      parameters:
      - name: correction
        in: path
        description: ID of the correction to reopen
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cor_Bw6EkMDmxCPeVQ2eYzLu\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"year\": 2026,\n  \"status\": \"draft\",\n  \"settlement_date\": \"2026-07-15\",\n  \"bank_account\": \"bnk_iPiAA7RDadr3gGMa2cvq\",\n  \"description\": \"Void and replace 3/31 payroll for J. Smith\",\n  \"metadata\": {},\n  \"operations\": [\n    {\n      \"operation\": \"void_payroll\",\n      \"creates\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"corrects\": \"pay_OriginalVoidedPayroll\"\n    },\n    {\n      \"operation\": \"add_payroll\",\n      \"creates\": \"pay_Vg3RvNwqLpTz8oYaGdQE\",\n      \"corrects\": null\n    }\n  ],\n  \"totals\": null,\n  \"preview\": null,\n  \"approval\": null,\n  \"reopen_deadline\": null,\n  \"simulation_mode\": \"automatic\",\n  \"created_at\": \"2026-06-24T18:26:56.848920Z\"\n}"
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/simulate/complete_funding:
    post:
      summary: '[Sandbox] Complete correction funding'
      description: Complete funding for a correction's company funds transfer. Sandbox-only. Returns an empty body; fetch the correction for its updated status.
      operationId: sandbox-correction-complete-funding
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/simulate/fail_funding:
    post:
      summary: '[Sandbox] Fail correction funding'
      description: Fail funding for a correction's company funds transfer. Sandbox-only. Returns an empty body; fetch the correction for its updated status.
      operationId: sandbox-correction-fail-funding
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Corrections
  /corrections/{correction}/simulate/start_processing:
    post:
      summary: '[Sandbox] Start correction processing'
      description: Start processing for a correction's money movement. Sandbox-only. Returns an empty body; fetch the correction for its updated status.
      operationId: sandbox-correction-start-processing
      parameters:
      - name: correction
        in: path
        description: ID of the correction
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Corrections
