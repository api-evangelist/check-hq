      summary: Reopen an external payroll
      description: Moves an approved external payroll's status to draft, allowing you to make further edits to the payroll or its items.
      operationId: reopen-a-pending-payroll
      parameters:
      - name: payroll
        in: path
        description: ID of the payroll to reopen
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
      tags:
      - External Payrolls
  /external_payrolls/{payroll}/validate:
    get:
      summary: Validate an external payroll
      description: 'Runs the checks that approving an external payroll runs, without approving the payroll. Use it to find problems with a draft external payroll before you approve it. It does not approve the payroll or change its status.


        Validate doesn''t recalculate the payroll. Use it to check for errors quickly while you fix a payroll, and use preview to review calculated amounts before you approve.


        If every check passes, the response is the external payroll object. If any check fails, the response is a `400` `validation_error`, with one entry in `input_errors` for each problem found.


        Validate does not run the negative quarter-to-date tax check. That check runs only when you approve, so an approve request can still fail after a validate request succeeds.'
      operationId: validate-an-external-payroll
      parameters:
      - name: payroll
        in: path
        description: ID of the external payroll to validate.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"pay_Z26PNMC7Ky1wfFQzVqfF\",\n    \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n    \"period_start\": \"2019-06-16\",\n    \"period_end\": \"2019-06-29\",\n    \"approved_at\": null,\n    \"payday\": \"2019-07-05\",\n    \"status\": \"draft\",\n    \"pay_frequency\": \"biweekly\",\n    \"items\": [\n        {\n            \"id\": \"itm_yvmmsVGFxLoBaMIkqzea\",\n            \"payroll\": \"pay_Z26PNMC7Ky1wfFQzVqfF\",\n            \"employee\": \"emp_zGGp6wYcxAeu1Ng8IA7v\",\n            \"earnings\": [\n                {\n                    \"amount\": \"961.54\",\n                    \"hours\": 40.0,\n                    \"type\": \"hourly\",\n                    \"workplace\": \"wrk_cxcG4vjGKcSXZk1fgKai\"\n                }\n            ],\n            \"reimbursements\": [],\n            \"taxes\": [\n                {\n                    \"tax\": \"tax_ImvSF9CTuMdokf0uwx5x\",\n                    \"amount\": \"59.62\"\n                },\n                {\n                    \"tax\": \"tax_O3f21hkS1cvHBZTa61BO\",\n                    \"amount\": \"13.94\"\n                }\n            ],\n            \"benefits\": [],\n            \"post_tax_deductions\": []\n        }\n    ],\n    \"contractor_payments\": [],\n    \"metadata\": {}\n}"
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": {\n        \"type\": \"validation_error\",\n        \"message\": \"Please correct the required fields and try again.\",\n        \"input_errors\": [\n            {\n                \"message\": \"Non-zero hours must be provided for hourly earnings\",\n                \"field\": \"hours\",\n                \"field_path\": [\n                    \"items\",\n                    \"1\",\n                    \"earnings\",\n                    \"0\",\n                    \"hours\"\n                ]\n            }\n        ]\n    }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Please correct the required fields and try again.
                      input_errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                              example: Non-zero hours must be provided for hourly earnings
                            field:
                              type: string
                              example: hours
                            field_path:
                              type: array
                              items:
                                type: string
                              example:
                              - items
                              - '1'
                              - earnings
                              - '0'
                              - hours
      deprecated: false
      tags:
      - External Payrolls
