openapi: 3.2.0
info:
  title: check-api Webhook Deliveries API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Webhook Deliveries
paths:
  /webhook_deliveries:
    get:
      summary: List webhook deliveries
      description: List the webhook deliveries generated for your provider. Filter by webhook config, company, topic, status, and created time range.
      operationId: list-webhook-deliveries
      parameters:
      - name: webhook_config
        in: query
        description: Return webhook deliveries for this webhook config.
        schema:
          type: string
      - name: company
        in: query
        description: Return webhook deliveries for this company.
        schema:
          type: string
      - name: topic
        in: query
        description: Return webhook deliveries with this webhook topic.
        schema:
          type: string
      - name: status
        in: query
        description: Return webhook deliveries with this delivery status (`pending`, `retrying`, `delivered`, or `failed`).
        schema:
          type: string
          enum:
          - pending
          - retrying
          - delivered
          - failed
      - name: created_after
        in: query
        description: Return webhook deliveries created on or after the provided datetime (ISO-8601).
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        description: Return webhook deliveries created on or before the provided datetime (ISO-8601).
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Number of webhook deliveries returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"whe_7uCODm8JFmZyov9jL8QO\",\n      \"webhook_config\": \"whc_7uCODm8JFmZyov9jL8QO\",\n      \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n      \"topic\": \"payroll\",\n      \"status\": \"delivered\",\n      \"created_at\": \"2024-01-19T17:04:15Z\",\n      \"attempts\": [\n        {\n          \"status_code\": 200,\n          \"created_at\": \"2024-01-19T17:04:15Z\"\n        }\n      ]\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: whe_7uCODm8JFmZyov9jL8QO
                        webhook_config:
                          type: string
                          nullable: true
                          example: whc_7uCODm8JFmZyov9jL8QO
                        company:
                          type: string
                          example: com_zH8Gq33iBkFj5o0GKjTw
                        topic:
                          type: string
                          example: payroll
                        status:
                          type: string
                          enum:
                          - pending
                          - retrying
                          - delivered
                          - failed
                          example: delivered
                        created_at:
                          type: string
                          format: date-time
                          example: '2024-01-19T17:04:15Z'
                        attempts:
                          type: array
                          items:
                            type: object
                            properties:
                              status_code:
                                type: integer
                                nullable: true
                                example: 200
                              created_at:
                                type: string
                                format: date-time
                                example: '2024-01-19T17:04:15Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      x-internal: false
      tags:
      - Webhook Deliveries
  /webhook_deliveries/{webhook_delivery}:
    get:
      summary: Get a webhook delivery
      description: Returns the specified webhook delivery.
      operationId: get-a-webhook-delivery
      parameters:
      - name: webhook_delivery
        in: path
        description: ID of the webhook delivery to return.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"whe_7uCODm8JFmZyov9jL8QO\",\n  \"webhook_config\": \"whc_7uCODm8JFmZyov9jL8QO\",\n  \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"topic\": \"payroll\",\n  \"status\": \"delivered\",\n  \"created_at\": \"2024-01-19T17:04:15Z\",\n  \"attempts\": [\n    {\n      \"status_code\": 200,\n      \"created_at\": \"2024-01-19T17:04:15Z\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: whe_7uCODm8JFmZyov9jL8QO
                  webhook_config:
                    type: string
                    nullable: true
                    example: whc_7uCODm8JFmZyov9jL8QO
                  company:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  topic:
                    type: string
                    example: payroll
                  status:
                    type: string
                    enum:
                    - pending
                    - retrying
                    - delivered
                    - failed
                    example: delivered
                  created_at:
                    type: string
                    format: date-time
                    example: '2024-01-19T17:04:15Z'
                  attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        status_code:
                          type: integer
                          nullable: true
                          example: 200
                        created_at:
                          type: string
                          format: date-time
                          example: '2024-01-19T17:04:15Z'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      x-internal: false
      tags:
      - Webhook Deliveries
  /webhook_deliveries/{webhook_delivery}/retry:
    post:
      summary: Retry a webhook delivery in sandbox
      description: Re-enqueue a webhook delivery. Available in sandbox only; returns a 400 in the live environment.
      operationId: retry-a-webhook-delivery-in-sandbox
      parameters:
      - name: webhook_delivery
        in: path
        description: ID of the webhook delivery to retry.
        schema:
          type: string
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"whe_7uCODm8JFmZyov9jL8QO\",\n  \"webhook_config\": \"whc_7uCODm8JFmZyov9jL8QO\",\n  \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"topic\": \"payroll\",\n  \"status\": \"pending\",\n  \"created_at\": \"2024-01-19T17:04:15Z\",\n  \"attempts\": []\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: whe_7uCODm8JFmZyov9jL8QO
                  webhook_config:
                    type: string
                    nullable: true
                    example: whc_7uCODm8JFmZyov9jL8QO
                  company:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  topic:
                    type: string
                    example: payroll
                  status:
                    type: string
                    enum:
                    - pending
                    - retrying
                    - delivered
                    - failed
                    example: pending
                  created_at:
                    type: string
                    format: date-time
                    example: '2024-01-19T17:04:15Z'
                  attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        status_code:
                          type: integer
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"error\": {\n    \"type\": \"disallowed_environment\",\n    \"message\": \"Webhook retries not allowed in live environment\"\n  }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: disallowed_environment
                      message:
                        type: string
                        example: Webhook retries not allowed in live environment
      x-internal: false
      tags:
      - Webhook Deliveries
