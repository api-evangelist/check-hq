  /setups/{setup}:
    get:
      summary: Get a setup
      description: Returns the setup of the specified ID.
      operationId: get-a-setup
      parameters:
      - name: setup
        in: path
        description: Id of the setup to return.
        schema:
          type: string
        required: true
      responses:
