      description: Returns setups in the most recently created order. You can additionally filter setups by company.
      operationId: list-setups
      parameters:
      - name: company
        in: query
        description: Filter setups by company ID.
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
