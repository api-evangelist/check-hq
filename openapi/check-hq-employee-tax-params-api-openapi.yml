info:
  title: check-api Employee Tax Params API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Employee Tax Params
paths:
  /employee_tax_params:
    get:
      summary: Bulk get employee tax parameters
      description: ''
      operationId: bulk-get-employee-tax-params
      parameters:
      - name: company
        in: query
        description: Unique ID of the company.
        required: true
        schema:
          type: string
      - name: as_of
        in: query
        description: Used to list tax parameters applicable as of the supplied date.
        schema:
          type: string
          format: date
      - name: jurisdiction
        in: query
        description: Used to further filter down the list of the employee’s tax parameters to specific jurisdictions.
        schema:
          type: string
      - name: submitter
        in: query
        description: Filter by submitter type. Can be `employee` or `company`.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Params
  /employee_tax_params/settings:
    get:
      summary: Bulk get employee tax parameter settings
      description: ''
      operationId: bulk-get-employee-tax-parameter-settings
      parameters:
      - name: company
        in: query
        description: Unique ID of the company.
        required: true
        schema:
          type: string
      - name: as_of
        in: query
        description: Used to list tax parameters applicable as of the supplied date.
        schema:
          type: string
      - name: jurisdiction
        in: query
        description: Used to further filter down the list of the employee’s tax parameters to specific jurisdictions.
        schema:
          type: string
      - name: submitter
        in: query
        description: Filter by submitter type. Can be `employee` or `company`.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Params
    patch:
      summary: Bulk update employee tax parameters
      description: ''
      operationId: bulk-update-employee-tax-parameters
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: array
                  description: List of employee tax param update objects
                  items:
                    properties:
                      id:
                        type: string
                        description: ID of the tax parameter that will be updated.
                      company:
                        type: string
                        description: ID of the company.
                      employee:
                        type: string
                        description: ID of the employee.
                      applied_for:
                        type: boolean
                        description: (Optional) Indicates whether the setting was marked as applied for.
                      value:
                        type: string
                        description: (Optional) The value of the setting.
                      effective_start:
                        type: string
                        description: (Optional) Date representing when the supplied value will start being effective.
                        format: date
                    required:
                    - id
                    - company
                    - employee
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Params
  /employee_tax_params/{employee_id}:
    get:
      summary: List an employee's tax parameters
      description: Get a paginated list of an employee’s tax parameters
      operationId: list-employees-tax-parameters
      parameters:
      - name: employee_id
        in: path
        description: ID of the employee used to list the applicable tax parameter.
        schema:
          type: string
        required: true
      - name: as_of
        in: query
        description: Used to list tax parameters applicable as of the supplied date.
        schema:
          type: string
          format: date
      - name: jurisdiction
        in: query
        description: Used to further filter down the list of the employee’s tax parameters to specific jurisdictions.
        schema:
          type: string
      - name: submitter
        in: query
        description: Filter by submitter type. Can be `employee` or `company`.
        schema:
          type: string
      - name: tax_id
        in: query
        description: Used to further filter down the list of the company’s tax parameters to a specific tax.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"spa_yqVxHQZb7aVPHrh16HRq\",\n      \"label\": \"Filing status\",\n      \"description\": \"Filing status\",\n      \"name\": \"filing_status\",\n      \"type\": \"select\",\n      \"options\": [\n        {\n          \"label\": \"Married but withholding at higher single rate\",\n          \"value\": \"MH\"\n        },\n        {\n          \"label\": \"Non-resident alien\",\n          \"value\": \"NRA\"\n        },\n        {\n          \"label\": \"Married\",\n          \"value\": \"M\"\n        },\n        {\n          \"label\": \"Single\",\n          \"value\": \"S\"\n        }\n      ],\n      \"depends_on\": null,\n      \"editable\": true,\n      \"effective_datable\": true,\n      \"can_be_applied_for\": false,\n      \"jurisdiction\": \"jur_mRpDYFyFSUD1ArZdrMis\",\n      \"tax\": \"tax_afRJqY785WwYH0PrtFde\",\n      \"setting\": null,\n      \"valid_formats\": null,\n      \"definitions\": null,\n      \"default_value\": \"S\",\n      \"help_links\": null,\n    },\n    ...,\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Params
  /employee_tax_params/{employee_id}/settings:
    get:
      summary: List an employee's tax parameter settings
      description: 'Get a paginated list of an employee’s tax parameter details which include a list of effective dated values. Each entry in `settings` carries an `actor` object naming the `party` that wrote that value: `check`, `partner`, `company`, or `employee`. `party` classifies the actor, not the setting’s subject, so a company user who edits an employee-scoped setting reads as `company`. `actor` is `null` when the attribution cannot be recovered.'
      operationId: list-employee-tax-parameter-settings
      parameters:
      - name: employee_id
        in: path
        description: ID of the employee used to list the applicable tax parameter details.
        schema:
          type: string
        required: true
      - name: as_of
        in: query
        description: Used to show the list of tax parameter with the list of effective dated details.
        schema:
          type: string
          format: date
      - name: jurisdiction
        in: query
        description: Used to further filter down the list of the employee’s tax parameter details to specific jurisdictions.
        schema:
          type: string
      - name: submitter
        in: query
        description: Filter by submitter type. Can be `employee` or `company`.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"spa_yqVxHQZb7aVPHrh16HRq\",\n      \"jurisdiction\": \"jur_mRpDYFyFSUD1ArZdrMis\",\n      \"applied_for\": null,\n      \"value\": \"M\",\n      \"effective_start\": \"2021-03-15\",\n      \"settings\": [\n        {\n          \"value\": \"M\",\n          \"effective_start\": \"2021-03-15\",\n          \"actor\": { \"party\": \"employee\" }\n        },\n        {\n          \"value\": \"S\",\n          \"effective_start\": \"2020-01-01\",\n          \"actor\": { \"party\": \"company\" }\n        }\n      ]\n    },\n    ...,\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employee Tax Params
