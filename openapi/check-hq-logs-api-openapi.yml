openapi: 3.2.0
info:
  title: check-api Logs API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Logs
paths:
  /logs:
    get:
      summary: List logs
      description: Returns a list of API request logs for your organization. Only requests made with an API key are included.
      operationId: list-logs
      parameters:
      - name: path
        in: query
        description: Return logs whose URL path contains this value (case-insensitive).
        schema:
          type: string
      - name: method
        in: query
        description: Return logs with this HTTP method. May be repeated to match multiple methods.
        schema:
          type: string
      - name: status_code
        in: query
        description: Return logs with this HTTP status code or status class (`2xx`, `3xx`, `4xx`, `5xx`). May be repeated.
        schema:
          type: string
      - name: id
        in: query
        description: Return logs with this log ID. May be repeated to match multiple logs.
        schema:
          type: string
      - name: idempotency_key
        in: query
        description: Return logs with this idempotency key.
        schema:
          type: string
      - name: created_after
        in: query
        description: Return logs created on or after this timestamp (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        description: Return logs created on or before this timestamp (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Number of logs returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 25
      - name: cursor
        in: query
        description: Pagination cursor from a `next` or `previous` response URL.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"log_abc123\",\n      \"ip_address\": \"192.168.1.1\",\n      \"path\": \"/employees\",\n      \"method\": \"POST\",\n      \"idempotency_key\": \"idem-123\",\n      \"headers\": {\n        \"Content-Type\": \"application/json\"\n      },\n      \"response_headers\": {\n        \"Content-Length\": \"100\"\n      },\n      \"query_params\": {\n        \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\"\n      },\n      \"status_code\": 201,\n      \"processing_duration\": 42,\n      \"created_at\": \"2026-04-22T12:00:00+00:00\",\n      \"request_body\": {\n        \"first_name\": \"Jane\",\n        \"last_name\": \"Doe\"\n      },\n      \"response_body\": {\n        \"id\": \"emp_1\"\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Log'
      deprecated: false
      tags:
      - Logs
  /logs/{log}:
    get:
      summary: Get a log
      description: Returns the specified API request log.
      operationId: get-a-log
      parameters:
      - name: log
        in: path
        description: ID of the log to return.
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"log_abc123\",\n  \"ip_address\": \"192.168.1.1\",\n  \"path\": \"/employees\",\n  \"method\": \"POST\",\n  \"idempotency_key\": null,\n  \"headers\": {\n    \"Content-Type\": \"application/json\"\n  },\n  \"response_headers\": null,\n  \"query_params\": null,\n  \"status_code\": 201,\n  \"processing_duration\": 42,\n  \"created_at\": \"2026-04-22T12:00:00+00:00\",\n  \"request_body\": null,\n  \"response_body\": {\n    \"id\": \"emp_1\"\n  }\n}"
              schema:
                $ref: '#/components/schemas/Log'
      deprecated: false
      tags:
      - Logs
components:
  schemas:
    Log:
      type: object
      properties:
        id:
          type: string
          example: log_abc123
        ip_address:
          type: string
          example: 192.168.1.1
        path:
          type: string
          example: /employees
        method:
          type: string
          example: POST
        idempotency_key:
          type: string
          nullable: true
          example: idem-123
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        response_headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
        query_params:
          type: object
          nullable: true
          additionalProperties:
            type: string
        status_code:
          type: integer
          example: 201
        processing_duration:
          type: integer
          example: 42
        created_at:
          type: string
          example: '2026-04-22T12:00:00+00:00'
        request_body:
          nullable: true
        response_body:
          nullable: true
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
x-readme-fauxas: true
