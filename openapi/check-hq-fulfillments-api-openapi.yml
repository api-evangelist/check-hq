openapi: 3.2.0
info:
  title: check-api Fulfillments API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Fulfillments
paths:
  /fulfillments:
    get:
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      parameters:
      - in: query
        name: company
        schema:
          type: string
        required: false
        description: Filters fulfillments by company ID
      - in: query
        name: payment
        schema:
          type: string
        description: Filters fulfillments by any related payments
      - in: query
        name: type
        schema:
          type: string
          enum:
          - balancing
          - unremittable_tax_refund
        description: Filter fulfillments by type. Accepted values are `balancing` and `unremittable_tax_refund`.
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      operationId: get_fulfillments
      summary: List fulfillments
      tags:
      - Fulfillments
  /fulfillments/{fulfillment}:
    get:
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: string
                    description: The company ID for which the fulfillment relates to
                  payment:
                    type: string
                    description: If there is a resulting direct payment (debit or credit) with the employer resulting from the fulfillment, this is the resulting payment ID
                required:
                - company
      parameters:
      - in: path
        name: fulfillment
        schema:
          type: string
        required: true
      operationId: get_fulfillments-fulfillment
      tags:
      - Fulfillments
      summary: Get fulfillments fulfillment
      x-summary-source: derived
  /fulfillments/{fulfillment}/receipt:
    get:
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: 'Note: URLs expire after 30 minutes'
                required:
                - url
      parameters:
      - in: path
        name: fulfillment
        schema:
          type: string
        required: true
      operationId: get_fulfillments-fulfillment-receipt
      tags:
      - Fulfillments
      summary: Get fulfillments fulfillment receipt
      x-summary-source: derived
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
