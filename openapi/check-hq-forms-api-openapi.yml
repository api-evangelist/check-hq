openapi: 3.2.0
info:
  title: check-api Forms API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Forms
paths:
  /forms:
    get:
      summary: List forms
      description: ''
      operationId: list-forms
      parameters:
      - name: state
        in: query
        description: Filter for forms that apply to the provided state. Must be a two-digit state abbreviation.
        schema:
          type: string
      - name: lang
        in: query
        description: Prefer returning forms in the provided ISO 639-1 language code. Fall back to English forms if preferred language form does not exist.
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - contractor_setup
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"frm_ntKOaUm6qIJabIBmqLXU\",\n      \"description\": \"Federal I-9\",\n      \"link\": \"https://www.uscis.gov/system/files_force/files/form/i-9-paper-version.pdf\",\n      \"revision_date\": \"2019-10-21\"\n    },\n    {\n      \"id\": \"frm_FBt3oC1x28IrZELkhb21\",\n      \"description\": \"Federal W-4\",\n      \"link\": \"https://www.irs.gov/pub/irs-pdf/fw4.pdf\",\n      \"revision_date\": \"2020-01-01\"\n    },\n    {\n      \"id\": \"frm_j7NxXAhh4ZlAsJ6tbP1A\",\n      \"description\": \"California DE-4\",\n      \"link\": \"https://www.edd.ca.gov/pdf_pub_ctr/de4.pdf\",\n      \"revision_date\": \"2020-02-01\"\n    },\n    ...\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Forms
  /forms/{form}:
    get:
      summary: Get a form
      description: ''
      operationId: get-a-form
      parameters:
      - name: form
        in: path
        schema:
          type: string
        required: true
      - name: type
        in: query
        description: By adding type=contractor_setup as a query parameter, we will surface all of the contractor specific forms.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"frm_VjOW9Qq93M7UGxi6eocg\",\n  \"description\": \"District of Columbia D-4\",\n  \"link\": \"https://www.exim.gov/sites/default/files/newsreleases/DCStateTaxForm-1.pdf\",\n  \"revision_date\": \"2010-12-01\",\n  \"parameters\": [\n    {\n      \"name\": \"first_name\",\n      \"label\": \"First name\",\n      \"description\": null,\n      \"type\": \"string\",\n      \"options\": null,\n      \"required\": true,\n      \"depends_on\": null\n    },\n    ...\n    {\n      \"name\": \"ssn\",\n      \"label\": \"Social Security number\",\n      \"description\": null,\n      \"type\": \"string\",\n      \"options\": null,\n      \"required\": true,\n      \"depends_on\": null\n    },\n    ...\n    {\n      \"name\": \"additional_amount\",\n      \"label\": \"Additional amount\",\n      \"description\": \"Add a whole dollar amount if any, you would like deducted from your paycheck for D.C Income Tax each pay period.\",\n      \"type\": \"currency\",\n      \"options\": null,\n      \"required\": false,\n      \"depends_on\": null\n    },\n    {\n      \"name\": \"exempt\",\n      \"label\": \"Exempt\",\n      \"description\": \"Before claiming exemption from withholding, read form and, if qualified, choose 'Yes'.\",\n      \"type\": \"select\",\n      \"options\": [\n        {\n          \"label\": \"No\",\n          \"value\": \"no\"\n        },\n        {\n          \"label\": \"Yes\",\n          \"value\": \"yes\"\n        }\n      ],\n      \"required\": false,\n      \"depends_on\": null\n    },\n    {\n      \"name\": \"domicile_is_other_state\",\n      \"label\": \"My domicile is a state other than the District of Columbia\",\n      \"description\": \"Fill in the state in which you reside if it is not the District of Columbia.\",\n      \"type\": \"select\",\n      \"options\": [\n        {\n          \"label\": \"No\",\n          \"value\": \"no\"\n        },\n        {\n          \"label\": \"Yes\",\n          \"value\": \"yes\"\n        }\n      ],\n      \"required\": true,\n      \"depends_on\": {\n        \"name\": \"exempt\",\n        \"value_matches\": \"yes\"\n      }\n    },\n    ...\n  ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Forms
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
