          type: string
      - name: id
        in: query
        description: Return logs with this log ID. May be repeated to match multiple logs.
        schema:
          type: string
      - name: idempotency_key
        in: query
        description: Return logs with this idempotency key.
        schema:
          type: string
      - name: created_after
        in: query
        description: Return logs created on or after this timestamp (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        description: Return logs created on or before this timestamp (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Number of logs returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 25
      - name: cursor
        in: query
        description: Pagination cursor from a `next` or `previous` response URL.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"log_abc123\",\n      \"ip_address\": \"192.168.1.1\",\n      \"path\": \"/employees\",\n      \"method\": \"POST\",\n      \"idempotency_key\": \"idem-123\",\n      \"headers\": {\n        \"Content-Type\": \"application/json\"\n      },\n      \"response_headers\": {\n        \"Content-Length\": \"100\"\n      },\n      \"query_params\": {\n        \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\"\n      },\n      \"status_code\": 201,\n      \"processing_duration\": 42,\n      \"created_at\": \"2026-04-22T12:00:00+00:00\",\n      \"request_body\": {\n        \"first_name\": \"Jane\",\n        \"last_name\": \"Doe\"\n      },\n      \"response_body\": {\n        \"id\": \"emp_1\"\n      }\n    }\n  ]\n}"
