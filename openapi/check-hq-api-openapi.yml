  /payments:
    get:
      summary: List payments
      description: ''
      operationId: list-payments
      parameters:
      - name: payroll
        in: query
        description: Return all payments, including debits and credits, related to a particular payroll ID
        schema:
          type: string
      - name: payroll_item
        in: query
        description: Return payments related to a particular parent payroll_item ID
        schema:
          type: string
      - name: contractor_payment
        in: query
        description: Return payments related to a particular parent contractor payment ID
        schema:
          type: string
      - name: parent_id
        in: query
        description: Return payments whose `parent_id` matches the given value. Repeat the parameter to match any of multiple parent IDs (OR), for example `?parent_id=pay_abc&parent_id=cor_def`. Values are matched against the `parent_id` returned on payment responses, including correction IDs (`cor_...`) when a correction is the parent. At most 100 values are allowed per request.
        schema:
          type: string
      - name: company
        in: query
        description: Return payments related to a particular company ID
        schema:
          type: string
      - name: direction
        in: query
        description: Return payments with direction
        schema:
          type: string
          enum:
          - credit
          - debit
      - name: amount_min
        in: query
        description: Return payments where amount ≥ an amount
        schema:
          type: string
      - name: amount_max
        in: query
        description: Return payments where amount ≤ an amount
        schema:
          type: string
      - name: type
        in: query
        description: Return payments with type
        schema:
          type: string
          enum:
          - company_cash_requirement
          - employee_net_pay
          - net_pay_refund
          - collection
          - refund
      - name: completion_date_after
        in: query
        description: Return payments whose expected completion date is on or after the specified date
        schema:
          type: string
          format: date
      - name: completion_date_before
        in: query
        description: Return payments whose expected completion date is on or before the specified date
        schema:
          type: string
          format: date
      - name: limit
        in: query
        description: Number of payments returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"pyt_uzasLBvddSm6aJkHGwQw\",\n      \"status\": \"paid\",\n      \"amount\": \"4522.0400\",\n      \"type\": \"company_cash_requirement\",\n      \"parent_type\": \"payroll\",\n      \"parent_id\": \"pay_aPKCtxqbi1jDNEWRrz9w\",\n      \"payment_attempts\": [\n        {\n          \"id\": \"pya_LUHvXtQBhkNM22xIk8K1\",\n          \"created_at\": \"2022-02-18T20:17:13.033205Z\",\n          \"expected_completion_date\": \"2022-02-23\",\n          \"status\": \"paid\",\n          \"failure_code\": null,\n          \"payment_method\": \"ach\",\n          \"payment_instrument\": \"bnk_W7hjDGn6sU1d3U8dr9bq\",\n          \"wire_details\": null,\n          \"ach_details\": {\n\t          \"ach_trace_id\": \"ABC12300080\",\n            \"description\": \"PAYMENT\",\n            \"transaction_type_code\": \"PCR\"\n          }\n        }\n      ],\n      \"can_retry\": false,\n      \"can_refund\"\
                    : false,\n      \"can_cancel\": false,\n  \t\t\"cancel_deadline\": \"2022-02-19T17:00:00.000Z\",\n      \"direction\": \"debit\",\n      \"company\": \"com_ENA4k8LMHbgpV07GLGSv\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pyt_uzasLBvddSm6aJkHGwQw
                        status:
                          type: string
                          example: paid
                        amount:
                          type: string
                          example: '4522.0400'
                        type:
                          type: string
                          example: company_cash_requirement
                        parent_type:
                          type: string
                          description: The parent type of the payment. One of `payroll`, `payroll_item`, `contractor_payment`, `collection`, `refund`, or `correction`. Payments that fund a correction report `correction` as the parent type.
                          example: payroll
                        parent_id:
                          type: string
                          description: The id of the parent of the payment (see `parent_type`). An id can be a `pay_...`, `itm_...`, `cpa_...`, `pyt_...`, or `cor_...` id. When `parent_type` is `correction`, this is the correction's id.
                          example: pay_aPKCtxqbi1jDNEWRrz9w
