                              wire_details: {}
                              ach_details:
                                type: object
                                properties:
                                  ach_trace_id:
                                    type: string
                                    example: ABC12300080
                                  description:
                                    type: string
                                    example: PAYMENT
                                  transaction_type_code:
                                    type: string
                                    example: PCR
                        can_retry:
                          type: boolean
                          example: false
                          default: true
                        can_refund:
                          type: boolean
                          example: false
                          default: true
                        can_cancel:
                          type: boolean
                          example: false
                          default: true
                        cancel_deadline:
                          type: string
                          example: '2022-02-19T17:00:00.000Z'
                        direction:
