openapi: 3.1.0
info:
  title: check-api
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
x-readme-fauxas: true
paths:
  /addresses/validate:
    post:
      summary: Validate address
      description: Validate an address using Check's address validation engine.
      operationId: validate-address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - line1
              - city
              - state
              - postal_code
              properties:
                line1:
                  type: string
                line2:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postal_code:
                  type: string
                country:
                  type: string
                  default: US
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /agencies:
    get:
      summary: List agencies
      operationId: list-agencies
      description: Returns the list of agencies.
      parameters:
      - name: id
        in: query
        description: Agency IDs to look up, for batch lookups. Repeat the parameter to provide multiple values (max 500 per request).
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: jurisdiction
        in: query
        description: Jurisdictions to filter to, as lowercase region codes (e.g. `fed`, `ny`, `pa`). A state's code includes its state and local agencies. Repeat the parameter to provide multiple values.
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: label_contains
        in: query
        description: Case-insensitive substring match on the agency `label`. Useful for looking up local agencies by name.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results per page (default 25, max 500).
        schema:
          type: integer
          default: 25
          maximum: 500
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    next: https://sandbox.checkhq.com/agencies?cursor=cD0lNUIlMjJmZWQlMjIlMkMlMjJJbnRlcm5hbCtSZXZlbnVlK1NlcnZpY2UlMjIlNUQ
                    previous: null
                    results:
                    - id: agc_ukjABgbD0hQ3dfBRyMPD
                      label: Internal Revenue Service
                      jurisdiction: fed
                    - id: agc_aocLMQ2cPTPcvUZegRxT
                      label: Berkheimer Tax Administrator
                      jurisdiction: pa
              schema:
                type: object
                properties:
                  next:
                    type: string
                    nullable: true
                    description: URL of the next page of results, or null if there are no more.
                  previous:
                    type: string
                    nullable: true
                    description: URL of the previous page of results, or null on the first page.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier (`agc_` prefix) for the agency.
                          example: agc_ukjABgbD0hQ3dfBRyMPD
                        label:
                          type: string
                          description: Human-readable name for display.
                          example: Internal Revenue Service
                        jurisdiction:
                          type: string
                          description: Lowercase region code (`fed` or a lowercased ISO 3166-2:US region code). Local agencies use their state's value.
                          example: fed
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      type: validation_error
                      message: Please correct the required fields and try again.
                      input_errors:
                      - field: detail
                        field_path:
                        - detail
                        message: Unknown jurisdiction.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Please correct the required fields and try again.
                      input_errors:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: detail
                            field_path:
                              type: array
                              items:
                                type: string
                            message:
                              type: string
                              example: Unknown jurisdiction.
      deprecated: false
  /agencies/{id}:
    get:
      summary: Get an agency
      operationId: get-an-agency
      description: Returns a single agency by ID.
      parameters:
      - name: id
        in: path
        description: ID of the agency.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: agc_ukjABgbD0hQ3dfBRyMPD
                    label: Internal Revenue Service
                    jurisdiction: fed
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier (`agc_` prefix) for the agency.
                    example: agc_ukjABgbD0hQ3dfBRyMPD
                  label:
                    type: string
                    description: Human-readable name for display.
                    example: Internal Revenue Service
                  jurisdiction:
                    type: string
                    description: Lowercase region code (`fed` or a lowercased ISO 3166-2:US region code). Local agencies use their state's value.
                    example: fed
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value:
                    error:
                      type: not_found
                      message: Not found.
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: not_found
                      message:
                        type: string
                        example: Not found.
      deprecated: false
  /bank_accounts:
    post:
      summary: Create a bank account
      description: 'Defines a bank account, and associates it with an existing company, contractor, or employee.


        One of `employee`, `company`, or `contractor` is required.'
      operationId: create-a-bank-account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: string
                  description: ID of the [employee](https://docs.checkhq.com/reference/the-employee-object) on the account
                company:
                  type: string
                  description: ID of the [company](https://docs.checkhq.com/reference/company) on the account
                contractor:
                  type: string
                  description: ID of the [contractor](https://docs.checkhq.com/reference/the-contractor-object) on the account
                raw_bank_account:
                  type: object
                  required:
                  - account_number
                  - routing_number
                  - subtype
                  properties:
                    account_number:
                      type: string
                      description: The account’s account number
                    routing_number:
                      type: string
                      description: The account’s routing number
                    institution_name:
                      type: string
                      description: The name of the bank holding the account
                    subtype:
                      type: string
                      description: The account’s subtype. Values may be `checking` or `savings`
                plaid_bank_account:
                  type: object
                  required:
                  - plaid_processor_token
                  properties:
                    plaid_processor_token:
                      type: string
                      description: A Check processor token retrieved from the Plaid API
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with this bank account
                  format: json
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
    get:
      summary: List bank accounts
      description: Lists all bank accounts.
      operationId: list-bank-accounts
      parameters:
      - name: company
        in: query
        description: Return bank accounts for this [company](https://docs.checkhq.com/reference/company) ID.
        schema:
          type: string
      - name: employee
        in: query
        description: 'Return bank accounts for these [employee](https://docs.checkhq.com/reference/the-employee-object) IDs. You can specify multiple employee IDs by repeating this parameter:

          `?employee=emp_abc123&employee=emp_xyz789`. '
        schema:
          type: string
      - name: contractor
        in: query
        description: Return bank accounts for this [contractor](https://docs.checkhq.com/reference/the-contractor-object) ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of bank accounts returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/MetadataListFilter'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n\t{\n    \"id\": \"bnk_abc\",\n    \"employee\": \"emp_xyz\",\n    \"raw_bank_account\": {\n      \"institution_name\": \"Chase\",\n      \"account_number\": \"112233445\",\n      \"routing_number\": \"011401533\",\n      \"subtype\": \"checking\"\n    },\n    \"metadata\": {}\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: bnk_abc
                    employee:
                      type: string
                      example: emp_xyz
                    raw_bank_account:
                      type: object
                      properties:
                        institution_name:
                          type: string
                          example: Chase
                        account_number:
                          type: string
                          example: '112233445'
                        routing_number:
                          type: string
                          example: '011401533'
                        subtype:
                          type: string
                          example: checking
                    metadata:
                      type: object
                      properties: {}
      deprecated: false
  /bank_accounts/{bank_account}:
    patch:
      summary: Update a bank account
      description: 'Updates a bank account.


        **Note: **Only “raw” bank accounts may be updated with this call. Plaid processor token-based bank accounts may not be updated.'
      operationId: update-a-bank-account
      parameters:
      - name: bank_account
        in: path
        description: ID of the bank account
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - raw_bank_account
              properties:
                raw_bank_account:
                  type: object
                  required:
                  - account_number
                  - routing_number
                  - subtype
                  properties:
                    account_number:
                      type: string
                      description: The account’s account number
                    routing_number:
                      type: string
                      description: The account’s routing number
                    institution_name:
                      type: string
                      description: The name of the bank holding the account
                    subtype:
                      type: string
                      description: The account’s subtype. Values may be `checking` or `savings`
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with this bank account
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
    delete:
      summary: Delete a bank account
      description: Deletes the specified bank account.
      operationId: delete-a-bank-account
      parameters:
      - name: bank_account
        in: path
        description: ID of the bank account to delete
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
  /bank_accounts/{bank_account}/reveal:
    get:
      summary: Reveal account number
      description: Reveal the unmasked account number of both raw and plaid bank accounts. Reach out to Check to get support for this feature
      operationId: reveal-account-number
      parameters:
      - name: bank_account
        in: path
        description: The ID of the bank account that you want the account number for
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"bnk_Wr8oItjaUJgvLNbN2MJa\",\n    \"company\": \"com_iI59t4yqiBbpkMuabvU6\",\n    \"status\": \"ownership_verified\",\n    \"raw_bank_account\": {\n        \"institution_name\": \"sksrsgitagelm\",\n        \"account_number\": \"770608869\", // New account number in this response only\n        \"account_number_last_four\": \"8869\",\n        \"routing_number\": \"559435723\",\n        \"type\": \"depository\",\n        \"subtype\": \"checking\"\n    },\n    \"metadata\": {},\n    \"supported_payment_types\": []\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: bnk_Wr8oItjaUJgvLNbN2MJa
                  company:
                    type: string
                    example: com_iI59t4yqiBbpkMuabvU6
                  status:
                    type: string
                    example: ownership_verified
                  raw_bank_account:
                    type: object
                    properties:
                      institution_name:
                        type: string
                        example: sksrsgitagelm
                      account_number:
                        type: string
                        example: '770608869'
                      account_number_last_four:
                        type: string
                        example: '8869'
                      routing_number:
                        type: string
                        example: '559435723'
                      type:
                        type: string
                        example: depository
                      subtype:
                        type: string
                        example: checking
                  metadata:
                    type: object
                    properties: {}
                  supported_payment_types:
                    type: array
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /benefits:
    get:
      summary: List benefits
      description: Returns a list of benefits.
      operationId: list-benefits
      parameters:
      - name: employee
        in: query
        description: Return benefits for this employee ID.
        schema:
          type: string
      - name: company
        in: query
        description: Return benefits for all employees of this company ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of benefits returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: include_external
        in: query
        description: Flag to indicate if to additionally expose external benefits in the list response. Defaults to false if not included.
        schema:
          type: boolean
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"ben_lrcYUhTk1FVZl2vSCOBP\",\n    \"employee\": \"emp_kKTK4VafMNc5pIbI0G9x\",\n    \"benefit\": \"401k\",\n    \"company_benefit\": null,\n    \"source\": null,\n   \t\"period\": null,\n    \"description\": \"Guideline 401(k)\",\n    \"effective_start\": \"2020-01-01\",\n    \"effective_end\": null,\n    \"company_contribution_amount\": null,\n    \"company_contribution_percent\": 1.0,\n    \"company_period_amount\": null,\n    \"employee_contribution_amount\": null,\n    \"employee_contribution_percent\": 1.0,\n    \"employee_period_amount\": null,\n    \"hsa_contribution_limit\": null,\n    \"metadata\": {}\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: ben_lrcYUhTk1FVZl2vSCOBP
                    employee:
                      type: string
                      example: emp_kKTK4VafMNc5pIbI0G9x
                    benefit:
                      type: string
                      example: 401k
                    company_benefit: {}
                    source: {}
                    period: {}
                    description:
                      type: string
                      example: Guideline 401(k)
                    effective_start:
                      type: string
                      example: '2020-01-01'
                    effective_end: {}
                    company_contribution_amount: {}
                    company_contribution_percent:
                      type: integer
                      example: 1
                      default: 0
                    company_period_amount: {}
                    employee_contribution_amount: {}
                    employee_contribution_percent:
                      type: integer
                      example: 1
                      default: 0
                    employee_period_amount: {}
                    hsa_contribution_limit: {}
                    metadata:
                      type: object
                      properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /benefits/{benefit}:
    delete:
      summary: Delete a benefit
      description: Deletes the specified benefit.
      operationId: delete-an-employee-benefit
      parameters:
      - name: benefit
        in: path
        description: ID of the benefit to delete
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /communications:
    get:
      summary: List communications
      description: ''
      operationId: list-communications
      parameters:
      - name: company
        in: query
        description: Return communications for all entities associated with this company.
        schema:
          type: string
      - name: start_date
        in: query
        description: 'Return communications created on or after the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 'Return communications created on or before the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: Return communications for this communication type (`email` or `text`)
        schema:
          type: string
      - name: recipient
        in: query
        description: Return communications for this recipient.
        schema:
          type: string
      - name: recipient_type
        in: query
        description: Return communications for this recipient type (`company_email`, `employee_email`, `contractor_email`)
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"cmn_MrFrw0F82NSJjyw10Erk\",\n      \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n      \"recipient_type\": \"company_email\",\n      \"recipient\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n      \"type\": \"email\",\n      \"originator\": \"check\",\n      \"email\": {\n        \"to\": [\n          \"example@gmail.com\"\n        ],\n        \"from\": \"support@checkhq.zendesk.com\",\n        \"cc\": [\n          \"payroll-support@partner.co\"\n        ],\n        \"subject\": \"Check <> Example Coffee\",\n        \"noreply\": false\n      },\n      \"notification\": {\n        \"id\": null,\n        \"topic\": null\n      },\n      \"created_at\": \"2024-01-19 17:04:15+00\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: cmn_MrFrw0F82NSJjyw10Erk
                        company:
                          type: string
                          example: com_zH8Gq33iBkFj5o0GKjTw
                        recipient_type:
                          type: string
                          example: company_email
                        recipient:
                          type: string
                          example: com_zH8Gq33iBkFj5o0GKjTw
                        type:
                          type: string
                          example: email
                        originator:
                          type: string
                          example: check
                        email:
                          type: object
                          properties:
                            to:
                              type: array
                              items:
                                type: string
                                example: example@gmail.com
                            from:
                              type: string
                              example: support@checkhq.zendesk.com
                            cc:
                              type: array
                              items:
                                type: string
                                example: payroll-support@partner.co
                            subject:
                              type: string
                              example: Check <> Example Coffee
                            noreply:
                              type: boolean
                              example: false
                              default: true
                        notification:
                          type: object
                          properties:
                            id: {}
                            topic: {}
                        created_at:
                          type: string
                          example: '2024-01-19 17:04:15+00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /communications/{communication}:
    get:
      summary: Get a communication
      description: ''
      operationId: get-a-communication
      parameters:
      - name: communication
        in: path
        description: ID of the communication to return
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cmn_MrFrw0F82NSJjyw10Erk\",\n  \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"recipient_type\": \"company_email\",\n  \"recipient\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"type\": \"email\",\n  \"originator\": \"check\",\n  \"email\": {\n    \"to\": [\n      \"example@gmail.com\"\n    ],\n    \"from\": \"support@checkhq.zendesk.com\",\n    \"cc\": [\n      \"payroll-support@partner.co\"\n    ],\n    \"subject\": \"Check <> Example Coffee\",\n    \"noreply\": false\n  },\n  \"notification\": {\n    \"id\": null,\n    \"topic\": null\n  },\n  \"created_at\": \"2024-01-19 17:04:15+00\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: cmn_MrFrw0F82NSJjyw10Erk
                  company:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  recipient_type:
                    type: string
                    example: company_email
                  recipient:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  type:
                    type: string
                    example: email
                  originator:
                    type: string
                    example: check
                  email:
                    type: object
                    properties:
                      to:
                        type: array
                        items:
                          type: string
                          example: example@gmail.com
                      from:
                        type: string
                        example: support@checkhq.zendesk.com
                      cc:
                        type: array
                        items:
                          type: string
                          example: payroll-support@partner.co
                      subject:
                        type: string
                        example: Check <> Example Coffee
                      noreply:
                        type: boolean
                        example: false
                        default: true
                  notification:
                    type: object
                    properties:
                      id: {}
                      topic: {}
                  created_at:
                    type: string
                    example: '2024-01-19 17:04:15+00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /companies:
    get:
      summary: List companies
      description: Returns a list of all companies.
      operationId: list-companies
      parameters:
      - name: active
        in: query
        description: Filter companies by whether they are active or not active.
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        description: Number of companies returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
