  /payrolls/{payroll}/void:
    post:
      summary: Void a payroll
      description: Creates a void payroll that zeros out items on an existing payroll and attaches it to a draft correction.
      operationId: void-a-payroll
      parameters:
      - name: payroll
        in: path
        description: ID of the payroll to void
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - correction
              properties:
                correction:
                  type: string
                  description: ID of the draft [correction](https://docs.checkhq.com/reference/the-correction-object) to attach the void payroll to.
                subset:
                  type: object
                  nullable: true
                  description: Omit or set to `null` to void the entire payroll. Otherwise, void exactly the listed payroll items and/or contractor payments.
                  properties:
                    payroll_items:
                      type: array
                      items:
                        type: string
                      description: IDs of the payroll items to void. An omitted or null list voids none of this kind.
                    contractor_payments:
                      type: array
                      items:
                        type: string
                      description: IDs of the contractor payments to void. An omitted or null list voids none of this kind.
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n  \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n  \"period_start\": \"2026-03-14\",\n  \"period_end\": \"2026-03-27\",\n  \"payday\": \"2026-03-31\",\n  \"status\": \"draft\",\n  \"type\": \"regular\",\n  \"managed\": true,\n  \"is_void\": true,\n  \"items\": [\n    {\n      \"id\": \"itm_u47H5GlEeTRiuroEdtOg\",\n      \"payroll\": \"pay_Mt7cJqXcVfW2yPKhBvsN\",\n      \"employee\": \"emp_h4VezdUn9v9oSoyORQC7\",\n      \"status\": \"draft\",\n      \"void_of\": \"itm_Ue75kUcWex5JRGTRuqux\",\n      \"voided_by\": null,\n      \"net_pay\": \"-330.68\",\n      \"earnings\": [\n        {\n          \"amount\": \"-400.00\",\n          \"hours\": -40.0,\n          \"type\": \"hourly\",\n          \"workplace\": \"wrk_5wEgDPwh0dYqElB6yArb\"\n        }\n      ],\n      \"taxes\": [\"...\"],\n      \"benefits\": [],\n      \"post_tax_deductions\": [],\n      \"warnings\": []\n    }\n  ],\n  \"contractor_payments\": [],\n  \"metadata\"\
