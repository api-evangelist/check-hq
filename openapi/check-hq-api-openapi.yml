    get:
      summary: List payrolls
      description: Returns a list of payrolls.
      operationId: list-payrolls
      parameters:
      - name: company
        in: query
        description: Return payrolls for this [company](https://docs.checkhq.com/reference/company) ID.
        schema:
          type: string
      - name: type
        in: query
        description: Return payrolls of these types. Repeat the parameter to match any of multiple values (for example, `?type=regular&type=off_cycle`).
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - regular
            - off_cycle
            - amendment
            - balancing
      - name: is_void
        in: query
        description: Filter to void payrolls (true) or non-void payrolls (false).
        schema:
          type: boolean
      - name: managed
        in: query
        description: Return payrolls of this `managed` status.
        schema:
          type: boolean
      - name: limit
        in: query
        description: Number of payrolls returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: payday_after
        in: query
        description: 'Return payrolls whose payday is on or after the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: payday_before
        in: query
        description: 'Return payrolls whose payday is on or before the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Return payrolls in a given status. Repeat the parameter to match any of multiple values (for example, `?status=paid&status=partially_paid`).
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - pending
            - processing
            - paid
            - partially_paid
            - failed
      - name: approved
        in: query
        description: Filter payrolls based on their approval status
        schema:
          type: boolean
      - name: pay_schedule
        in: query
        description: Return payrolls for this [pay schedule](https://docs.checkhq.com/reference/the-pay-schedule-object)
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
        description: Filter the list to a specific set of payroll IDs
      - name: include_items
        in: query
        description: Return related payroll items directly on each payroll.
        schema:
          type: boolean
          default: false
      - name: include_contractor_payments
        in: query
        description: Return related contractor payments directly on each payroll.
        schema:
          type: boolean
