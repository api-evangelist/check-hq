      description: 'This Component allows employers to configure their federal and state tax setup based on the company’s location.<img style="margin-top: 30px; margin-bottom: 20px;" src="https://public-onboard-assets.s3.amazonaws.com/tax-setup-component.png" />Learn how to embed Components in our <a target="_blank" href="https://docs.checkhq.com/docs/embedding-a-component">guide</a>.'
      operationId: company-tax-setup
      parameters:
      - name: company
        in: path
        description: ID of the company for which a component link will be generated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - signer_name
              - signer_title
              - email
              properties:
                signer_name:
                  type: string
                  description: The name of the person who has permission to onboard on behalf of the company.
                signer_title:
                  type: string
                  description: The title of the person who has permission to onboard on behalf of the company (e.g. "Officer", "Manager", etc.).
                email:
                  type: string
                  description: The email of the person who has permission to onboard on behalf of the company
                signatory:
                  type: string
                  description: The ID of the signatory object for this company. You may use either a signatory ID or the three body params above
                jurisdiction:
                  type: string
                  description: Initially select the provided jurisdiction. Use the value “FED” for federal or the last 2 letters of the ISO 3166-2:US code for the jurisdiction.
                  default: FED
                federal_only:
                  type: boolean
                  description: Only show the Federal tab if True.
                  default: false
                field_permissions:
                  type: object
                  description: 'Locks company fields in the Component or Onboard flow that this link opens. Each key names a field, and each value sets its access level: `read` shows the field without letting the user edit it, and `read_write` is the default. An unknown key or level returns a 400. Keys that this Component doesn''t render are accepted and ignored, so you can send the same map on every link. Check Components enforces the lock in its UI only. The API still accepts writes to a locked field. See [Locking company fields](https://docs.checkhq.com/docs/locking-company-fields).'
                  properties:
                    company:legal_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal name.
                    company:trade_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's trade name.
                    company:address:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal address. Workplace addresses aren't affected.
                    company:phone:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's phone number.
                    company_tax_param:federal_ein:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's federal EIN in tax setup.
                  additionalProperties: false
                  example:
                    company:legal_name: read
                    company:trade_name: read
                    company:address: read
                    company:phone: read
                    company_tax_param:federal_ein: read
      responses:
