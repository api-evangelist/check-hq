    get:
      summary: List an employee's tax parameter settings
      description: 'Get a paginated list of an employee’s tax parameter details which include a list of effective dated values. Each entry in `settings` carries an `actor` object naming the `party` that wrote that value: `check`, `partner`, `company`, or `employee`. `party` classifies the actor, not the setting’s subject, so a company user who edits an employee-scoped setting reads as `company`. `actor` is `null` when the attribution cannot be recovered.'
