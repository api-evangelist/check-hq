  /post_tax_deductions:
    post:
      summary: Create a post-tax deduction
      description: Creates a post-tax deduction.
      operationId: create-a-post-tax-deduction
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - employee
              - description
              - effective_start
              properties:
                type:
                  type: string
                  description: The type of post-tax deduction
                  enum:
                  - miscellaneous
                  - child_support
                  - miscellaneous_garnishment
                employee:
                  type: string
                  description: ID of the employee to be associated with the post-tax deduction.
                description:
                  type: string
                  description: A description of this deduction. Maximum length of 255 characters.
                effective_start:
                  type: string
                  description: Start date for the deduction
                  format: date
                effective_end:
                  type: string
                  description: End date for the deduction
                  format: date
                miscellaneous:
                  type: object
                  description: The configuration object for a miscellaneous post-tax deduction
                  properties:
                    total_amount:
                      type: string
                      description: Total amount that should ever be withheld
                    amount:
                      type: string
                      description: Amount that should be withheld per pay period
                    percent:
                      type: number
                      description: Percentage of wages that should be withheld per pay period.
                      format: float
                    annual_limit:
                      type: string
                      description: Total amount that should be withheld for a calendar year
                child_support:
                  type: object
                  description: The configuration object for a child support garnishment
                  required:
                  - external_id
                  - agency
                  - issue_date
                  - amount
                  - max_percent
                  properties:
                    external_id:
                      type: string
                      description: The unique identifier of the garnishment order, listed as the case number on the order
                    agency:
                      type: string
                      description: The state abbreviation of the agency that issued the order
                    fips_code:
                      type: string
                      description: An optional 5 or 7 digit number used to identify the correct agency within the state. This should be provided if present in the order. Auto-populated if required but not set.
                    issue_date:
                      type: string
                      description: The date the collections agency issued the order
                      format: date
                    amount:
                      type: string
                      description: Per pay period amount to deduct
                    max_percent:
                      type: number
                      description: The maximum percent of disposable income that can be deducted
                      format: float
                miscellaneous_garnishment:
                  type: object
                  description: The configuration object for a miscellaneous garnishment post-tax deductions
                  properties:
                    amount:
                      type: number
                      description: The per pay period amount that should be garnished (up to the max_percent of disposable income).
                      format: float
                    percent:
                      type: number
                      description: The percentage of disposable income that should be garnished (must be less than max_percent).
                      format: float
                    total_amount:
                      type: number
                      description: The maximum amount that should be garnished in the lifespan of this garnishment.
                      format: float
                    annual_limit:
                      type: number
                      description: The maximum amount that should be garnished in a calendar year.
                      format: float
                    priority:
                      type: integer
                      description: The priority order in which this garnishment should be calculated (1 is the highest priority). Ties are broken by creation time (oldest first).
                      format: int32
                    max_percent:
                      type: number
                      description: The maximum percent of disposable income that should be garnished (defaults to 25%)
                      format: float
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the post-tax deduction
                  format: json
                managed:
                  type: boolean
                  description: Denotes whether or not the post-tax deduction should be remitted by Check. Applicable to child support payments only, more info can be found [here](https://docs.checkhq.com/docs/post-tax-deductions#remitting-child-support-garnishments).
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: ''
      deprecated: false
    get:
      summary: List post-tax deductions
      description: Lists post-tax deductions.
      operationId: list-post-tax-deductions
      parameters:
      - name: employee
        in: query
        description: Return post-tax deductions for this employee ID.
        schema:
          type: string
      - name: company
        in: query
        description: Return post-tax deductions for all employees of this company ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of post-tax deductions returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: include_external
        in: query
        description: Flag to indicate if to additionally expose external deductions in the list response. Defaults to false if not included
        schema:
          type: boolean
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
