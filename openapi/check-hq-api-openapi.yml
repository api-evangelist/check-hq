        description: Return paydays for this company ID
        schema:
          type: string
        required: true
      - name: start
        in: query
        description: Return paydays on or after this date. If not a valid payday, the first date in the returned range will be the first valid payday after this date. If omitted, this endpoint will return items starting from today.
