  /payrolls/{payroll}/approve:
    post:
      summary: Approve a payroll
      description: Approves a payroll.
      operationId: approve-payroll
      parameters:
      - name: payroll
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - preview_superseded
                  message:
                    type: string
                required:
                - error
                - message
              examples:
                Conflict:
                  summary: Conflict
                  value:
                    error:
                      type: preview_superseded
                      message: The payroll was re-previewed after the timestamp provided in preview_started_at. Please re-fetch the payroll to get the latest preview before approving.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preview_started_at:
                  type: string
                  description: OPTIONAL. The preview.started_at timestamp the client last saw. If provided and it no longer matches the payroll's current preview, the request fails with a 409 preview_superseded error instead of approving.
  /payrolls/{payroll}/paper_checks:
    get:
      summary: Get paper checks
      description: Generate paper checks for the specified payroll.
      operationId: get-paper-checks
      parameters:
      - name: payroll
        in: path
        schema:
          type: string
          default: ID of the payroll
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url": "string"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
