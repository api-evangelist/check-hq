openapi: 3.2.0
info:
  title: check-api Contractor Payments API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Contractor Payments
paths:
  /contractor_payments:
    post:
      summary: Create a contractor payment
      description: Creates a contractor payment.
      operationId: create-a-contractor-payment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contractor
              - payroll
              - amount
              properties:
                contractor:
                  type: string
                  description: ID of the contractor to pay
                payroll:
                  type: string
                  description: ID of the payroll this contractor payment will be paid out on
                payment_method:
                  type: string
                  description: The way the contractor will be paid, either “direct_deposit” or "manual"
                  default: direct_deposit
                amount:
                  type: string
                  description: The amount the contractor will be paid
                  default: '0.00'
                reimbursement_amount:
                  type: string
                  description: The amount to reimburse the contractor
                  default: '0.00'
                workplace:
                  type: string
                  description: The Workplace ID associated with this payment.
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with this contractor payment
                  format: json
                paper_check_number:
                  type: string
                  description: For accounting. The check number associated with any printed checks. Can be updated even after the associated payroll has been approved. See [Get a paper check](https://docs.checkhq.com/reference/get-a-paper-check-2) for more details.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Contractor Payments
  /contractor_payments/{contractor_payment}:
    get:
      summary: Get a contractor payment
      description: Returns the specified contractor payment.
      operationId: get-a-contractor-payment
      parameters:
      - name: contractor_payment
        in: path
        description: ID of the contractor payment to return
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Contractor Payments
    delete:
      summary: Delete a contractor payment
      description: ''
      operationId: delete-a-contractor-payment
      parameters:
      - name: contractor_payment
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Contractor Payments
  /contractor_payments/{contractor_payment}/paper_check:
    get:
      summary: Get a paper check
      description: 'Returns a paper check for the specified contractor payment.


        Use an `Accept: application/pdf` request header to download the paper check as a PDF document.'
      operationId: get-a-paper-check-2
      parameters:
      - name: contractor_payment
        in: path
        description: ID of the contractor payment to return
        schema:
          type: string
        required: true
      - name: Accept
        in: header
        description: application/pdf
        schema:
          type: string
      - name: payment_id
        in: query
        description: Optional ID of a single net-pay-split payment (`pyt_…`). When provided, the check amount is scoped to just that split's payment (e.g. to reissue one failed direct deposit) instead of the full net pay. Rejected unless that payment can be reissued (e.g. it already paid, is still in flight, or was reversed).
        schema:
          type: string
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url": "string"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: string
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Contractor Payments
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
