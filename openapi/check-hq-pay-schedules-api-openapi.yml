- name: Pay Schedules
paths:
  /pay_schedules:
    post:
      summary: Create a pay schedule
      description: Creates a new pay schedule.
      operationId: create-a-pay-schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - pay_frequency
              - first_payday
              - first_period_end
              properties:
                company:
                  type: string
                  description: ID of the company that this pay schedule relates to.
                name:
                  type: string
                  description: Human-readable name of the pay schedule.
                pay_frequency:
                  type: string
                  description: Frequency by which [employees](https://docs.checkhq.com/reference/the-employee-object) get paid.<br><br>One of `weekly`, `biweekly`, `semimonthly`, `monthly`, `quarterly`, or `annually`.
                first_payday:
                  type: string
                  description: The payday date of the first payroll the company will run on Check on this pay schedule.
                  format: date
                second_payday:
                  type: string
                  description: The payday date of the second payroll the company will run on Check on this pay schedule. This field should only be used with the `semimonthly` frequency to specify custom paydays besides the 15th and last day of the month. `second_payday` must be between one day and one month after `first_payday`.
                first_period_end:
                  type: string
                  description: The period end date of the first payroll the company will run on Check on this pay schedule.
                  format: date
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the pay schedule
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"psc_ARONfuK7dWUk1xFlQM77\",\n   \"company\": \"com_fOBk0fGUbJ76z3hF6hc6\",\n   \"name\": \"Pay schedule 2\",\n   \"pay_frequency\": \"semimonthly\",\n   \"first_payday\": \"2023-04-23\",\n   \"second_payday\": \"2023-05-09\",\n   \"first_period_end\": \"2023-04-15\",\n   \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: psc_ARONfuK7dWUk1xFlQM77
                  company:
                    type: string
                    example: com_fOBk0fGUbJ76z3hF6hc6
                  name:
                    type: string
                    example: Pay schedule 2
                  pay_frequency:
                    type: string
                    example: semimonthly
                  first_payday:
                    type: string
                    example: '2023-04-23'
                  second_payday:
                    type: string
                    example: '2023-05-09'
                  first_period_end:
                    type: string
                    example: '2023-04-15'
                  metadata:
                    type: object
                    properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pay Schedules
    get:
      summary: List pay schedules
      description: Returns a list of pay schedules.
      operationId: list-pay-schedules
      parameters:
      - name: company
        in: query
        schema:
          type: string
      - name: limit
        in: query
        description: Number of pay schedules returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[{\n  \"id\": \"psc_ARONfuK7dWUk1xFlQM77\",\n   \"company\": \"com_fOBk0fGUbJ76z3hF6hc6\",\n   \"name\": \"Pay schedule 2\",\n   \"pay_frequency\": \"semimonthly\",\n   \"first_payday\": \"2023-04-23\",\n   \"second_payday\": \"2023-05-09\",\n   \"first_period_end\": \"2023-04-15\",\n   \"metadata\": {}\n}]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: psc_ARONfuK7dWUk1xFlQM77
                    company:
                      type: string
                      example: com_fOBk0fGUbJ76z3hF6hc6
                    name:
                      type: string
                      example: Pay schedule 2
                    pay_frequency:
                      type: string
                      example: semimonthly
                    first_payday:
                      type: string
                      example: '2023-04-23'
                    second_payday:
                      type: string
                      example: '2023-05-09'
                    first_period_end:
                      type: string
                      example: '2023-04-15'
                    metadata:
                      type: object
                      properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pay Schedules
  /pay_schedules/{pay_schedule}:
    get:
      summary: Get a pay schedule
      description: Returns the specified pay schedule.
      operationId: get-a-pay-schedule
      parameters:
      - name: pay_schedule
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"psc_ARONfuK7dWUk1xFlQM77\",\n   \"company\": \"com_fOBk0fGUbJ76z3hF6hc6\",\n   \"name\": \"Pay schedule 2\",\n   \"pay_frequency\": \"semimonthly\",\n   \"first_payday\": \"2023-04-23\",\n   \"second_payday\": \"2023-05-09\",\n   \"first_period_end\": \"2023-04-15\",\n   \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: psc_ARONfuK7dWUk1xFlQM77
                  company:
                    type: string
                    example: com_fOBk0fGUbJ76z3hF6hc6
                  name:
                    type: string
                    example: Pay schedule 2
                  pay_frequency:
                    type: string
                    example: semimonthly
                  first_payday:
                    type: string
                    example: '2023-04-23'
                  second_payday:
                    type: string
                    example: '2023-05-09'
                  first_period_end:
                    type: string
                    example: '2023-04-15'
                  metadata:
                    type: object
                    properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pay Schedules
    delete:
      summary: Delete a pay schedule
      description: Deletes the specified pay schedule.
      operationId: delete-a-pay-schedule
      parameters:
      - name: pay_schedule
        in: path
        schema:
          type: string
        required: true
      responses:
        '204':
          description: '204'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pay Schedules
  /pay_schedules/{pay_schedule}/paydays:
    get:
      summary: Get paydays
      description: Returns a list of paydays and their corresponding period_start, period_end, and approval_deadline dates for the specified pay schedule. Results span one year of dates. If the payday or approval_deadline was impacted by a weekend or a bank holiday, then impacted_by_weekend_or_holiday will be true, otherwise false.
      operationId: get-paydays
      parameters:
      - name: pay_schedule
        in: path
        schema:
          type: string
        required: true
      - name: start
        in: query
        description: Return paydays on or after this date.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[{\n  \"payday\": \"2024-05-09\",\n  \"period_start\": \"2024-04-16\",\n  \"period_end\": \"2024-05-01\",\n  \"approval_deadline\": \"2024-05-03\",\n  \"impacted_by_weekend_or_holiday\": false,\n  \"approval_deadline_datetime\": \"2024-05-07T17:00:00-07:00\"\n}]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    payday:
                      type: string
                      example: '2024-05-09'
                    period_start:
                      type: string
                      example: '2024-04-16'
                    period_end:
                      type: string
                      example: '2024-05-01'
                    approval_deadline:
                      type: string
                      example: '2024-05-03'
                    impacted_by_weekend_or_holiday:
                      type: boolean
                      example: false
                      default: true
                    approval_deadline_datetime:
                      type: string
                      example: '2024-05-07T17:00:00-07:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pay Schedules
