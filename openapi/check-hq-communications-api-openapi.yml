openapi: 3.2.0
info:
  title: check-api Communications API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Communications
paths:
  /communications:
    get:
      summary: List communications
      description: ''
      operationId: list-communications
      parameters:
      - name: company
        in: query
        description: Return communications for all entities associated with this company.
        schema:
          type: string
      - name: start_date
        in: query
        description: 'Return communications created on or after the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 'Return communications created on or before the provided date (format: YYYY-MM-DD)'
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: Return communications for this communication type (`email` or `text`)
        schema:
          type: string
      - name: recipient
        in: query
        description: Return communications for this recipient.
        schema:
          type: string
      - name: recipient_type
        in: query
        description: Return communications for this recipient type (`company_email`, `employee_email`, `contractor_email`)
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"id\": \"cmn_MrFrw0F82NSJjyw10Erk\",\n      \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n      \"recipient_type\": \"company_email\",\n      \"recipient\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n      \"type\": \"email\",\n      \"originator\": \"check\",\n      \"email\": {\n        \"to\": [\n          \"example@gmail.com\"\n        ],\n        \"from\": \"support@checkhq.zendesk.com\",\n        \"cc\": [\n          \"payroll-support@partner.co\"\n        ],\n        \"subject\": \"Check <> Example Coffee\",\n        \"noreply\": false\n      },\n      \"notification\": {\n        \"id\": null,\n        \"topic\": null\n      },\n      \"created_at\": \"2024-01-19 17:04:15+00\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: cmn_MrFrw0F82NSJjyw10Erk
                        company:
                          type: string
                          example: com_zH8Gq33iBkFj5o0GKjTw
                        recipient_type:
                          type: string
                          example: company_email
                        recipient:
                          type: string
                          example: com_zH8Gq33iBkFj5o0GKjTw
                        type:
                          type: string
                          example: email
                        originator:
                          type: string
                          example: check
                        email:
                          type: object
                          properties:
                            to:
                              type: array
                              items:
                                type: string
                                example: example@gmail.com
                            from:
                              type: string
                              example: support@checkhq.zendesk.com
                            cc:
                              type: array
                              items:
                                type: string
                                example: payroll-support@partner.co
                            subject:
                              type: string
                              example: Check <> Example Coffee
                            noreply:
                              type: boolean
                              example: false
                              default: true
                        notification:
                          type: object
                          properties:
                            id: {}
                            topic: {}
                        created_at:
                          type: string
                          example: '2024-01-19 17:04:15+00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Communications
  /communications/{communication}:
    get:
      summary: Get a communication
      description: ''
      operationId: get-a-communication
      parameters:
      - name: communication
        in: path
        description: ID of the communication to return
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"cmn_MrFrw0F82NSJjyw10Erk\",\n  \"company\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"recipient_type\": \"company_email\",\n  \"recipient\": \"com_zH8Gq33iBkFj5o0GKjTw\",\n  \"type\": \"email\",\n  \"originator\": \"check\",\n  \"email\": {\n    \"to\": [\n      \"example@gmail.com\"\n    ],\n    \"from\": \"support@checkhq.zendesk.com\",\n    \"cc\": [\n      \"payroll-support@partner.co\"\n    ],\n    \"subject\": \"Check <> Example Coffee\",\n    \"noreply\": false\n  },\n  \"notification\": {\n    \"id\": null,\n    \"topic\": null\n  },\n  \"created_at\": \"2024-01-19 17:04:15+00\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: cmn_MrFrw0F82NSJjyw10Erk
                  company:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  recipient_type:
                    type: string
                    example: company_email
                  recipient:
                    type: string
                    example: com_zH8Gq33iBkFj5o0GKjTw
                  type:
                    type: string
                    example: email
                  originator:
                    type: string
                    example: check
                  email:
                    type: object
                    properties:
                      to:
                        type: array
                        items:
                          type: string
                          example: example@gmail.com
                      from:
                        type: string
                        example: support@checkhq.zendesk.com
                      cc:
                        type: array
                        items:
                          type: string
                          example: payroll-support@partner.co
                      subject:
                        type: string
                        example: Check <> Example Coffee
                      noreply:
                        type: boolean
                        example: false
                        default: true
                  notification:
                    type: object
                    properties:
                      id: {}
                      topic: {}
                  created_at:
                    type: string
                    example: '2024-01-19 17:04:15+00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Communications
