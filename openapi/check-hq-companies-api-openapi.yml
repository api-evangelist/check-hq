  /companies/{company}/reports/payroll_journal:
    get:
      summary: Get payroll journal
      description: Returns the specified payroll journal.
      operationId: get-payroll-journal
      parameters:
      - name: company
        in: path
        description: ID of the company with the payroll journal to return
        schema:
          type: string
        required: true
      - name: start
        in: query
        description: Return payrolls with a payday on or after this date.
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: Return payrolls with a payday before or on this date.
        schema:
          type: string
          format: date
      - name: Accept
        in: header
        description: Either `application/json` or `text/csv`
        schema:
          type: string
      - name: payroll
        in: query
        description: 'Return the payroll with this ID. To specify multiple payrolls, repeat this query parameter. (For example: "&payroll=pay_123&payroll=pay_456&...")'
        schema:
          type: string
      - name: include_taxable_wages
        in: query
        description: Return payrolls with taxable wages.
        schema:
          type: boolean
          default: false
      - in: query
        name: include_gross_taxable_wages
        schema:
          type: boolean
          default: 'false'
        description: Return payrolls with gross taxable wages (wages subject to a tax before pre-tax deductions, irrespective of wage base).
      - name: include_employee_id
        in: query
        description: Return employees with their ID.
        schema:
          type: boolean
          default: false
      - name: include_contractors
        in: query
        description: Return payments made to contractors on payrolls
        schema:
          type: boolean
          default: false
      - name: include_contractor_id
        in: query
        description: Return contractors with their ID.
        schema:
          type: boolean
          default: false
      - name: group_by
        in: query
        description: Determines how to breakdown pay. If `workplace` is provided, employees will have one line item per payroll and workplace combination.
        schema:
          type: string
          enum:
          - workplace
