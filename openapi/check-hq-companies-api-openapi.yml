    post:
      summary: Company Tax Setup
      description: This Component allows employers to configure their federal and state tax setup based on the company’s location.Learn how to embed Components in our guide.
      operationId: company-tax-setup
      parameters:
      - name: company
        in: path
        description: ID of the company for which a component link will be generated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - signer_name
              - signer_title
              - email
              properties:
                signer_name:
                  type: string
                  description: The name of the person who has permission to onboard on behalf of the company.
                signer_title:
                  type: string
                  description: The title of the person who has permission to onboard on behalf of the company (e.g. "Officer", "Manager", etc.).
