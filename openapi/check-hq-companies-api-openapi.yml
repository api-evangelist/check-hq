                expected_first_payday:
                  type: string
                  description: The company's expected first payday on Check
                  default: 'null'
                  format: date
                approved_for_payment_processing:
                  type: boolean
                  description: Whether or not the company has been approved for payment processing on the partner's platform
                  default: false
                existing_payroll_customer_processing_period:
                  type: string
                  description: If business is already running payroll with you, the processing period they are currently using. One of `null`, `four_day`, `two_day`, or `one_day`.
                  default: 'null'
                average_monthly_revenue:
                  type: number
                  description: The average monthly revenue of the company
                  default: null
                  format: float
                earliest_known_revenue:
                  type: string
                  description: The earliest known date that the company generated revenue
                  default: 'null'
                  format: date
                months_on_previous_payroll_provider:
                  type: integer
                  description: The number of months that the company used their previous payroll provider
                  default: null
                  format: int32
                social_media:
                  type: array
                  description: Any social media account URLs associated with the company
                  default:
                  - '[]'
                  items:
                    type: string
                products_actively_used:
                  type: array
                  description: A list of the products offered by the partner's platform used by the associated company. Values must be one of `timetracking`, `payments`, or `scheduling`.
                  default:
                  - '[]'
                  items:
                    type: string
                account_contacts:
                  type: array
                  description: A list of partner employee emails associated with the company
                  default:
                  - '[]'
                  items:
                    type: string
                fraud_score:
                  type: number
                  description: A value between 0 and 100 representing the fraud risk presented by the company
                  default: null
                  format: float
                predicted_fraud:
                  type: boolean
                  description: Whether the fraud score was over the expected threshold for fraud (the company is predicted to be fraudulent)
                  default: false
                paying_user:
                  type: boolean
                  description: Whether the company pays the partner for services
                  default: false
                missed_payments_count:
                  type: integer
                  description: The number of times that the company has failed to pay the partner
                  default: null
                  format: int32
                payroll_history_access_method:
                  type: string
                  description: The mechanism by which Check Implementation Services will be able to access and migrate payroll history
                  enum:
                  - '"authorized_access_to_previous_provider"'
                  - '"provided_credentials"'
                  - '"provided_reports"'
                implementation_services_submission_comment:
                  type: string
                  description: Optional comment for including additional context when submitting a company for Implementation Services
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"company\": \"com_097YZQgrXZQb8VHtI76S\",\n    \"employee_count\": 10,\n    \"contractor_count\": 0,\n    \"pay_period_amount\": \"1000.50\",\n    \"previous_payroll_provider\": \"gusto\",\n    \"first_payroll_of_year\": true,\n    \"user_since\": \"2020-05-05\",\n    \"expected_first_payday\": \"2023-01-01\",\n    \"approved_for_payment_processing\": true,\n    \"existing_payroll_customer_processing_period\": null,\n    \"average_monthly_revenue\": \"30005.27\",\n    \"earliest_known_revenue\": \"2022-08-22\",\n    \"months_on_previous_payroll_provider\": 12,\n    \"social_media\":  [\"https://twitter.com/check_hq\"],\n    \"products_actively_used\": [\"payments\", \"timetracking\"],\n    \"account_contacts\": [\"person@partner.com\"],\n    \"fraud_score\": \"21.03\",\n    \"predicted_fraud\": false,\n    \"paying_user\": true,\n    \"missed_payments_count\": 0   \n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Companies
  /companies/{company}/funding_strikes:
    get:
      description: Returns a list of active funding failure strikes for a company. Strikes represent funding failure offenses that factor into Check's processing period demotion and termination decisions.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                  previous:
                    type: string
                  results:
                    type: array
                    items:
                      properties:
                        created_at:
                          type: string
                      type: object
              examples:
                OK:
                  summary: OK
                  value:
                    next: null
                    previous: null
                    results:
                    - created_at: '2026-05-10T14:32:00Z'
                    - created_at: '2026-04-22T09:15:00Z'
                    - created_at: '2026-03-08T17:45:00Z'
                    - created_at: '2026-01-15T11:20:00Z'
      parameters:
      - in: path
        name: company
        schema:
          type: string
        required: true
        description: The ID of the company (e.g. com_xxxx)
      operationId: get_companies-company-funding-strikes
      summary: List active funding strikes
      tags:
      - Companies
  /companies/{company}/onboard:
    post:
      summary: Company Onboard
      description: Generates a link to Onboard a Company. Onboard links can also be embedded like Components. Check out our guide on how to embed them into your app.
      operationId: generate-onboard-link
      parameters:
      - name: company
        in: path
        description: ID of the company for which an onboard link will be generated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - signer_name
              - signer_title
              - email
              properties:
                signer_name:
                  type: string
                  description: The name of the person who has permission to onboard on behalf of the company.
                signer_title:
                  type: string
                  description: The title of the person who has permission to onboard on behalf of the company (e.g. "Officer", "Manager", etc.).
                email:
                  type: string
                  description: The email of the person who has permission to onboard on behalf of the company
                signatory:
                  type: string
                  description: The ID of the signatory object for this company. You may use either a signatory ID or the three body params above
                field_permissions:
                  type: object
                  description: 'Locks company fields in the Component or Onboard flow that this link opens. Each key names a field, and each value sets its access level: `read` shows the field without letting the user edit it, and `read_write` is the default. An unknown key or level returns a 400. Keys that this Component doesn''t render are accepted and ignored, so you can send the same map on every link. Check Components enforces the lock in its UI only. The API still accepts writes to a locked field. See [Locking company fields](https://docs.checkhq.com/docs/locking-company-fields).'
                  properties:
                    company:legal_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal name.
                    company:trade_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's trade name.
                    company:address:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal address. Workplace addresses aren't affected.
                    company:phone:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's phone number.
                    company_tax_param:federal_ein:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's federal EIN in tax setup.
                  additionalProperties: false
                  example:
                    company:legal_name: read
                    company:trade_name: read
                    company:address: read
                    company:phone: read
                    company_tax_param:federal_ein: read
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url":"{one_time_onboard_link}"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: '{one_time_onboard_link}'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Companies
  /companies/{company}/paydays:
    get:
      summary: Get company paydays
      description: Returns a list of paydays and their corresponding `approval_deadline` specific to the processing period of the specified company. Results span one year of dates. If the `approval_deadline` was impacted by a bank holiday, then `impacted_by_holiday` will be true, otherwise false.
