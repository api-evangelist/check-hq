  /companies/{company}/components/filing_authorization:
    post:
      summary: Company Filing Authorization
      description: 'This Component allows employers to view, sign, and submit forms relevant to their onboarding.


        These forms include:


        IRS Form 8655


        Any state form required for Check to file and pay taxes on the employer''s behalf


        Learn how to embed Components in our guide.'
      operationId: company-filing-authorization
      parameters:
      - name: company
        in: path
        description: ID of the company for which a component link will be generated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - signer_name
              - signer_title
              - email
              properties:
                signer_name:
                  type: string
                  description: The name of the person who has permission to onboard on behalf of the company.
                signer_title:
                  type: string
                  description: The title of the person who has permission to onboard on behalf of the company (e.g. "Officer", "Manager", etc.).
                email:
                  type: string
                  description: The email of the person who has permission to onboard on behalf of the company
                signatory:
                  type: string
                  description: The ID of the signatory object for this company. You may use either a signatory ID or the three signatory body params above
                jurisdiction:
                  type: string
                  description: Only list forms of the given jurisdiction. Use the last 2 letters of the ISO 3166-2:US code for the jurisdiction.
                federal_only:
                  type: boolean
                  description: Only show Federal forms if True.
                  default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url":"{component_url}"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: '{component_url}'
        '400':
          description: '400'
          content:
