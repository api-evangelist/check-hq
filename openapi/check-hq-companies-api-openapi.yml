openapi: 3.2.0
info:
  title: check-api Companies API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Companies
paths:
  /companies:
    get:
      summary: List companies
      description: Returns a list of all companies.
      operationId: list-companies
      parameters:
      - name: active
        in: query
        description: Filter companies by whether they are active or not active.
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        description: Number of companies returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/MetadataListFilter'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Companies
  /companies/{company_id}/credit_limit_usages?:
    get:
      description: Returns current credit limit usage, configured limits, and remaining capacity for a company within the active weekly window.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    type: string
                    description: The company ID this usage record belongs to.
                  type:
                    type: string
                    description: 'The type of credit limit. One of: company, employee, or contractor. (Company limits are currently the only form of credit limits in function, so this will be returned by default.)'
                    default: company
                  window:
                    type: object
                    description: The time window the usage applies to.
                    properties:
                      window.start:
                        type: string
                        description: Start of the current weekly credit limit window (ISO 8601).
                      window.end:
                        type: string
                        description: End of the current weekly credit limit window (ISO 8601).
                  usage:
                    type: string
                    description: Current total cash requirement exposure for accelerated-ACH payrolls within the current weekly window.
                  limit:
                    type: string
                    description: The configured weekly credit limit. null if credit limits are not enabled for this entity.
                  remaining:
                    type: string
                    description: Remaining credit available (limit minus usage). null if credit limits are not enabled.
                required:
                - company
                - type
                - window
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
        required: true
        description: The unique identifier of the company
      - in: query
        name: type
        schema:
          type: string
        description: 'Filter by credit limit type. Accepted values: company, employee, contractor. Can be repeated to include multiple types (e.g., ?type=company&type=employee). If omitted, returns all applicable types.'
      operationId: get_companies-company-id-credit-limit-usages
      summary: Credit Limits
      tags:
      - Companies
  /companies/{company_id}/request_embedded_setup:
    post:
      summary: Request Embedded Setup
      description: Request that Check manage setting up all of a Company's data necessary to begin running payroll.
      operationId: request-embedded-setup
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": {\n        \"type\": \"validation_error\",\n        \"message\": \"Please correct the required fields and try again.\",\n        \"input_errors\": [\n            {\n                \"message\": \"Company has not agreed to Terms of Service\"\n            }\n        ]\n    }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Please correct the required fields and try again.
                      input_errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                              example: Company has not agreed to Terms of Service
      deprecated: false
      tags:
      - Companies
  /companies/{company}:
    patch:
      summary: Update a company
      description: Updates the specified company.
      operationId: update-a-company
      parameters:
      - name: company
        in: path
        description: ID of the company to update
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  type: string
                  description: Legal name of the company
                trade_name:
                  type: string
                  description: Trade name of the company
                other_business_name:
                  type: string
                  description: Other business name used by the company.
                business_type:
                  type: string
                  description: Business type of the company. One of `sole_proprietorship`, `partnership`, `c_corporation`, `s_corporation`, or `llc`.
                industry_type:
                  type: string
                  description: Industry type of the company. One of `auto_or_machine_sales`, `auto_or_machine_repair`, `arts_or_entertainment_or_recreation`, `cleaning_services`, `consulting_services`, `educational_services`, `family_care_services`, `financial_services`, `food_and_beverage_retail_or_wholesale`, `general_construction_or_general_contracting`, `health_care`, `hospitality_or_accommodation`, `hvac_or_plumbing_or_electrical_contracting`, `legal_services`, `non_food_retail_or_wholesale`, `other`, `personal_care_services`, `real_estate`, `restaurant`, `scientific_or_technical_services`, `security_services`, `tobacco_or_alcohol_sales`, or `transportation`.
                website:
                  type: string
                  description: Website URL of the company.
                email:
                  type: string
                  description: Email address of payroll department or payroll administrator
                phone:
                  type: string
                  description: Phone number for the company
                address:
                  type: object
                  description: Legal address of company on file with the federal government
                  required:
                  - line1
                  - city
                  - state
                  - postal_code
                  properties:
                    line1:
                      type: string
                      description: Street address or PO Box
                    line2:
                      type: string
                      description: Apartment, suite, unit, or building
                    city:
                      type: string
                      description: City, district, suburb, town, or village
                    state:
                      type: string
                      description: 2-digit state code
                    postal_code:
                      type: string
                      description: 5-digit postal code or zip code
                    country:
                      type: string
                      description: Read only.
                      default: US
                principal_place_of_business:
                  type: string
                  description: Company's workplace ID whose address would be printed on paystub, instead of legal address.
                pay_frequency:
                  type: string
                  description: Frequency by which the employees get paid. One of "weekly", "biweekly", "semimonthly", "monthly", "quarterly", or "annually"
                processing_period:
                  type: string
                  description: The default processing period of payrolls. <br><br>One of `three_day`, `two_day`, or `one_day`.<br><br>The processing period determines the approval deadline of the payroll. For a payroll with a Friday payday, `three_day` will mean the approval deadline is on Tuesday, whereas `two_day` will mean the approval deadline is on Wednesday.<br><br>The possible values for this field are constrained by the processing periods the company is approved for.
                start_date:
                  type: string
                  description: Date the company will start using Check as their payroll processor
                  format: date
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the company
                  format: json
                default_bank_account:
                  type: string
                  description: ID of the default [bank account](https://docs.checkhq.com/reference/the-bank-account-object) of the company.<br><br>The default bank account is used for employer tax collections and refunds, as well as to fund payrolls unless the user explicitly sets the `bank_account` argument when creating or updating a payroll.<br><br>The default bank account can be updated to be any one of the company's active bank accounts.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Companies
  /companies/{company}/components/business_details:
    post:
      summary: Company Business Details Component
      description: This Component allows an employer to provide Check with core details about their business.
      operationId: company-business-details
      parameters:
      - name: company
        in: path
        description: ID of the company for which a component link will be generated
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - signatory
              properties:
                signatory:
                  type: string
                  description: The ID of the signatory object for this company. You must provide either a signatory ID (recommended) or all three body params shown below
                signer_name:
                  type: string
                  description: The name of the person who has permission to onboard on behalf of the company.
                signer_title:
                  type: string
                  description: The title of the person who has permission to onboard on behalf of the company (e.g. "Officer", "Manager", etc.).
                email:
                  type: string
                  description: The email of the person who has permission to onboard on behalf of the company
                field_permissions:
                  type: object
                  description: 'Locks company fields in the Component or Onboard flow that this link opens. Each key names a field, and each value sets its access level: `read` shows the field without letting the user edit it, and `read_write` is the default. An unknown key or level returns a 400. Keys that this Component doesn''t render are accepted and ignored, so you can send the same map on every link. Check Components enforces the lock in its UI only. The API still accepts writes to a locked field. See [Locking company fields](https://docs.checkhq.com/docs/locking-company-fields).'
                  properties:
                    company:legal_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal name.
                    company:trade_name:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's trade name.
                    company:address:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's legal address. Workplace addresses aren't affected.
                    company:phone:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's phone number.
                    company_tax_param:federal_ein:
                      type: string
                      enum:
                      - read
                      - read_write
                      default: read_write
                      description: Access level for the company's federal EIN in tax setup.
                  additionalProperties: false
                  example:
                    company:legal_name: read
                    company:trade_name: read
                    company:address: read
                    company:phone: read
                    company_tax_param:federal_ein: read
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url":"{component_url}"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: '{component_url}'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Companies
