  /employees/{employee}/reveal:
    get:
      summary: Reveal employee SSN
      description: Reveal unmasked SSN. Reach out to Check to get support for this feature.
      operationId: reveal-employee-ssn
      parameters:
      - name: employee
        in: path
        description: The ID of the employee whose SSN you want to reveal
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"emp_1ATPRmtf6XBdR6jDa9M5\",\n    \"first_name\": \"Bob\",\n    \"last_name\": \"Jones\",\n    \"middle_name\": null,\n    \"email\": null,\n    \"dob\": \"1970-05-29\",\n    \"bank_accounts\": [],\n    \"ssn\": \"123456789\", // new SSN field in this response only\n    \"ssn_last_four\": \"6789\",\n    \"ssn_validation_status\": \"invalid\",\n    \"onboard\": {\n        \"status\": \"needs_attention\",\n        \"blocking_steps\": [],\n        \"remaining_steps\": [\n            \"withholdings\",\n            \"payment_method\"\n        ],\n        \"payment_method\": [\n            \"payment_method_preference_set\",\n            \"bank_account_exists\",\n            \"bank_account_verified\"\n        ],\n        \"withholdings\": [\n            {\n                \"id\": \"jur_KVWAwwuRWhlJoKGuO8sg\",\n                \"name\": \"California\",\n                \"status\": \"needs_attention\"\n            },\n            {\n                \"id\": \"jur_BnW2zftTxDX3xB1VEL1e\",\n                \"name\": \"Federal\",\n                \"status\": \"needs_attention\"\n            }\n        ]\n    },\n    \"payment_method_preference\": null,\n    \"company\": \"com_dsE2Y4wCMg77HGlJB0Mk\",\n    \"workplaces\": [\n        \"wrk_164u8lrvjkdjdssiidd9\"\n    ],\n    \"primary_workplace\": \"wrk_164u8lrvjkdjdssiidd9\",\n    \"start_date\": \"2019-03-01\",\n    \"termination_date\": null,\n    \"active\": true,\n    \"residence\": {\n        \"line1\": \"630 Bedford Road\",\n        \"line2\": null,\n        \"city\": \"Tarrytown\",\n        \"state\": \"NY\",\n        \"postal_code\": \"10591\",\n        \"country\": \"US\"\n    },\n    \"w2_electronic_consent_provided\": false,\n    \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: emp_1ATPRmtf6XBdR6jDa9M5
                  first_name:
                    type: string
                    example: Bob
                  last_name:
                    type: string
                    example: Jones
                  middle_name: {}
                  email: {}
                  dob:
                    type: string
                    example: '1970-05-29'
                  bank_accounts:
