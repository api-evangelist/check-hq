                                country:
                                  type: string
                                  example: US
                            ssn_last_four: {}
                        earnings:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                example: hourly
                              code: {}
                              earning_code: {}
                              amount:
                                type: string
                                example: '300.00'
                              amount_ytd:
                                type: string
