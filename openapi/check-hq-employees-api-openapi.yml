                      payment_method:
                        type: array
                        items:
                          type: string
                          example: payment_method_preference_set
                      withholdings:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: jur_KVWAwwuRWhlJoKGuO8sg
