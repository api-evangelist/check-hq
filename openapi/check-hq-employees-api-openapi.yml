openapi: 3.2.0
info:
  title: check-api Employees API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Employees
paths:
  /employees:
    get:
      summary: List employees
      description: Returns a list of all employees. Employees will be returned from the list endpoint in alphabetical order, sorted by last name, first name.
      operationId: list-employees
      parameters:
      - name: company
        in: query
        description: Return employees for this company ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of employees returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
          default: 25
      - name: workplace
        in: query
        description: Return employees who work at these workplaces (can be comma-separated list of workplace IDs)
        schema:
          type: string
      - name: active
        in: query
        description: Include employees only with a certain active status
        schema:
          type: boolean
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/MetadataListFilter'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n\t{\n    \"id\": \"emp_zGGp6wYcxAeu1Ng8IA7v\",\n    \"first_name\": \"Tony\",\n    \"last_name\": \"Stark\",\n    \"middle_name\": null,\n    \"email\": \"tony@starkindustries.com\",\n    \"dob\": \"1970-05-29\",\n    \"bank_accounts\": [],\n    \"ssn_last_four\": null,\n    \"payment_method_preference\": null,\n    \"active\": true,\n    \"onboard\": {\n        \"status\": \"blocking\",\n        \"blocking_steps\": [\n            \"ssn\"\n        ],\n        \"remaining_steps\": [\n            \"ssn\",\n            \"payment_method\"\n            \"withholdings\",\n        ],\n        \"ssn\": [\n            \"ssn_submitted\",\n        ],\n        \"payment_method\": [\n            \"payment_method_preference_set\",\n            \"bank_account_exists\",\n            \"bank_account_verified\",\n        ],\n        \"withholdings\": [\n            {\n                \"id\": \"jur_kSO0VneVfdx5TDDQ9Xnp\",\n                \"name\": \"Federal\",  \n            },\n            {\n                \"id\": \"jur_CUlTApePRnDFn9bPVCQE\",\n                \"name\": \"New York\",  \n            },  \n        ],\n    },\n    \"workplaces\": [\n        \"wrk_i8nfu8234r8dkjhzlsdv\"\n    ],\n    \"company\": \"com_sx3svU6K8c5ZkSFlOh5p\",\n    \"start_date\": \"2019-03-01\",\n    \"default_net_pay_split\": \"nps_lk218jk9082mjkjljT1c\",\n    \"residence\": {\n        \"line1\": \"630 Bedford Road\",\n        \"line2\": null,\n        \"city\": \"Tarrytown\",\n        \"state\": \"NY\",\n        \"postal_code\": \"10591\",\n        \"country\": \"US\"\n    },\n    \"w2_electronic_consent_provided\": false,\n    \"metadata\": {}\n\t}\n]"
      deprecated: false
      tags:
      - Employees
  /employees/{employee}/components/tax_setup:
    post:
      summary: Employee Tax Setup Component
      description: This Component allows an employer admin to provide information about a specific employee's tax profile
      operationId: employee-tax-setup
      parameters:
      - name: employee
        in: path
        description: ID of the employee for which a component link will be generated
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url":"{component_url}"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: '{component_url}'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employees
  /employees/{employee}/components/withholdings_setup:
    post:
      summary: Employee Withholdings Setup
      description: 'This Component allows an employee to complete and sign state and federal withholding forms (i.e. W-4).


        Learn how to embed Components in our guide.'
      operationId: employee-withholdings-setup
      parameters:
      - name: employee
        in: path
        description: ID of the employee for which a component link will be generated
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"url":"{component_url}"}'
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: '{component_url}'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Employees
  /employees/{employee}/paystubs:
    get:
      summary: List employee paystubs
      description: Returns a list of paystubs for the specified employee.
      operationId: get-an-employees-paystubs
      parameters:
      - name: employee
        in: path
        description: Return paystubs for this employee ID
        schema:
          type: string
        required: true
      - name: payroll
        in: query
        description: Return the paystub for this payroll ID.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of paystubs returned per page. The maximum value is 100.
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Filters to only show paystubs for payrolls with the specified status.  If multiple `status` params are provided, paystubs with any of the statuses will be returned.  Accepted values are `pending`, `processing`, `failed`, or `paid`.
        schema:
          type: string
      - name: start
        in: query
        description: Return paystubs from payrolls with a payday on or after this date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end
        in: query
        description: Return paystubs from payrolls with a payday on or before this date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - in: query
        name: type
        schema:
          type: string
        description: Returns paystubs from payrolls with a specific type. Accepted values are `regular` (the default), `balancing`, and `amendment`.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"next\": null,\n  \"previous\": null,\n  \"results\": [\n    {\n      \"payroll\": \"pay_xUNanwDkP1o8TE6qC77L\",\n      \"payday\": \"2021-04-26\",\n      \"period_start\": \"2021-03-20\",\n      \"period_end\": \"2021-04-02\",\n      \"company\": {\n        \"trade_name\": null,\n        \"legal_name\": \"Stark Industries\",\n        \"address\": {\n          \"line1\": \"4954 Berkeley Run Crossing\",\n          \"line2\": null,\n          \"city\": \"Norcross\",\n          \"state\": \"GA\",\n          \"postal_code\": \"30092\",\n          \"country\": \"US\"\n        },\n        \"phone\": \"2067138013\"\n      },\n      \"void_of\": null,\n      \"voided_by\": null,\n      \"employee\": {\n        \"first_name\": \"Tony\",\n        \"middle_name\": null,\n        \"last_name\": \"Stark\",\n        \"residence\": {\n          \"line1\": \"4954 Berkeley Run Crossing\",\n          \"line2\": null,\n          \"city\": \"Norcross\",\n          \"state\": \"GA\",\n          \"postal_code\": \"30092\",\n          \"country\": \"US\"\n        },\n        \"ssn_last_four\": null\n      },\n      \"earnings\": [\n        {\n          \"type\": \"hourly\",\n          \"code\": null,\n          \"earning_code\": null,\n          \"amount\": \"300.00\",\n          \"amount_ytd\": \"300.00\",\n          \"hours\": 40.0,\n          \"hours_ytd\": 40.0,\n          \"name\": \"Hourly (Regular)\",\n          \"current_earnings\": [\n            {\n              \"description\": \"Work on day 1\",\n              \"amount\": \"300.00\",\n              \"hours\": 40.0,\n              \"workplace\": \"wrk_mhHjtmJh6TBSuhTXpMcp\",\n              \"rate\": \"7.500\"\n            }\n          ]\n        },\n        {\n          \"type\": \"bonus\",\n          \"code\": null,\n          \"earning_code\": null,\n          \"amount\": \"100.00\",\n          \"amount_ytd\": \"100.00\",\n          \"hours\": null,\n          \"hours_ytd\": null,\n          \"name\": \"Bonus\",\n          \"current_earnings\": [\n            {\n              \"description\": \"Work on day 2\",\n              \"amount\": \"100.00\",\n              \"hours\": null,\n              \"workplace\": \"wrk_mhHjtmJh6TBSuhTXpMcp\",\n              \"rate\": null\n            }\n          ]\n        }\n      ],\n      \"reimbursements\": [\n        \n      ],\n      \"employee_taxes\": [\n        {\n          \"amount\": \"24.80\",\n          \"amount_ytd\": \"24.80\",\n          \"description\": \"FICA\"\n        },\n        {\n          \"amount\": \"27.87\",\n          \"amount_ytd\": \"27.87\",\n          \"description\": \"Federal Income Tax\"\n        },\n        {\n          \"amount\": \"5.80\",\n          \"amount_ytd\": \"5.80\",\n          \"description\": \"Medicare\"\n        },\n        {\n          \"amount\": \"10.85\",\n          \"amount_ytd\": \"10.85\",\n          \"description\": \"Georgia State Tax\"\n        }\n      ],\n      \"company_taxes\": [\n        {\n          \"amount\": \"24.80\",\n          \"amount_ytd\": \"24.80\",\n          \"description\": \"Employer FICA Tax\"\n        },\n        {\n          \"amount\": \"2.40\",\n          \"amount_ytd\": \"2.40\",\n          \"description\": \"Federal Unemployment Tax\"\n        },\n        {\n          \"amount\": \"5.80\",\n          \"amount_ytd\": \"5.80\",\n          \"description\": \"Employer Medicare Tax\"\n        },\n        {\n          \"amount\": \"10.80\",\n          \"amount_ytd\": \"10.80\",\n          \"description\": \"Georgia State Unemployment Tax\"\n        },\n        {\n          \"amount\": \"0.24\",\n          \"amount_ytd\": \"0.24\",\n          \"description\": \"Georgia Administrative Assessment Tax\"\n        }\n      ],\n      \"employee_benefit_contributions\": [\n        \n      ],\n      \"company_benefit_contributions\": [\n        \n      ],\n      \"post_tax_deductions\": [\n        \n      ],\n      \"summary\": {\n        \"earnings\": \"400.00\",\n        \"earnings_ytd\": \"400.00\",\n        \"reimbursements\": \"0.00\",\n        \"reimbursements_ytd\": \"0.00\",\n        \"employee_taxes\": \"69.32\",\n        \"employee_taxes_ytd\": \"69.32\",\n        \"company_taxes\": \"44.04\",\n        \"company_taxes_ytd\": \"44.04\",\n        \"employee_benefit_contributions\": \"0.00\",\n        \"employee_benefit_contributions_ytd\": \"0.00\",\n        \"company_benefit_contributions\": \"0.00\",\n        \"company_benefit_contributions_ytd\": \"0.00\",\n        \"post_tax_deductions\": \"0.00\",\n        \"post_tax_deductions_ytd\": \"0.00\",\n        \"net_pay\": \"330.68\",\n        \"net_pay_ytd\": \"330.68\"\n      },\n      \"time_off_balances\": {\n        \"pto_balance_hours\": null,\n        \"sick_balance_hours\": null,\n        \"state_covid_sick_balance_hours\": null\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  next: {}
                  previous: {}
                  results:
                    type: array
                    items:
                      type: object
