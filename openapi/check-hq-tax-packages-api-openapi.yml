openapi: 3.2.0
info:
  title: check-api Tax Packages API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Tax Packages
paths:
  /tax_packages:
    post:
      summary: Request a tax package
      description: ''
      operationId: request-a-tax-package
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                  description: ID of the company
                contents:
                  type: string
                  description: JSON object of `employee_tax_statements` and `filings` IDs to generate
                  format: json
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"tax_pkg_abc123\",\n  \"company\": \"com_789\",\n  \"status\": \"generating\",\n  \"contents\": {\n    \"employee_tax_statements\": [\"ets_123\", \"ets_456\"],\n    \"filings\": [\"com_fil_999\"]\n  },\n  \"result\": null,\n  \"succeeded_at\": null,\n  \"error\": null,\n  \"created_at\": \"2024-01-15T12:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: tax_pkg_abc123
                  company:
                    type: string
                    example: com_789
                  status:
                    type: string
                    example: generating
                  contents:
                    type: object
                    properties:
                      employee_tax_statements:
                        type: array
                        items:
                          type: string
                          example: ets_123
                      filings:
                        type: array
                        items:
                          type: string
                          example: com_fil_999
                  result: {}
                  succeeded_at: {}
                  error: {}
                  created_at:
                    type: string
                    example: '2024-01-15T12:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Tax Packages
  /tax_packages/{id}:
    get:
      summary: Get a tax package
      description: ''
      operationId: get-a-tax-package
      parameters:
      - name: id
        in: path
        description: ID of the tax package to get
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"tax_pkg_abc123\",\n  \"company\": \"com_789\",\n  \"status\": \"succeeded\", \n  \"contents\": {\n    \"employee_tax_statements\": [\"ets_123\", \"ets_456\"],\n    \"filings\": [\"com_fil_999\"]\n  },\n  \"result\": {\n    \"url\": \"https://api.check.com/tax_packages/tax_pkg_abc123/download/\"\n  },\n  \"succeeded_at\": \"2024-01-15T12:05:00Z\",\n  \"error\": null,\n  \"created_at\": \"2024-01-15T12:00:00Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: tax_pkg_abc123
                  company:
                    type: string
                    example: com_789
                  status:
                    type: string
                    example: succeeded
                  contents:
                    type: object
                    properties:
                      employee_tax_statements:
                        type: array
                        items:
                          type: string
                          example: ets_123
                      filings:
                        type: array
                        items:
                          type: string
                          example: com_fil_999
                  result:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://api.check.com/tax_packages/tax_pkg_abc123/download/
                  succeeded_at:
                    type: string
                    example: '2024-01-15T12:05:00Z'
                  error: {}
                  created_at:
                    type: string
                    example: '2024-01-15T12:00:00Z'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Tax Packages
  /tax_packages/{id}/download:
    get:
      summary: Download a tax package
      description: 'Returns download metadata for a succeeded tax package. By default, the response is JSON containing a short-lived download URL for the generated ZIP archive.


        Use an `Accept: application/pdf` request header to download a single employee tax statement directly as a PDF. PDF downloads are available only when the tax package contains exactly one employee tax statement and no filings.'
      operationId: download-a-tax-package
      parameters:
      - name: id
        in: path
        description: ID of the tax package to download
        schema:
          type: string
        required: true
      - name: Accept
        in: header
        description: Either `application/json` or `application/pdf`
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"download_url\": \"https://check-taxpackages.s3.amazonaws.com/tax_pkg_abc123.zip?...\",\n  \"extension\": \"zip\",\n  \"content_type\": \"application/zip\"\n}"
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    example: https://check-taxpackages.s3.amazonaws.com/tax_pkg_abc123.zip?...
                  extension:
                    type: string
                    example: zip
                  content_type:
                    type: string
                    example: application/zip
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Tax Packages
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
x-readme-fauxas: true
