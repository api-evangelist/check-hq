openapi: 3.2.0
info:
  title: check-api Net Pay Splits API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Net Pay Splits
paths:
  /net_pay_splits:
    post:
      summary: Create a net pay split
      description: 'Creates a net pay split.


        One of `employee` or `contractor` is required.'
      operationId: create-net-pay-split
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - splits
              properties:
                employee:
                  type: string
                  description: ID of the employee that the net pay split relates to.
                contractor:
                  type: string
                  description: ID of the contractor that the net pay split relates to.
                splits:
                  type: array
                  description: Prioritized list of bank accounts and the maximum amounts to be paid to each account.  The amount / percentage can be omitted for the lowest priority account.
                  items:
                    properties:
                      bank_account:
                        type: string
                      priority:
                        type: integer
                        default: 1
                        format: int32
                      amount:
                        type: string
                        default: 1000
                        description: A positive number.
                      percentage:
                        type: string
                        description: Only available on API versions `2023-04-04` and beyond
                    type: object
                is_default:
                  type: boolean
                  default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"nps_lk218jk9082mjkjljT1c\",\n  \"employee\": \"emp_zGGp6wYcxAeu1Ng8IA7v\",\n  \"contractor\": null,\n  \"deactivated_at\": null,\n  \"deactivated_reason\": null,\n  \"is_default\": true,\n  \"splits\": [\n    {\n      \"bank_account\": \"bnk_R1UMH4Jtbjek10B9TxiX\",\n      \"priority\": 1,\n      \"amount\": 100\n    },\n    {\n      \"bank_account\": \"bnk_zGGp6wYcxAeu1Ng8IA7v\",\n      \"priority\": 2,\n      \"amount\": 50\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: nps_lk218jk9082mjkjljT1c
                  employee:
                    type: string
                    example: emp_zGGp6wYcxAeu1Ng8IA7v
                  contractor: {}
                  deactivated_at: {}
                  deactivated_reason: {}
                  is_default:
                    type: boolean
                    example: true
                    default: true
                  splits:
                    type: array
                    items:
                      type: object
                      properties:
                        bank_account:
                          type: string
                          example: bnk_R1UMH4Jtbjek10B9TxiX
                        priority:
                          type: integer
                          example: 1
                          default: 0
                        amount:
                          type: integer
                          example: 100
                          default: 0
      deprecated: false
      tags:
      - Net Pay Splits
    get:
      summary: List net pay splits
      description: 'Returns a list of net pay splits.


        One of `employee` or `contractor` is required.'
      operationId: list-net-pay-splits
      parameters:
      - name: employee
        in: query
        description: ID of the employee whose net pay splits should be listed
        schema:
          type: string
      - name: contractor
        in: query
        description: ID of the contractor whose net pay split should be listed
        schema:
          type: string
      - name: limit
        in: query
        description: Number of net pay splits returned per page. The maximum value is 500.
        schema:
          type: integer
          format: int32
          default: 25
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"nps_lk218jk9082mjkjljT1c\",\n    \"employee\": \"emp_zGGp6wYcxAeu1Ng8IA7v\",\n    \"contractor\": null,\n    \"deactivated_at\": null,\n    \"deactivated_reason\": null,\n    \"is_default\": true,\n    \"splits\": [\n      {\n        \"bank_account\": \"bnk_R1UMH4Jtbjek10B9TxiX\",\n        \"priority\": 1,\n        \"amount\": 100\n      },\n      {\n        \"bank_account\": \"bnk_zGGp6wYcxAeu1Ng8IA7v\",\n        \"priority\": 2,\n        \"amount\": 50\n      }\n    ]\n  },\n  {\n    \"id\": \"nps_jafh3ASFJ34480sos\",\n    \"employee\": \"emp_zGGp6wYcxAeu1Ng8IA7v\",\n    \"contractor\": null,\n    \"deactivated_at\": null,\n    \"deactivated_reason\": null,\n    \"is_default\": false,\n    \"splits\": [\n      {\n        \"bank_account\": \"bnk_R1UMH4Jtbjek10B9TxiX\",\n        \"priority\": 1,\n        \"amount\": 100\n      },\n      {\n        \"bank_account\": \"bnk_zGGp6wYcxAeu1Ng8IA7v\",\n        \"priority\": 2,\n        \"amount\": 50\n      }\n    ]\n\t}\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: nps_lk218jk9082mjkjljT1c
                    employee:
                      type: string
                      example: emp_zGGp6wYcxAeu1Ng8IA7v
                    contractor: {}
                    deactivated_at: {}
                    deactivated_reason: {}
                    is_default:
                      type: boolean
                      example: true
                      default: true
                    splits:
                      type: array
                      items:
                        type: object
                        properties:
                          bank_account:
                            type: string
                            example: bnk_R1UMH4Jtbjek10B9TxiX
                          priority:
                            type: integer
                            example: 1
                            default: 0
                          amount:
                            type: integer
                            example: 100
                            default: 0
      deprecated: false
      tags:
      - Net Pay Splits
