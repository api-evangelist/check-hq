  /filings/{filing_id}/add_blockers:
    post:
      summary: Add filing blockers
      description: Add one or more blockers to a filing and return the updated filing. Blockers can only be added to filings in `blocked` or `pending` status. In production, partners can add only the `held_by_customer` blocker. In Sandbox, `filed_by_customer`, `customer_filing_required`, `invalid_ssn`, `inactive_account`, and `fein_tax_id_mismatch` are also accepted.
      operationId: add-filing-blockers
      parameters:
      - name: filing_id
        in: path
        description: ID of the company filing
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - blockers
              properties:
                blockers:
                  type: array
                  description: List of blocker IDs to add to the filing. In production, only `held_by_customer` is supported. In Sandbox, `filed_by_customer`, `customer_filing_required`, `invalid_ssn`, `inactive_account`, and `fein_tax_id_mismatch` are also accepted.
                  items:
                    type: string
                    example: held_by_customer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: com_fil_AaeJoEAzbqqc2D9GMr3R
                    company: com_vIFHhvyGN47ej1upyIT8
                    year: 2025
                    period: q1
                    label: Federal Quarterly Filing - Q1
                    jurisdiction: fed
                    agency: agc_ukjABgbD0hQ3dfBRyMPD
                    due_at: '2025-04-30'
                    filed_at: null
                    closed_at: '2025-04-25T00:00:00.000Z'
                    document: null
                    filing_attempts: 0
                    amends: null
                    amended_by: null
                    status: blocked
                    status_history:
                    - status: pending
                      status_at: '2025-04-01T10:00:00.000Z'
                      blocked_reasons: []
                    - status: blocked
                      status_at: '2025-04-20T15:30:00.000Z'
                      blocked_reasons:
                      - type: held_by_customer
                        resource_type: null
                        resource: null
                        note: null
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: com_fil_AaeJoEAzbqqc2D9GMr3R
                  company:
                    type: string
                    example: com_vIFHhvyGN47ej1upyIT8
                  year:
                    type: integer
                    example: 2025
                    default: 0
                  period:
                    type: string
                    example: q1
                  label:
                    type: string
                    example: Federal Quarterly Filing - Q1
                  jurisdiction:
                    type: string
                    nullable: true
                    example: fed
                    description: Lowercase region code for the filing (`fed` or lowercased ISO 3166-2:US region code).
                  agency:
                    type: string
                    nullable: true
                    example: agc_ukjABgbD0hQ3dfBRyMPD
                    description: ID of the Agency that receives this filing.
                  due_at:
                    type: string
                    example: '2025-04-30'
                  filed_at:
                    type: string
                    nullable: true
                    example: null
                  closed_at:
                    type: string
                    nullable: true
                    example: '2025-04-25T00:00:00.000Z'
                  document:
                    type: string
                    nullable: true
                    example: null
                  filing_attempts:
                    type: integer
                    example: 0
                    default: 0
                  amends:
                    type: array
                    items:
                      type: string
                  amended_by:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                    example: blocked
                  status_history:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: blocked
                        status_at:
                          type: string
                          example: '2025-04-20T15:30:00.000Z'
                        blocked_reasons:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                example: held_by_customer
                              resource_type:
                                type: string
                                nullable: true
                                example: null
                              resource:
                                type: string
                                nullable: true
                                example: null
                              note:
                                type: string
                                nullable: true
                                example: null
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Blockers Already Present:
                  value: "{\n  \"message\": \"Blockers already present on filing: held_by_customer\",\n  \"code\": \"blockers_already_present\"\n}"
                Blockers Not Addable:
                  value: "{\n  \"message\": \"Cannot add blockers: invalid_ssn\",\n  \"code\": \"blockers_not_addable\"\n}"
                Manual Issue Policy Violation:
                  value: "{\n  \"message\": \"Action blocked by manual issue policy\",\n  \"code\": \"manual_issue_policy_violation\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
      deprecated: false
      tags:
      - Filings
  /filings/{filing_id}/remove_blockers:
    post:
      summary: Remove filing blockers
      description: Remove one or more blockers from a filing and return the updated filing. Only blockers that are currently open on the filing can be removed, and only while the filing is in `blocked` or `pending` status. Blockers that must be resolved through a Check support ticket, blockers Check applies automatically, and internal blockers cannot be removed through the API. Each blocker can be removed from a filing at most twice without a successful filing in between.
      operationId: remove-filing-blockers
      parameters:
      - name: filing_id
        in: path
        description: ID of the company filing
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - blockers
              properties:
                blockers:
                  type: array
                  description: List of blocker IDs to remove from the filing. Each ID must be a blocker that is currently open on the filing.
                  items:
                    type: string
                    example: held_by_customer
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: com_fil_AaeJoEAzbqqc2D9GMr3R
                    company: com_vIFHhvyGN47ej1upyIT8
                    year: 2025
                    period: q1
                    label: Federal Quarterly Filing - Q1
                    jurisdiction: fed
                    agency: agc_ukjABgbD0hQ3dfBRyMPD
                    due_at: '2025-04-30'
                    filed_at: null
                    closed_at: null
                    document: null
                    filing_attempts: 0
                    amends: null
                    amended_by: null
                    status: pending
                    status_history:
                    - status: pending
                      status_at: '2025-04-01T10:00:00.000Z'
                      blocked_reasons: []
                    - status: pending
                      status_at: '2025-04-20T15:30:00.000Z'
                      blocked_reasons: []
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: com_fil_AaeJoEAzbqqc2D9GMr3R
                  company:
                    type: string
                    example: com_vIFHhvyGN47ej1upyIT8
                  year:
                    type: integer
                    example: 2025
                    default: 0
                  period:
                    type: string
                    example: q1
                  label:
                    type: string
                    example: Federal Quarterly Filing - Q1
                  jurisdiction:
                    type: string
                    nullable: true
                    example: fed
                    description: Lowercase region code for the filing (`fed` or lowercased ISO 3166-2:US region code).
                  agency:
                    type: string
                    nullable: true
                    example: agc_ukjABgbD0hQ3dfBRyMPD
                    description: ID of the Agency that receives this filing.
                  due_at:
                    type: string
                    example: '2025-04-30'
                  filed_at:
                    type: string
                    nullable: true
                    example: null
                  closed_at:
                    type: string
                    nullable: true
                    example: null
                  document:
                    type: string
                    nullable: true
                    example: null
                  filing_attempts:
                    type: integer
                    example: 0
                    default: 0
                  amends:
                    type: array
                    items:
                      type: string
                  amended_by:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                    example: pending
                  status_history:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: pending
                        status_at:
                          type: string
                          example: '2025-04-20T15:30:00.000Z'
                        blocked_reasons:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                example: held_by_customer
                              resource_type:
                                type: string
                                nullable: true
                                example: null
                              resource:
                                type: string
                                nullable: true
                                example: null
                              note:
                                type: string
                                nullable: true
                                example: null
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Blockers Not Found:
                  value: "{\n  \"message\": \"Blockers not found on filing: held_by_customer\",\n  \"code\": \"blockers_not_found\"\n}"
                Blockers Require Zendesk Ticket:
                  value: "{\n  \"message\": \"Cannot remove blockers: 1 blocker requires a support ticket: Filed by customer\",\n  \"code\": \"blockers_require_zendesk_ticket\"\n}"
                Blockers Not Removable:
                  value: "{\n  \"message\": \"Cannot remove blockers: Company bad standing\",\n  \"code\": \"blockers_not_removable\"\n}"
                Manual Issue Policy Violation:
                  value: "{\n  \"message\": \"Action blocked by manual issue policy\",\n  \"code\": \"manual_issue_policy_violation\"\n}"
                Too Many Blocker Removal Attempts:
                  value: "{\n  \"message\": \"Too many attempts to remove the same blocker without a successful filing. Please ensure the blocker is resolved with the agency and then contact support.\",\n  \"code\": \"too_many_blocker_removal_attempts\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
      deprecated: false
      tags:
      - Filings
