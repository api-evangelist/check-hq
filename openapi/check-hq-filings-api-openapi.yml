openapi: 3.2.0
info:
  title: check-api Filings API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Filings
paths:
  /filings:
    get:
      summary: List filings
      description: List all filings
      operationId: list-company-filings
      parameters:
      - name: company
        in: query
        description: Company ID for which to limit the filing results.
        schema:
          type: string
      - name: jurisdiction
        in: query
        description: Jurisdictions to filter to, as lowercase region codes (e.g. `fed`, `ny`, `pa`). Repeat the parameter to provide multiple values.
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - blocked
          - filed
          - inapplicable
      - name: year
        in: query
        schema:
          type: integer
          format: int32
      - name: period
        in: query
        schema:
          type: string
          enum:
          - annual
          - q1
          - q2
          - q3
          - q4
          - january
          - february
          - march
          - april
          - may
          - june
          - july
          - august
          - september
          - october
          - november
          - december
          - other
      - in: query
        name: limit
        schema:
          type: integer
          default: '25'
        description: 'Number of results to return per page. Valid values range from 1 to 500. '
      - in: query
        name: is_amendment
        schema:
          type: boolean
        description: Filter for amendment filings with true, and original filings with false. As a reminder, amendments only surface when the status is `submitted` or `filed`
      - name: correction
        in: query
        description: Filter to company filings that a [correction](https://docs.checkhq.com/reference/the-correction-object) sourced during correction processing. Only filings with a `SOURCED` activity from the correction are included; filings the correction only re-synced are excluded.
        schema:
          type: string
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    next: null
                    previous: null
                    results:
                    - id: com_fil_9kL2mN8pQ4rS6tU1vW3x
                      company: com_7bF9dG2hJ5kM8nP1qR4s
                      year: 2024
                      period: q1
                      label: Federal Quarterly Filing - Q1
                      jurisdiction: fed
                      agency: agc_ukjABgbD0hQ3dfBRyMPD
                      due_at: '2024-04-15'
                      filed_at: '2024-04-12T16:30:25.847Z'
                      closed_at: '2024-04-08T00:00:00.000Z'
                      document: doc_3aE6fH9iL2mO5pR8sV1y
                      filing_attempts: 2
                      amends: null
                      amended_by: null
                      status: filed
                      status_history:
                      - status: inapplicable
                        status_at: '2024-01-15T10:30:15.423Z'
                        blocked_reasons: []
                      - status: pending
                        status_at: '2024-01-20T14:45:32.156Z'
                        blocked_reasons: []
                      - status: blocked
                        status_at: '2024-03-10T09:15:48.792Z'
                        blocked_reasons:
                        - type: applied_for_tax_id
                          resource_type: company_tax_param
                          resource: spa_h7zSw4NITCtef4Taf5yA
                          note: null
                      - status: pending
                        status_at: '2024-03-12T11:20:07.234Z'
                        blocked_reasons: []
                      - status: submitted
                        status_at: '2024-03-12T11:23:07.234Z'
                        blocked_reasons: []
                      - status: filed
                        status_at: '2024-04-12T16:30:25.847Z'
                        blocked_reasons: []
              schema:
                type: object
                properties:
                  next:
                    type: string
                  previous:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: com_fil_9kL2mN8pQ4rS6tU1vW3x
                        company:
                          type: string
                          example: com_7bF9dG2hJ5kM8nP1qR4s
                        year:
                          type: integer
                          example: 2024
                          default: 0
                        period:
                          type: string
                          example: q1
                        label:
                          type: string
                          example: Federal Quarterly Filing - Q1
                        jurisdiction:
                          type: string
                          nullable: true
                          example: fed
                          description: Lowercase region code for the filing (`fed` or lowercased ISO 3166-2:US region code).
                        agency:
                          type: string
                          nullable: true
                          example: agc_ukjABgbD0hQ3dfBRyMPD
                          description: ID of the Agency that receives this filing.
                        due_at:
                          type: string
                          example: '2024-04-15'
                        filed_at:
                          type: string
                          example: '2024-04-12T16:30:25.847Z'
                        closed_at:
                          type: string
                          example: '2024-04-08T00:00:00.000Z'
                        document:
                          type: string
                          example: doc_3aE6fH9iL2mO5pR8sV1y
                        filing_attempts:
                          type: integer
                          example: 2
                          default: 0
                        amends:
                          type: array
                          items:
                            type: string
                        amended_by:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                          example: filed
                        status_history:
                          type: array
                          items:
                            type: object
                            properties:
                              status:
                                type: string
                                example: inapplicable
                              status_at:
                                type: string
                                example: '2024-01-15T10:30:15.423Z'
                              blocked_reasons:
                                type: array
                                items:
                                  type: object
                                  properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Filings
