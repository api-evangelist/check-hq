openapi: 3.2.0
info:
  title: check-api Earning Codes API
  version: '2025-01-01'
servers:
- url: https://sandbox.checkhq.com
security:
- sec0: []
tags:
- name: Earning Codes
paths:
  /earning_codes:
    post:
      summary: Create an earning code
      description: ''
      operationId: create-an-earning-code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - name
              - type
              properties:
                company:
                  type: string
                name:
                  type: string
                type:
                  type: string
                active:
                  type: boolean
                  description: Used to distinguish between codes used only for loading historical data (inactive) and those that you support on an ongoing basis (active).
                  default: true
                calculation_overrides:
                  type: object
                  description: Used to define overrides that affect the tax calculation for earnings with this earning code
                  properties:
                    wa_risk_class_code:
                      type: string
                      description: Used to override the risk class code for Washington Labor and Industries (L&I) that earnings with this earning code will be calculated and filed with. Must be in the format "####-##".
                metadata:
                  type: string
                  description: Additional loosely structured information to associate with the earning code
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Earning Codes
    get:
      summary: List earning codes
      description: Returns a list of earning codes.
      operationId: list-earning-codes
      parameters:
      - name: company
        in: query
        schema:
          type: string
      - name: limit
        in: query
        description: Number of earning codes returned per page. The maximum value is 25.
        schema:
          type: integer
          format: int32
      - name: id
        in: query
        description: Filter the list to the specified IDs. For more details, check out the [Bulk Get Requests guide](https://docs.checkhq.com/docs/bulk-resource-get-requests).
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Earning Codes
  /earning_codes/{earning_code}:
    get:
      summary: Get an earning code
      description: ''
      operationId: get-an-earning-code
      parameters:
      - name: earning_code
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": \"erc_pz0fmJeuVcaPb99N0nw9\",\n    \"company\": \"com_omSihPyKgr68wxFQ0xTn\",\n    \"type\": \"hourly\",\n    \"name\": \"Dishwasher\",\n    \"metadata\": {}\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: erc_pz0fmJeuVcaPb99N0nw9
                  company:
                    type: string
                    example: com_omSihPyKgr68wxFQ0xTn
                  type:
                    type: string
                    example: hourly
                  name:
                    type: string
                    example: Dishwasher
                  metadata:
                    type: object
                    properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Earning Codes
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: YOUR_API_KEY
